[workspace]
members = [
    "crates/veln-ast",
    "crates/veln-analysis",
    "crates/veln-backend-jvm",
    "crates/veln-cli",
    "crates/veln-core",
    "crates/veln-diagnostics",
    "crates/veln-editor",
    "crates/veln-ir",
    "crates/veln-language-service",
    "crates/veln-literals",
    "crates/veln-lsp",
    "crates/veln-mcp",
    "crates/veln-metrics",
    "crates/veln-project",
    "crates/veln-sema",
    "crates/veln-source",
    "crates/veln-stdlib",
    "crates/veln-syntax",
    "crates/veln-test",
    "tools/veln-repo-metrics",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
clap = "4.6.1"
proc-macro2 = "1.0.106"
sha2 = { version = "0.11.0", default-features = false }
serde_json = "1.0.151"
unicase = "=2.9.0"
unicode-normalization = "=0.1.25"
syn = "3.0.2"
veln-ast = { path = "crates/veln-ast" }
veln-analysis = { path = "crates/veln-analysis" }
veln-backend-jvm = { path = "crates/veln-backend-jvm" }
veln-core = { path = "crates/veln-core" }
veln-diagnostics = { path = "crates/veln-diagnostics" }
veln-editor = { path = "crates/veln-editor" }
veln-ir = { path = "crates/veln-ir" }
veln-language-service = { path = "crates/veln-language-service" }
veln-literals = { path = "crates/veln-literals" }
veln-lsp = { path = "crates/veln-lsp" }
veln-mcp = { path = "crates/veln-mcp" }
veln-metrics = { path = "crates/veln-metrics" }
veln-project = { path = "crates/veln-project" }
veln-sema = { path = "crates/veln-sema" }
veln-source = { path = "crates/veln-source" }
veln-stdlib = { path = "crates/veln-stdlib" }
veln-syntax = { path = "crates/veln-syntax" }
veln-test = { path = "crates/veln-test" }

[workspace.lints.rust]
unsafe_code = "forbid"
