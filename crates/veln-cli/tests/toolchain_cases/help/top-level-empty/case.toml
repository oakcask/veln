command = []
exit = 0

[stdout]
format = "text"

[stderr]
format = "empty"

[help]
usage = "veln [COMMAND]"
commands = ["  check    Check source files", "  doc      Generate documentation", "  fmt      Format source files", "  run      Run an entry function", "  test     Run tests", "  repair   Preview or apply repair candidates", "  explain  Explain diagnostics", "  lsp      Run the language server on stdio", "  help     Print this message or the help of the given subcommand(s)"]
options = ["  -h, --help     Print help", "  -V, --version  Print version"]
