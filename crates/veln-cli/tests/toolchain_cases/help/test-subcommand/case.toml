command = ["test", "--help"]
exit = 0

[stdout]
format = "text"

[stderr]
format = "empty"

[help]
summary = "Run tests"
usage = "veln test [OPTIONS] [TARGETS]..."
arguments = ["  [TARGETS]...  Source files, directories, or test targets"]
options = ["      --json         Emit machine-readable JSON", "  -j, --jobs <JOBS>  Maximum runnable test cases to execute concurrently", "  -h, --help         Print help"]
