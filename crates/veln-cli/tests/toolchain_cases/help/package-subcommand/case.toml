command = ["package", "--help"]
exit = 0

[stdout]
format = "text"

[stderr]
format = "empty"

[help]
summary = "Manage package dependencies"
usage = "veln package <COMMAND>"
commands = ["  lock  Write veln.lock for path, git, and vendor dependencies", "  help  Print this message or the help of the given subcommand(s)"]
options = ["  -h, --help  Print help"]
