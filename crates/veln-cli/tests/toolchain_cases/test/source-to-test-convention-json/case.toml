command = ["test", "--json", "app.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "blocked"

[[json_assert]]
path = "selection.mode"
equals = "explicit"

[[json_assert]]
path = "selection.targets.0"
equals = "app.veln"

[[json_assert]]
path = "selection.targets.1"
equals = "app_test.veln"

[[json_assert]]
path = "selection.reason"
equals = "source_to_test_convention"

[[json_assert]]
path = "summary.total"
equals = 1

[[json_assert]]
path = "cases.0.name"
equals = "paired"

[[json_assert]]
path = "cases.0.status"
equals = "blocked"

[[json_assert]]
path = "cases.0.reason"
equals = "static_gate"

[[json_assert]]
path = "cases.0.diagnostics.0.id"
equals = "hole.unfilled"
