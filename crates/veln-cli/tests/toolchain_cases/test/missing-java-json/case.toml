command = ["test", "--json"]
exit = 1

[tools]
java = "missing"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.total"
equals = 1

[[json_assert]]
path = "summary.errors"
equals = 1

[[json_assert]]
path = "cases.0.name"
equals = "passes"

[[json_assert]]
path = "cases.0.failure.kind"
equals = "runtime"

[[json_assert]]
path = "cases.0.failure.message"
equals = "veln: `java` was not found; install a JDK to use `veln test`"
