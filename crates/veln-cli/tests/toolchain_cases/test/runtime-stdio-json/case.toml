command = ["test", "--json"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "schema_version"
equals = "veln-test-json/v0"

[[json_assert]]
path = "command"
equals = "test"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "selection.mode"
equals = "discovered"

[[json_assert]]
path = "selection.targets.0"
equals = "main_test.veln"

[[json_assert]]
path = "summary.total"
equals = 2

[[json_assert]]
path = "summary.passed"
equals = 1

[[json_assert]]
path = "summary.failed"
equals = 1

[[json_assert]]
path = "cases.0.name"
equals = "passes"

[[json_assert]]
path = "cases.0.status"
equals = "passed"

[[json_assert]]
path = "cases.0.events.0.stream"
equals = "stdout"

[[json_assert]]
path = "cases.0.events.0.text"
equals = "out"

[[json_assert]]
path = "cases.0.events.1.stream"
equals = "stderr"

[[json_assert]]
path = "cases.0.events.1.text"
equals = "err"

[[json_assert]]
path = "cases.1.name"
equals = "fails"

[[json_assert]]
path = "cases.1.status"
equals = "failed"

[[json_assert]]
path = "cases.1.failure.kind"
equals = "result"
