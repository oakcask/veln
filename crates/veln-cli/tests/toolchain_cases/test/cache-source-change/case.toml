command = ["test", "--json"]
exit = 0
repeat = 2

[tools]
java = "fake-success"

[skip]
platforms = ["windows"]
reason = "fake java wrapper uses a Unix executable script"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[project_update]]
before_run = 2
path = "main_test.veln"
contents = "test passes() -> () effects [stdio]\n  stdio::println(\"changed\")\n  ()\nend\n"

[[jvm_cache_assert]]
run = 1
ready_entries = 1

[[jvm_cache_assert]]
run = 2
ready_entries = 2
