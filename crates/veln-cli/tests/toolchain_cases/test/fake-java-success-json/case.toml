command = ["test", "--json"]
exit = 0

[tools]
java = "fake-success"

[skip]
platforms = ["windows"]
reason = "fake java wrapper uses a Unix executable script"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "summary.total"
equals = 1

[[json_assert]]
path = "summary.passed"
equals = 1

[[json_assert]]
path = "cases.0.name"
equals = "passes"

[[json_assert]]
path = "cases.0.status"
equals = "passed"
