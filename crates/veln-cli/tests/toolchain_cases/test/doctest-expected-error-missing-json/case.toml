command = ["test", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "schema_version"
equals = "veln-test-json/v0"

[[json_assert]]
path = "command"
equals = "test"

[[json_assert]]
path = "status"
equals = "blocked"

[[json_assert]]
path = "summary.total"
equals = 1

[[json_assert]]
path = "summary.blocked"
equals = 1

[[json_assert]]
path = "summary.errors"
equals = 0

[[json_assert]]
path = "diagnostics.0.details.kind"
equals = "doctest_metadata"

[[json_assert]]
path = "cases.0.name"
equals = "passes"

[[json_assert]]
path = "cases.0.kind"
equals = "test"

[[json_assert]]
path = "cases.0.status"
equals = "blocked"

[[json_assert]]
path = "cases.0.reason"
equals = "static_gate"

[[diagnostics]]
id = "doctest.expected_failure_missing"
severity = "error"
kind = "doc"
message = "negative doctest produced no error diagnostics"

[diagnostics.span]
file = "main.veln"
line = 1
column = 1
