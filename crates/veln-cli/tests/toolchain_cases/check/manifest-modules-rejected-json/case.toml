command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[diagnostics]]
id = "manifest.unsupported_section"
severity = "error"
kind = "module"
message = "`[modules]` is not supported; use `[lib].exports` for public source files"

[diagnostics.span]
file = "veln.toml"
line = 1
column = 2
