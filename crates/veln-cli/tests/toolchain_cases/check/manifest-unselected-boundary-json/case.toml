command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 2

[[diagnostics]]
id = "manifest.unselected_export"
severity = "error"
kind = "module"
message = "manifest export `unselected.veln` has no matching selected source file"

[diagnostics.span]
file = "veln.toml"
line = 4
column = 4

[[diagnostics]]
id = "manifest.missing_export"
severity = "error"
kind = "module"
message = "manifest export `missing.veln` does not exist"

[diagnostics.span]
file = "veln.toml"
line = 5
column = 4
