command = ["run", "--json", "main", "main.veln"]
exit = 0

[tools]
java = "fake-success"

[skip]
platforms = ["windows"]
reason = "fake java wrapper uses a Unix executable script"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "exit_code"
equals = 0

[[json_assert]]
path = "stdout"
equals = ""

[[json_assert]]
path = "stderr"
equals = ""
