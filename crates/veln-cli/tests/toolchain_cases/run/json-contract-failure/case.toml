command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "schema_version"
equals = "veln-run-json/v0"

[[json_assert]]
path = "command"
equals = "run"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "contract"

[[json_assert]]
path = "error.details.kind"
equals = "contract"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.clause"
equals = "require"

[[json_assert]]
path = "error.details.predicate"
equals = "false"

[[json_assert]]
path = "error.details.function"
equals = "main"

[[json_assert]]
path = "error.details.blame"
equals = "caller"
