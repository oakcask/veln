name: workflow / test scripts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/workflow--test-scripts.yaml
      - docs/**/*.md
      - workflow-scripts/**/*.mjs
  pull_request:
    paths:
      - .github/workflows/workflow--test-scripts.yaml
      - docs/**/*.md
      - workflow-scripts/**/*.mjs

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  test-workflow-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test workflow scripts
        run: node --test workflow-scripts/*.test.mjs
      - name: Require review triggers in changed documentation
        env:
          DOC_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOC_REVIEW_HEAD_SHA: ${{ github.sha }}
        run: node workflow-scripts/check-doc-review-triggers.mjs
