name: workflow / test scripts

on:
  push:
    branches:
      - main
    paths:
      - .agents/skills/docs-progressive-disclosure/SKILL.md
      - .github/workflows/workflow--test-scripts.yaml
      - AGENTS.md
      - docs/**/*.md
      - workflow-scripts/**/*.mjs
  pull_request:
    paths:
      - .agents/skills/docs-progressive-disclosure/SKILL.md
      - .github/workflows/workflow--test-scripts.yaml
      - AGENTS.md
      - docs/**/*.md
      - workflow-scripts/**/*.mjs

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  test-workflow-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test workflow scripts
        run: node --test workflow-scripts/*.test.mjs
      - name: Validate frontmatter in changed documentation
        env:
          DOC_FRONTMATTER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOC_FRONTMATTER_HEAD_SHA: ${{ github.sha }}
        run: node workflow-scripts/check-doc-frontmatter.mjs
      - name: Validate proposal target readiness
        run: node workflow-scripts/check-proposal-target-readiness.mjs validate
      - name: Validate agent language-services lifecycle transition
        env:
          AGENT_LANGUAGE_SERVICES_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AGENT_LANGUAGE_SERVICES_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AGENT_LANGUAGE_SERVICES_EVENT_BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          AGENT_LANGUAGE_SERVICES_DEFAULT_REF: ${{ github.event.repository.default_branch }}
        run: >
          node workflow-scripts/check-agent-language-services-lifecycle.mjs validate-range
          --base "$AGENT_LANGUAGE_SERVICES_BASE_SHA"
          --head "$AGENT_LANGUAGE_SERVICES_HEAD_SHA"
          --event-base-ref "$AGENT_LANGUAGE_SERVICES_EVENT_BASE_REF"
          --default-ref "$AGENT_LANGUAGE_SERVICES_DEFAULT_REF"
