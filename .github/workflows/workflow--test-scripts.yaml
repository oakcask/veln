name: workflow / test scripts

on:
  push:
    branches:
      - main
    paths:
      - .agents/skills/docs-progressive-disclosure/SKILL.md
      - .agents/skills/veln-language/**
      - .github/actions/**/action.yaml
      - .github/workflows/*.yaml
      - AGENTS.md
      - crates/veln-mcp/schemas/mcp/v1/*.json
      - docs/**/*.md
      - scripts/agent-test
      - scripts/ci-run
      - workflow-scripts/fixtures/veln-language/**
      - workflow-scripts/**/*.mjs
  pull_request:
    paths:
      - .agents/skills/docs-progressive-disclosure/SKILL.md
      - .agents/skills/veln-language/**
      - .github/actions/**/action.yaml
      - .github/workflows/*.yaml
      - AGENTS.md
      - crates/veln-mcp/schemas/mcp/v1/*.json
      - docs/**/*.md
      - scripts/agent-test
      - scripts/ci-run
      - workflow-scripts/fixtures/veln-language/**
      - workflow-scripts/**/*.mjs

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  test-workflow-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test workflow scripts
        run: node --test workflow-scripts/*.test.mjs
      - name: Validate current specification explanations
        run: node workflow-scripts/check-specification.mjs
      - name: Reject unbounded Rust test commands
        run: node workflow-scripts/check-rust-test-memory-guards.mjs .github/workflows .github/actions
      - name: Validate frontmatter in changed documentation
        env:
          DOC_FRONTMATTER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOC_FRONTMATTER_HEAD_SHA: ${{ github.sha }}
        run: node workflow-scripts/check-doc-frontmatter.mjs
