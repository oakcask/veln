name: workflow / test scripts

on:
  push:
    branches:
      - main
    paths:
      - .agents/skills/veln-language/**
      - .github/actions/cargo-dependencies/action.yaml
      - .github/workflows/test--vscode-extension.yaml
      - .github/workflows/workflow--test-scripts.yaml
      - crates/veln-mcp/schemas/mcp/v1/*.json
      - crates/veln-project/testdata/case_folding_17_c_f.txt
      - crates/veln-stdlib/schemas/observability/v1/json-lines-exporter-health.schema.json
      - crates/veln-stdlib/schemas/observability/v1/json-lines-record.schema.json
      - docs/README.md
      - docs/specification/mcp.md
      - examples/specification/run/observability-json-lines-encoder/case-text/records.jsonl
      - examples/specification/run/observability-json-lines-host-boundary/case-text/health.jsonl
      - scripts/agent-test
      - scripts/ci-run
      - tools/veln-repo-language-reference/generated/language-reference-catalog-v1.json
      - tools/veln-repo-language-reference/generated/language-reference-catalog-v1.sha256
      - workflow-scripts/fixtures/veln-language/**
      - workflow-scripts/**/*.mjs
      - workflow-scripts/run-nextest.sh
  pull_request:
    paths:
      - .agents/skills/veln-language/**
      - .github/actions/cargo-dependencies/action.yaml
      - .github/workflows/test--vscode-extension.yaml
      - .github/workflows/workflow--test-scripts.yaml
      - crates/veln-mcp/schemas/mcp/v1/*.json
      - crates/veln-project/testdata/case_folding_17_c_f.txt
      - crates/veln-stdlib/schemas/observability/v1/json-lines-exporter-health.schema.json
      - crates/veln-stdlib/schemas/observability/v1/json-lines-record.schema.json
      - docs/README.md
      - docs/specification/mcp.md
      - examples/specification/run/observability-json-lines-encoder/case-text/records.jsonl
      - examples/specification/run/observability-json-lines-host-boundary/case-text/health.jsonl
      - scripts/agent-test
      - scripts/ci-run
      - tools/veln-repo-language-reference/generated/language-reference-catalog-v1.json
      - tools/veln-repo-language-reference/generated/language-reference-catalog-v1.sha256
      - workflow-scripts/fixtures/veln-language/**
      - workflow-scripts/**/*.mjs
      - workflow-scripts/run-nextest.sh

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  test-workflow-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test workflow scripts
        run: node --test workflow-scripts/*.test.mjs
