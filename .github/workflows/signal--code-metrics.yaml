name: signal / code metrics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/signal--code-metrics.yaml
      - .github/actions/cargo-dependencies/action.yaml
      - .github/actions/cargo-workflow-scripts/action.yaml
      - Cargo.lock
      - Cargo.toml
      - package.json
      - pnpm-lock.yaml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - tools/**/Cargo.toml
      - tools/**/*.rs
      - workflow-scripts/check-repo-metrics.mjs
      - workflow-scripts/check-repo-metrics.test.mjs
  pull_request:
    paths:
      - .github/workflows/signal--code-metrics.yaml
      - .github/actions/cargo-dependencies/action.yaml
      - .github/actions/cargo-workflow-scripts/action.yaml
      - Cargo.lock
      - Cargo.toml
      - package.json
      - pnpm-lock.yaml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - tools/**/Cargo.toml
      - tools/**/*.rs
      - workflow-scripts/check-repo-metrics.mjs
      - workflow-scripts/check-repo-metrics.test.mjs

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "26"
  # renovate: datasource=npm depName=pnpm
  PNPM_VERSION: "12.7.0"

jobs:
  rust-refactor-signals:
    name: Check Rust refactor signals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare Rust workflow scripts
        id: workflow-scripts
        uses: ./.github/actions/cargo-workflow-scripts
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install code metric dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Rust repository metrics policy
        run: |
          cargo run --locked -p veln-repo-metrics -- \
            --format json \
            --dependency-graph \
            --threshold 30 \
            --file-line-threshold 700 \
            crates tools \
            | node workflow-scripts/check-repo-metrics.mjs
      - name: Record code duplication refactor signals
        run: |
          pnpm exec jscpd . \
            --format rust \
            --min-tokens 50 \
            --min-lines 5 \
            --reporters json \
            --output "${RUNNER_TEMP}/jscpd" \
            --silent
          ${{ steps.workflow-scripts.outputs.binary }} summarize-duplication \
            "${RUNNER_TEMP}/jscpd/jscpd-report.json"
