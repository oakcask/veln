name: signal / code metrics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/signal--code-metrics.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
  pull_request:
    paths:
      - .github/workflows/signal--code-metrics.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-refactor-signals:
    name: Check Rust refactor signals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Check Rust refactor signals
        run: cargo run --locked -p veln-code-metrics -- --github-annotations --dependency-summary --threshold 30 --file-line-threshold 700 --max-warnings 50 --deny-numbered-split-files crates
