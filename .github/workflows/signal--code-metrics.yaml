name: signal / code metrics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/signal--code-metrics.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - tools/**/Cargo.toml
      - tools/**/*.rs
      - workflow-scripts/check-repo-metrics.mjs
      - workflow-scripts/check-repo-metrics.test.mjs
  pull_request:
    paths:
      - .github/workflows/signal--code-metrics.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - tools/**/Cargo.toml
      - tools/**/*.rs
      - workflow-scripts/check-repo-metrics.mjs
      - workflow-scripts/check-repo-metrics.test.mjs

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "26"

jobs:
  rust-refactor-signals:
    name: Check Rust refactor signals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check Rust repository metrics policy
        run: |
          cargo run --locked -p veln-repo-metrics -- \
            --format json \
            --dependency-graph \
            --threshold 30 \
            --file-line-threshold 700 \
            crates tools \
            | node workflow-scripts/check-repo-metrics.mjs
