name: test / rust

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test--rust.yaml
      - .config/nextest.toml
      - actions/**/*.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - tools/**/Cargo.toml
      - tools/**/*.rs
  pull_request:
    paths:
      - .github/workflows/test--rust.yaml
      - .config/nextest.toml
      - actions/**/*.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - tools/**/Cargo.toml
      - tools/**/*.rs

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # renovate: datasource=github-releases depName=nextest-rs/nextest versioning=semver extractVersion=^cargo-nextest-(?<version>.*)$
  NEXTEST_VERSION: "0.9.140"
  NEXTEST_SHARDS: "4"

jobs:
  seed-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Seed Rust test caches
        uses: ./actions/nextest
        with:
          nextest-version: ${{ env.NEXTEST_VERSION }}
          save-cache: true

  test:
    name: test shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Run Rust tests
        uses: ./actions/nextest
        with:
          nextest-version: ${{ env.NEXTEST_VERSION }}
          shard: ${{ matrix.shard }}
          shard-count: ${{ env.NEXTEST_SHARDS }}

  doc-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Prepare Cargo dependencies
        uses: ./actions/cargo-dependencies
      - name: Run Rust doctests
        run: cargo test --locked --workspace --doc
