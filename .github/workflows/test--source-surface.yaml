name: test / source surface

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test--source-surface.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/veln-cli/tests/toolchain_cases/**
      - crates/veln-project/**
      - crates/veln-source/**
      - docs/specification/source-surface-executable.pl
      - docs/specification/source-surface-fixtures/**
      - docs/specification/source-surface.md
      - examples/specification/**
      - rust-toolchain.toml
      - tools/veln-repo-toolchain-cases/**
      - tools/veln-repo-toolchain-case/**
      - workflow-scripts/check-source-surface-executable.mjs
  pull_request:
    paths:
      - .github/workflows/test--source-surface.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/veln-cli/tests/toolchain_cases/**
      - crates/veln-project/**
      - crates/veln-source/**
      - docs/specification/source-surface-executable.pl
      - docs/specification/source-surface-fixtures/**
      - docs/specification/source-surface.md
      - examples/specification/**
      - rust-toolchain.toml
      - tools/veln-repo-toolchain-cases/**
      - tools/veln-repo-toolchain-case/**
      - workflow-scripts/check-source-surface-executable.mjs

permissions:
  contents: read

jobs:
  test-source-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install SWI-Prolog for executable source-surface checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends swi-prolog-nox
      - name: Verify executable source-surface fixtures and generated grammar
        run: node workflow-scripts/check-source-surface-executable.mjs
      - name: Reject accepted Veln sources missing from the executable grammar
        run: cargo run --locked -p veln-repo-toolchain-cases -- .
