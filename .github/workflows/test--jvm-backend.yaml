name: test / jvm backend

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test--jvm-backend.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - crates/veln-backend-jvm/runtime/*.class
      - scripts/agent-run
      - scripts/ci-run
  pull_request:
    paths:
      - .github/workflows/test--jvm-backend.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - crates/veln-backend-jvm/runtime/*.class
      - scripts/agent-run
      - scripts/ci-run

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bytecode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Run JVM backend tests
        run: bash scripts/ci-run cargo test --locked -p veln-backend-jvm bytecode_backend -- --test-threads=1
      - name: Run JVM CLI fixtures
        run: bash scripts/ci-run cargo test --locked -p veln-cli --test check_json -- --test-threads=1
