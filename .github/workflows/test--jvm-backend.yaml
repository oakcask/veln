name: test / jvm backend

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test--jvm-backend.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - crates/veln-backend-jvm/runtime/*.class
  pull_request:
    paths:
      - .github/workflows/test--jvm-backend.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - crates/veln-backend-jvm/runtime/*.class

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bytecode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run JVM backend tests
        run: cargo test --locked -p veln-backend-jvm bytecode_backend
      - name: Run JVM CLI fixtures
        run: cargo test --locked -p veln-cli --test check_json
