name: test / jvm backend

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test--jvm-backend.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - crates/veln-backend-jvm/runtime/*.class
  pull_request:
    paths:
      - .github/workflows/test--jvm-backend.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - crates/veln-backend-jvm/runtime/*.class

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bytecode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run JVM backend tests
        run: cargo test --locked -p veln-backend-jvm bytecode_backend
      - name: Run JVM CLI fixtures
        run: cargo test --locked -p veln-cli --test check_json
