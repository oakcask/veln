name: test / jvm backend

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test--jvm-backend.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - crates/veln-backend-jvm/runtime/*.class
  pull_request:
    paths:
      - .github/workflows/test--jvm-backend.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - crates/veln-backend-jvm/runtime/*.class

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bytecode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run JVM backend tests
        run: cargo test --locked -p veln-backend-jvm bytecode_backend
      - name: Run JVM CLI fixtures
        run: cargo test --locked -p veln-cli --test check_json
