name: test / vscode extension

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test--vscode-extension.yaml
      - .github/actions/cargo-dependencies/action.yaml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - scripts/agent-run
      - scripts/ci-run
      - crates/**
      - tools/veln-repo-editor-assets/**
      - tools/veln-repo-language-reference/**
      - tools/veln-repo-mcp-standard-library-docs/**
      - tools/veln-repo-toolchain-case/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - docs/specification/source-surface-executable.pl
      - editors/vscode/**
  pull_request:
    paths:
      - .github/workflows/test--vscode-extension.yaml
      - .github/actions/cargo-dependencies/action.yaml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - scripts/agent-run
      - scripts/ci-run
      - crates/**
      - tools/veln-repo-editor-assets/**
      - tools/veln-repo-language-reference/**
      - tools/veln-repo-mcp-standard-library-docs/**
      - tools/veln-repo-toolchain-case/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - docs/specification/source-surface-executable.pl
      - editors/vscode/**

permissions:
  contents: read

env:
  NODE_VERSION: "26"
  # renovate: datasource=npm depName=pnpm
  PNPM_VERSION: "12.8.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Prepare Cargo dependencies
        uses: ./.github/actions/cargo-dependencies
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Test editor asset projection
        run: bash scripts/ci-run cargo test --locked -p veln-repo-editor-assets
      - name: Test VSCode extension
        run: pnpm --filter veln-language test
