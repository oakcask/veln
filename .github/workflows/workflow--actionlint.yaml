name: workflow / actionlint

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
      - workflow-scripts/check-github-yaml-extensions.mjs
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - workflow-scripts/check-github-yaml-extensions.mjs

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: "v1.7.12"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
      - name: Validate GitHub YAML extensions
        run: node workflow-scripts/check-github-yaml-extensions.mjs
      - name: Restore actionlint binary
        id: actionlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/actionlint/actionlint
          key: actionlint-${{ runner.os }}-${{ runner.arch }}-${{ env.ACTIONLINT_VERSION }}-${{ hashFiles('.github/workflows/workflow--actionlint.yaml') }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        with:
          go-version: stable
          cache: false
      - name: Install actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ github.workspace }}/.cache/actionlint
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - name: Save actionlint binary
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/actionlint/actionlint
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}
      - name: Validate workflows
        run: .cache/actionlint/actionlint
