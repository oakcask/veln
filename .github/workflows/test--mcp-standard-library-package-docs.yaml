name: test / MCP standard-library package docs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test--mcp-standard-library-package-docs.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - docs/reference/implemented-proposals/mcp-standard-library-package-documentation-resources.md
      - docs/specification/mcp.md
      - rust-toolchain.toml
      - tools/veln-repo-mcp-standard-library-docs/**
  pull_request:
    paths:
      - .github/workflows/test--mcp-standard-library-package-docs.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - docs/reference/implemented-proposals/mcp-standard-library-package-documentation-resources.md
      - docs/specification/mcp.md
      - rust-toolchain.toml
      - tools/veln-repo-mcp-standard-library-docs/**

permissions:
  contents: read

jobs:
  check-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check standard-library package-documentation resources are fresh
        run: cargo run --locked -p veln-repo-mcp-standard-library-docs -- . check-fresh
