name: lint / rust

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lint--rust.yaml
      - .cargo/config.toml
      - .github/actions/cargo-dependencies/action.yaml
      - .github/actions/clippy/action.yaml
      - .github/actions/setup-jdk/action.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - examples/specification/**
      - tools/**/Cargo.toml
      - tools/**/*.rs
  pull_request:
    paths:
      - .github/workflows/lint--rust.yaml
      - .cargo/config.toml
      - .github/actions/cargo-dependencies/action.yaml
      - .github/actions/clippy/action.yaml
      - .github/actions/setup-jdk/action.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - examples/specification/**
      - tools/**/Cargo.toml
      - tools/**/*.rs

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=github-releases depName=bnjbvr/cargo-machete
  CARGO_MACHETE_VERSION: "0.10.1"

jobs:
  unused-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-machete
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-machete@${{ env.CARGO_MACHETE_VERSION }}
      - name: Check for unused Cargo dependencies
        run: |
          echo 'Remove the unused dependencies reported below to keep manifests accurate and avoid unnecessary builds. For a false positive, add a narrowly scoped cargo-machete ignore with a comment explaining why the dependency is required.'
          cargo machete

  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Clippy lints
        uses: ./.github/actions/clippy
