name: lint / rust

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lint--rust.yaml
      - .cargo/config.toml
      - .github/actions/cargo-dependencies/action.yaml
      - .github/actions/clippy/action.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - examples/specification/**
      - tools/**/Cargo.toml
      - tools/**/*.rs
  pull_request:
    paths:
      - .github/workflows/lint--rust.yaml
      - .cargo/config.toml
      - .github/actions/cargo-dependencies/action.yaml
      - .github/actions/clippy/action.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - examples/specification/**
      - tools/**/Cargo.toml
      - tools/**/*.rs

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Clippy lints
        uses: ./.github/actions/clippy
