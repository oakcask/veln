name: lint / rust

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lint--rust.yaml
      - .github/actions/cached-cargo-tool/action.yaml
      - .github/actions/cargo-dependencies/action.yaml
      - .github/actions/clippy/action.yaml
      - .github/actions/setup-jdk/action.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - examples/specification/**
      - tools/**/Cargo.toml
      - tools/**/*.rs
  pull_request:
    paths:
      - .github/workflows/lint--rust.yaml
      - .github/actions/cached-cargo-tool/action.yaml
      - .github/actions/cargo-dependencies/action.yaml
      - .github/actions/clippy/action.yaml
      - .github/actions/setup-jdk/action.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - examples/specification/**
      - tools/**/Cargo.toml
      - tools/**/*.rs

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=github-releases depName=bnjbvr/cargo-machete
  CARGO_MACHETE_VERSION: "0.10.1"

jobs:
  unused-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-machete
        uses: ./.github/actions/cached-cargo-tool
        with:
          tool: cargo-machete
          version: ${{ env.CARGO_MACHETE_VERSION }}
      - name: Check for unused Cargo dependencies
        id: unused-dependencies
        run: cargo machete
      - name: Explain how to resolve unused dependencies
        if: failure() && steps.unused-dependencies.outcome == 'failure'
        run: echo '::error::Remove the unused dependencies reported above to keep manifests accurate and avoid unnecessary builds. For a false positive, add a narrowly scoped cargo-machete ignore with a comment explaining why the dependency is required.'

  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Clippy lints
        uses: ./.github/actions/clippy
