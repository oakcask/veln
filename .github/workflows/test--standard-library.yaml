name: test / standard library

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test--standard-library.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - crates/veln-stdlib/veln/**
      - scripts/agent-run
      - scripts/agent-stdlib-test
  pull_request:
    paths:
      - .github/workflows/test--standard-library.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - crates/**/*.rs
      - crates/veln-stdlib/veln/**
      - scripts/agent-run
      - scripts/agent-stdlib-test

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Veln standard library tests
        run: bash scripts/agent-stdlib-test
