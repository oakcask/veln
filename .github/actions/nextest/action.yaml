name: Prepare and run nextest
description: Prepare nextest, optionally build a test archive, run one shard, or seed caches.

inputs:
  nextest-version:
    description: Version of cargo-nextest to install.
    required: true
  shard:
    description: One-based shard number to run.
    required: false
  shard-count:
    description: Total number of nextest shards.
    required: false
  archive-file:
    description: Path to the shared nextest archive to build or run.
    required: false
  build-archive:
    description: Whether to build the shared nextest archive.
    required: false
    default: "false"
  save-cache:
    description: Whether to fetch dependencies and save cache misses.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore cargo-nextest cache
      id: cargo-nextest-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cargo/bin/cargo-nextest
        key: cargo-nextest-${{ runner.os }}-${{ inputs.nextest-version }}
    - name: Prepare Cargo dependencies
      if: inputs.archive-file == '' || inputs.build-archive == 'true'
      uses: ./.github/actions/cargo-dependencies
      with:
        save-cache: ${{ inputs.save-cache }}
    - name: Install cargo-nextest
      uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
      with:
        tool: cargo-nextest@${{ inputs.nextest-version }}
    - name: Save cargo-nextest cache
      if: inputs.save-cache == 'true' && steps.cargo-nextest-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cargo/bin/cargo-nextest
        key: cargo-nextest-${{ runner.os }}-${{ inputs.nextest-version }}
    - name: Build Rust test archive
      if: inputs.build-archive == 'true'
      shell: bash
      env:
        NEXTEST_ARCHIVE_FILE: ${{ inputs.archive-file }}
      run: cargo nextest archive --locked --workspace --archive-file "$NEXTEST_ARCHIVE_FILE"
    - name: Run Rust tests
      if: inputs.shard != ''
      shell: bash
      env:
        NEXTEST_ARCHIVE_FILE: ${{ inputs.archive-file }}
      run: cargo nextest run --archive-file "$NEXTEST_ARCHIVE_FILE" --extract-to . --extract-overwrite --profile ci --partition count:${{ inputs.shard }}/${{ inputs.shard-count }}
    - name: Upload nextest JUnit report
      if: always() && inputs.shard != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nextest-junit-${{ inputs.shard }}
        path: target/nextest/ci/junit.xml
        if-no-files-found: error
