name: Prepare and run nextest
description: Prepare cached Rust test tools and optionally run one nextest shard.

inputs:
  nextest-version:
    description: Version of cargo-nextest to install.
    required: true
  llvm-cov-version:
    description: Version of cargo-llvm-cov to install.
    required: true
  shard:
    description: One-based shard number to run.
    required: false
  shard-count:
    description: Total number of nextest shards in this suite.
    required: false
  suite:
    description: Suite identity used to keep timing and coverage artifacts distinct.
    required: false
  filterset:
    description: Nextest filterset selecting this suite's tests.
    required: false
  save-cache:
    description: Whether to save Cargo dependency and test tool cache misses.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up supported JDK
      uses: ./.github/actions/setup-jdk
    - name: Restore cargo-nextest cache
      id: cargo-nextest-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cargo/bin/cargo-nextest
        key: cargo-nextest-${{ runner.os }}-${{ inputs.nextest-version }}
    - name: Restore cargo-llvm-cov cache
      id: cargo-llvm-cov-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cargo/bin/cargo-llvm-cov
        key: cargo-llvm-cov-${{ runner.os }}-${{ inputs.llvm-cov-version }}
    - name: Prepare Cargo dependencies
      uses: ./.github/actions/cargo-dependencies
      with:
        save-cache: ${{ inputs.save-cache }}
    - name: Install cargo-nextest
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
      with:
        tool: cargo-nextest@${{ inputs.nextest-version }}
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
      with:
        tool: cargo-llvm-cov@${{ inputs.llvm-cov-version }}
    - name: Install LLVM coverage tools
      shell: bash
      run: rustup component add llvm-tools-preview
    - name: Save cargo-nextest cache
      if: inputs.save-cache == 'true' && steps.cargo-nextest-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cargo/bin/cargo-nextest
        key: cargo-nextest-${{ runner.os }}-${{ inputs.nextest-version }}
    - name: Save cargo-llvm-cov cache
      if: inputs.save-cache == 'true' && steps.cargo-llvm-cov-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cargo/bin/cargo-llvm-cov
        key: cargo-llvm-cov-${{ runner.os }}-${{ inputs.llvm-cov-version }}
    - name: Run Rust tests
      if: inputs.shard != ''
      shell: bash
      env:
        NEXTEST_FILTERSET: ${{ inputs.filterset }}
      run: bash scripts/ci-run cargo llvm-cov --no-report nextest --locked --workspace --profile ci --filterset "${NEXTEST_FILTERSET}" --partition count:${{ inputs.shard }}/${{ inputs.shard-count }}
    - name: Generate Rust shard coverage report
      if: inputs.shard != ''
      shell: bash
      run: |
        mkdir -p target/coverage
        cargo llvm-cov report --lcov --output-path target/coverage/lcov.info
    - name: Upload nextest JUnit report
      if: always() && inputs.shard != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nextest-junit-${{ inputs.suite }}-${{ inputs.shard }}-of-${{ inputs.shard-count }}
        path: target/nextest/ci/junit.xml
        if-no-files-found: error
    - name: Upload Rust shard coverage report
      if: inputs.shard != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nextest-coverage-${{ inputs.suite }}-${{ inputs.shard }}
        path: target/coverage/lcov.info
        if-no-files-found: error
