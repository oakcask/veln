name: Prepare and run nextest
description: Restore a rolling main Rust test build and optionally run one nextest shard or update the cache.

inputs:
  build-cache-revision:
    description: Main commit revision represented by the primary build-cache key.
    required: true
  github-token:
    description: Token used to prune obsolete main build caches after an update.
    required: false
    default: ""
  nextest-version:
    description: Version of cargo-nextest to install.
    required: true
  shard:
    description: One-based shard number to run.
    required: false
  shard-count:
    description: Total number of nextest shards.
    required: false
  save-cache:
    description: Whether to build and save cache misses for the main branch.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore cargo-nextest cache
      id: cargo-nextest-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cargo/bin/cargo-nextest
        key: cargo-nextest-${{ runner.os }}-${{ inputs.nextest-version }}
    - name: Prepare Cargo dependencies
      uses: ./.github/actions/cargo-dependencies
      with:
        save-cache: ${{ inputs.save-cache }}
    - name: Restore main Rust test build cache
      id: rust-test-build-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: target
        key: rust-test-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ inputs.build-cache-revision }}
        restore-keys: rust-test-build-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
    - name: Install cargo-nextest
      uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
      with:
        tool: cargo-nextest@${{ inputs.nextest-version }}
    - name: Save cargo-nextest cache
      if: inputs.save-cache == 'true' && steps.cargo-nextest-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cargo/bin/cargo-nextest
        key: cargo-nextest-${{ runner.os }}-${{ inputs.nextest-version }}
    - name: Build main Rust test cache
      if: inputs.save-cache == 'true' && steps.rust-test-build-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo nextest run --locked --workspace --profile ci --no-run
    - name: Save main Rust test build cache
      if: inputs.save-cache == 'true' && steps.rust-test-build-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: target
        key: ${{ steps.rust-test-build-cache.outputs.cache-primary-key }}
    - name: Prune obsolete main Rust test build caches
      if: inputs.save-cache == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RUST_TEST_BUILD_CACHE_KEY: ${{ steps.rust-test-build-cache.outputs.cache-primary-key }}
        RUST_TEST_BUILD_CACHE_PREFIX: rust-test-build-${{ runner.os }}-
      run: node workflow-scripts/prune-rust-test-build-caches.mjs
    - name: Run Rust tests
      if: inputs.shard != ''
      shell: bash
      run: cargo nextest run --locked --workspace --profile ci --partition count:${{ inputs.shard }}/${{ inputs.shard-count }}
    - name: Upload nextest JUnit report
      if: always() && inputs.shard != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nextest-junit-${{ inputs.shard }}
        path: target/nextest/ci/junit.xml
        if-no-files-found: error
