name: Prepare cached Cargo tool
description: Restore a standalone Cargo tool binary or install its pinned release.

inputs:
  tool:
    description: Standalone Cargo tool binary name.
    required: true
  version:
    description: Exact release version to install.
    required: true

runs:
  using: composite
  steps:
    - name: Restore Cargo tool binary
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.CARGO_HOME || '~/.cargo' }}/bin/${{ inputs.tool }}
        key: cargo-tool-${{ runner.os }}-${{ runner.arch }}-${{ inputs.tool }}-${{ inputs.version }}-${{ hashFiles('.github/actions/cached-cargo-tool/action.yaml') }}
    - name: Install Cargo tool binary
      if: steps.cache.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
      with:
        tool: ${{ inputs.tool }}@${{ inputs.version }}
        fallback: none
    - name: Save Cargo tool binary
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.CARGO_HOME || '~/.cargo' }}/bin/${{ inputs.tool }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - name: Add Cargo tools to PATH
      shell: bash
      run: echo "${CARGO_HOME:-${HOME}/.cargo}/bin" >> "${GITHUB_PATH}"
