command = ["metrics", "--json", "App.veln", "probe.veln"]
exit = 1
source_errors = "expected"

[stdout]
format = "json"
not_contains = ["\"module\":\"App\"", "\"module\":\"app\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "incomplete"

[[json_assert]]
path = "project.selected_paths.0"
equals = "App.veln"

[[json_assert]]
path = "project.selected_paths.1"
equals = "probe.veln"

[[json_assert]]
path = "modules.0.module"
equals = "probe"

[[json_assert]]
path = "abc_subjects.0.identity"
equals = "App.veln::entry"

[[json_assert]]
path = "abc_subjects.1.identity"
equals = "probe.veln::probe"
