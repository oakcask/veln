command = ["metrics", "--json"]
source_errors = "expected"
exit = 1

[stdout]
format = "json"
not_contains = ["module.unresolved_import"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "incomplete"

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.0.details.origin"
equals = "source_path"

[[json_assert]]
path = "completeness.status"
equals = "partial"

[[json_assert]]
path = "completeness.excluded_sources.0.path"
equals = "App.veln"

[[json_assert]]
path = "completeness.excluded_sources.0.reason"
equals = "invalid_module_identity"

[[json_assert]]
path = "summary.project_module_count"
equals = 2

[[json_assert]]
path = "summary.internal_edge_count"
equals = 0

[[json_assert]]
path = "summary.abc_subject_count"
equals = 3

[[json_assert]]
path = "abc_subjects.0.identity"
equals = "App.veln::invalid_subject"
