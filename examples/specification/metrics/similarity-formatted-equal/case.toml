command = ["metrics", "--json"]
exit = 0

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "summary.similarity_fingerprint_count"
equals = 5

[[json_assert]]
path = "summary.similarity_instance_count"
equals = 2

[[json_assert]]
path = "summary.similarity_region_count"
equals = 4

[[json_assert]]
path = "similarities.0.experimental"
equals = true

[[json_assert]]
path = "similarities.0.token_count"
equals = 19

[[json_assert]]
path = "similarities.0.declarations.0.identity"
equals = "app.veln::cleanup_first"

[[json_assert]]
path = "similarities.0.declarations.1.identity"
equals = "app.veln::cleanup_second"

[[json_assert]]
path = "similarities.0.declarations.2.identity"
missing = true

[[json_assert]]
path = "similarities.1.token_count"
equals = 10

[[json_assert]]
path = "similarities.1.declarations.0.identity"
equals = "app.veln::first"

[[json_assert]]
path = "similarities.1.declarations.1.identity"
equals = "app.veln::second"
