command = ["metrics", "--check", "--baseline", "metrics.baseline.json", "--json"]
exit = 0

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "ok"

[[json_assert]]
path = "check.result"
equals = "pass"

[[json_assert]]
path = "summary.similarity_instance_count"
equals = 1

[[json_assert]]
path = "check.violations.0.policy"
missing = true
