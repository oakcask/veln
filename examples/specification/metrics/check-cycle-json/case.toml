command = ["metrics", "--check", "--json"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "policy_violation"

[[json_assert]]
path = "check.result"
equals = "fail"

[[json_assert]]
path = "check.violations.0.policy"
equals = "deny_cycles"

[[json_assert]]
path = "check.violations.0.path.0"
equals = "app"

[[json_assert]]
path = "check.violations.0.path.2"
equals = "app"

[[json_assert]]
path = "check.violations.0.guidance"
equals = "review module ownership and dependency direction"

[[json_assert]]
path = "summary.cycle_count"
equals = 1

[[json_assert]]
path = "modules.0.module"
equals = "app"
