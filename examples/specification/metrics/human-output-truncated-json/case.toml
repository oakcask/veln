command = ["metrics", "--json"]
exit = 0

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "human_output.max_findings"
equals = 2

[[json_assert]]
path = "human_output.total_findings"
equals = 5

[[json_assert]]
path = "human_output.omitted_findings"
equals = 3

[[json_assert]]
path = "human_output.truncated"
equals = true

[[json_assert]]
path = "summary.project_module_count"
equals = 2

[[json_assert]]
path = "summary.selected_module_count"
equals = 2

[[json_assert]]
path = "summary.internal_edge_count"
equals = 2

[[json_assert]]
path = "summary.cycle_count"
equals = 1

[[json_assert]]
path = "summary.abc_subject_count"
equals = 2

[[json_assert]]
path = "cycles.0.path.0"
equals = "app"

[[json_assert]]
path = "cycles.0.path.1"
equals = "util"

[[json_assert]]
path = "cycles.0.path.2"
equals = "app"

[[json_assert]]
path = "modules.0.module"
equals = "app"

[[json_assert]]
path = "modules.1.module"
equals = "util"

[[json_assert]]
path = "edges.0.source"
equals = "app"

[[json_assert]]
path = "edges.0.target"
equals = "util"

[[json_assert]]
path = "edges.1.source"
equals = "util"

[[json_assert]]
path = "edges.1.target"
equals = "app"

[[json_assert]]
path = "abc_subjects.0.identity"
equals = "app.veln::main"

[[json_assert]]
path = "abc_subjects.1.identity"
equals = "util.veln::value"
