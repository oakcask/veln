command = ["metrics", "--check", "--json"]
source_errors = "expected"
exit = 1

[stdout]
format = "json"
not_contains = ["\"result\":\"pass\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "incomplete"

[[json_assert]]
path = "check.result"
equals = "incomplete"

[[json_assert]]
path = "summary.cycle_count"
equals = 0

[[json_assert]]
path = "completeness.excluded_sources.0.path"
equals = "App.veln"
