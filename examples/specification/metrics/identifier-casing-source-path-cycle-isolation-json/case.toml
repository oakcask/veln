command = ["metrics", "--check", "--json"]
source_errors = "expected"
exit = 1

[stdout]
format = "json"
contains = [
  "\"cycle_count\":1",
  "\"project_module_count\":2",
]
not_contains = ["App::bridge"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "policy_violation"

[[json_assert]]
path = "check.result"
equals = "fail"

[[json_assert]]
path = "summary.project_module_count"
equals = 2

[[json_assert]]
path = "summary.cycle_count"
equals = 1

[[json_assert]]
path = "cycles.0.members.0"
equals = "app"

[[json_assert]]
path = "cycles.0.members.1"
equals = "util"
