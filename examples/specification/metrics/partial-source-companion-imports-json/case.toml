command = ["metrics", "--json"]
exit = 1
source_errors = "expected"

[stdout]
format = "json"
not_contains = ["module.unresolved_import", "\"module\":\"App\"", "\"module\":\"App__test_companion\"", "\"source\":\"app\",\"target\":\"App__test_companion\"", "/home/"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "incomplete"

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.0.details.source_path"
equals = "App.test.veln"

[[json_assert]]
path = "diagnostics.0.details.source_kind"
equals = "companion"

[[json_assert]]
path = "diagnostics.1.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.1.details.source_path"
equals = "App.veln"

[[json_assert]]
path = "diagnostics.1.details.source_kind"
equals = "regular"

[[json_assert]]
path = "completeness.status"
equals = "partial"

[[json_assert]]
path = "completeness.excluded_sources.0.path"
equals = "App.test.veln"

[[json_assert]]
path = "completeness.excluded_sources.1.path"
equals = "App.veln"

[[json_assert]]
path = "summary.project_module_count"
equals = 1

[[json_assert]]
path = "modules.0.module"
equals = "app"
