command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"constraint\":\"if_branch\"", "expected `Int`, but found `String`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `Int`, but found `String`"

[diagnostics.span]
file = "main.veln"
line = 5
column = 3
