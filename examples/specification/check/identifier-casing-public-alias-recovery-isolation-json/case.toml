command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
equals_file = "case-text/stdout-1.json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "function name `Bad` must start with an ASCII lowercase letter"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "type name `item` must start with an ASCII uppercase letter"

[[diagnostics]]
id = "name.unresolved"
kind = "name"
message = "unresolved function alias target `Bad`"

[[diagnostics]]
id = "name.unresolved"
kind = "name"
message = "unresolved type alias target `item`"
