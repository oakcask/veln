command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
equals_file = "case-text/stdout-1.json"
not_contains = ["name.unresolved", "type.mismatch"]

[stderr]
format = "empty"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "constructor name `some` must start with an ASCII uppercase letter"

[[diagnostics]]
id = "type.match_non_exhaustive"
kind = "type"
message = "match is missing case SOME"
