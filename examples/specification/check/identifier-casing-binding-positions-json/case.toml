command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
equals_file = "case-text/stdout-1.json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.0.span.start.line"
equals = 5

[[json_assert]]
path = "diagnostics.0.span.start.column"
equals = 13

[[json_assert]]
path = "diagnostics.0.span.end.column"
equals = 19

[[json_assert]]
path = "diagnostics.0.details.occurrence"
equals = "binding"

[[json_assert]]
path = "diagnostics.0.details.name"
equals = "Offset"

[[json_assert]]
path = "diagnostics.1.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.1.span.start.line"
equals = 6

[[json_assert]]
path = "diagnostics.1.span.start.column"
equals = 9

[[json_assert]]
path = "diagnostics.1.span.end.column"
equals = 15

[[json_assert]]
path = "diagnostics.1.details.occurrence"
equals = "binding"

[[json_assert]]
path = "diagnostics.1.details.name"
equals = "Answer"

[[json_assert]]
path = "diagnostics.2.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.2.span.start.line"
equals = 10

[[json_assert]]
path = "diagnostics.2.span.start.column"
equals = 7

[[json_assert]]
path = "diagnostics.2.span.end.column"
equals = 12

[[json_assert]]
path = "diagnostics.2.details.occurrence"
equals = "pattern_head"

[[json_assert]]
path = "diagnostics.2.details.name"
