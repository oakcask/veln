[[json_assert]]
path = "diagnostics.3.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.3.span.start.line"
equals = 15

[[json_assert]]
path = "diagnostics.3.span.start.column"
equals = 18

[[json_assert]]
path = "diagnostics.3.span.end.column"
equals = 27

[[json_assert]]
path = "diagnostics.3.details.occurrence"
equals = "binding"

[[json_assert]]
