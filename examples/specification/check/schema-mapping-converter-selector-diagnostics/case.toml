command = ["check", "--json", "main.veln", "selectors.veln", "alternate_selectors.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"schema.mapping_converter_return\"", "schema mapping converter `returns_int` returns `Int`, but selector expects `Bool`", "\"id\":\"schema.mapping_converter_input\"", "schema mapping converter `expects_text` expects `String`, but source field `kind` decodes as `Int`", "\"id\":\"schema.mapping_converter_purity\"", "schema mapping converter `impure_selector` must be pure", "\"id\":\"schema.mapping_converter_visibility\"", "schema mapping converter `selectors::private_selector` is private", "schema mapping converter `missing_selector` is not resolved", "schema mapping converter `public_selector` is not resolved"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics.0.id"
equals = "schema.mapping_converter_return"

[[json_assert]]
path = "diagnostics.1.id"
equals = "schema.mapping_converter_input"

[[json_assert]]
path = "diagnostics.2.id"
equals = "schema.mapping_converter_purity"

[[json_assert]]
path = "diagnostics.3.id"
equals = "schema.mapping_converter_visibility"

[[json_assert]]
path = "diagnostics.4.id"
equals = "schema.mapping_converter"

[[json_assert]]
path = "diagnostics.5.id"
equals = "schema.mapping_converter"
