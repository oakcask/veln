command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = [
  "expected `{guard: Option<Int>, state: First::Ready | First::Closed}`, but found `{state: Second::Other, guard: Option<String>}`",
  "expected `{id: Int, label: String}`, but found `{id: Int}`",
  "expected `{guard: Option<Int>, state: First::Ready}`, but found `{guard: Option<String>, state: Second::Last}`",
  "expected `{guard: Option<Int>, state: First::Ready | First::Closed | First::Other}`, but found `{guard: Option<String>, state: Second::Last}`",
]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 5

