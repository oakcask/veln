command = ["check", "--json", "accepted.veln", "rejected.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"name.unresolved\"", "unresolved value `declared_later`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved value `declared_later`"

[diagnostics.span]
file = "rejected.veln"
line = 4
column = 14
