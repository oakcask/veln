command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
equals_file = "case-text/stdout-1.json"
not_contains = [
  "core.constructor_arity_mismatch",
  "core.missing_expression",
  "type.match_non_exhaustive",
  "type.mismatch",
]

[stderr]
format = "empty"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "constructor name `some` must start with an ASCII uppercase letter"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "binding name `BadBinding` must start with an ASCII lowercase letter"

[[diagnostics]]
id = "name.unresolved"
kind = "name"
message = "unresolved value `missing_value`"
