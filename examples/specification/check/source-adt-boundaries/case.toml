command = ["check", "--json", "duplicate.veln", "first.veln", "second.veln", "app.veln", "inference.veln", "library.veln", "routes.veln", "conversions.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 8

[[diagnostics]]
id = "name.duplicate"
severity = "error"
kind = "name"
message = "duplicate constructor declaration name `Repeat`"

[diagnostics.span]
file = "duplicate.veln"
line = 19
column = 2

[[diagnostics]]
id = "name.ambiguous"
severity = "error"
kind = "name"
message = "ambiguous value `Same`"

[diagnostics.span]
file = "app.veln"
