command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = [
  "\"id\":\"type.variant_mismatch\"",
  "\"actual_type\":\"State::Closed\"",
  "\"expected_type\":\"State::Ready\"",
  "\"expected_variants\":[\"Ready\"]",
  "\"excluded_variants\":{\"form\":\"listed\",\"variants\":[\"Closed\"]}",
  "\"kind\":\"variant_exclusion\"",
  "\"kind\":\"expected_type_origin\"",
]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
