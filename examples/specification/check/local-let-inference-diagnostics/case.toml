command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"type.local_inference_incomplete\"", "\"inferred_type\":\"Vec<unknown>\"", "\"id\":\"type.mismatch\"", "expected `Vec<String>`, but found `Vec<Int>`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 2

[[diagnostics]]
id = "type.local_inference_incomplete"
severity = "error"
kind = "type"
message = "omitted local binding `items` has no concrete inferred type"

[diagnostics.span]
file = "main.veln"
line = 11
column = 6

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `Vec<String>`, but found `Vec<Int>`"

[diagnostics.span]
file = "main.veln"
line = 18
column = 17
