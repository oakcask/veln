command = ["check", "--json", "main.veln", "ownerless.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 2

[[json_assert]]
path = "diagnostics.0.details.source_path"
equals = "main.veln"

[[json_assert]]
path = "diagnostics.1.details.source_path"
equals = "ownerless.veln"

[[diagnostics]]
id = "module.metadata_drift"
severity = "error"
kind = "module"
message = "manifest module name `spec.manifest` does not match source module `spec.source`"

[diagnostics.span]
file = "veln.toml"
line = 2
column = 16

[[diagnostics]]
id = "module.metadata_drift"
severity = "error"
kind = "module"
message = "manifest module name `spec.ownerless` has no source `mod` owner"

[diagnostics.span]
file = "veln.toml"
line = 3
column = 21
