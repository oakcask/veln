command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"type.mismatch\"", "expected `fn(String, Int) -> String`, but found `fn(String, String) -> String`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `fn(String, Int) -> String`, but found `fn(String, String) -> String`"

[diagnostics.span]
file = "main.veln"
line = 6
column = 18
