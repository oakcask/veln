command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
equals_file = "case-text/stdout-1.json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.0.details.observed_initial"
equals = "underscore"

[[json_assert]]
path = "diagnostics.1.details.observed_initial"
equals = "underscore"

[[json_assert]]
path = "diagnostics.2.details.observed_initial"
equals = "underscore"

[[json_assert]]
path = "diagnostics.3.details.observed_initial"
equals = "underscore"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "function name `_build` must start with an ASCII lowercase letter"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "binding name `_input` must start with an ASCII lowercase letter"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "binding name `_output` must start with an ASCII lowercase letter"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "binding name `_local` must start with an ASCII lowercase letter"
