command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"schema.mapping_source_field\"", "schema mapping source field `control_reserved` is not declared"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics.0.id"
equals = "schema.mapping_source_field"

[[json_assert]]
path = "diagnostics.0.details.reason"
equals = "unknown_source_field"

[[json_assert]]
path = "diagnostics.0.details.source_field"
equals = "control_reserved"
