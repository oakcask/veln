command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
equals_file = "case-text/stdout-1.json"

[stderr]
format = "empty"

[[json_assert]]
path = "diagnostics"
length = 2

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.0.details.occurrence"
equals = "path_segment"

[[json_assert]]
path = "diagnostics.0.details.name"
equals = "sample"

[[json_assert]]
path = "diagnostics.0.details.name_class"
equals = "type"

[[json_assert]]
path = "diagnostics.0.details.segment_index"
equals = 0

[[json_assert]]
path = "diagnostics.1.id"
equals = "name.unresolved"

[[json_assert]]
path = "diagnostics.1.details.symbol"
equals = "Foo::bar"
