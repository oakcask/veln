# Placement: this case owns the compiler-known declared-arity contract. Its
# regression signal is the `core.call_arity_mismatch` diagnostic.
command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[diagnostics]]
id = "core.call_arity_mismatch"
severity = "error"
kind = "type"
