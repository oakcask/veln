command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = [
  "\"id\":\"defer.propagation\"",
  "deferred block cannot use `?`",
  "Handle the `Result` inside the deferred block instead of propagating it with `?`.",
  "\"id\":\"defer.non_unit\"",
  "deferred block must have type `()`, but found `Int`",
  "End the deferred block with `()` so cleanup cannot replace the region value.",
  "\"id\":\"defer.nested\"",
  "deferred block cannot register another deferred block",
  "Move the nested `defer` to a cleanup-region body.",
]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 3

[[diagnostics]]
id = "defer.propagation"
severity = "error"
kind = "type"
message = "deferred block cannot use `?`"

[diagnostics.span]
file = "main.veln"
line = 7
column = 3

[[diagnostics]]
id = "defer.non_unit"
severity = "error"
kind = "type"
message = "deferred block must have type `()`, but found `Int`"

[diagnostics.span]
file = "main.veln"
line = 14
column = 1

[[diagnostics]]
id = "defer.nested"
severity = "error"
kind = "type"
message = "deferred block cannot register another deferred block"

[diagnostics.span]
file = "main.veln"
line = 21
column = 3

[[json_assert]]
path = "diagnostics.0.related.0.kind"
equals = "repair_hint"

[[json_assert]]
path = "diagnostics.0.related.0.span.start.line"
equals = 7

[[json_assert]]
path = "diagnostics.0.related.0.span.start.column"
equals = 1

[[json_assert]]
path = "diagnostics.1.related.0.kind"
equals = "repair_hint"

[[json_assert]]
path = "diagnostics.1.related.0.span.start.line"
equals = 14

[[json_assert]]
path = "diagnostics.1.related.0.span.start.column"
equals = 1

[[json_assert]]
path = "diagnostics.2.related.0.kind"
equals = "repair_hint"

[[json_assert]]
path = "diagnostics.2.related.0.span.start.line"
equals = 22

[[json_assert]]
path = "diagnostics.2.related.0.span.start.column"
equals = 1
