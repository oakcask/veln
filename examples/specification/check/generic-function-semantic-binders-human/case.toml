# This case covers human diagnostics for declaration-local generic function binders.
command = ["check", "main.veln", "api.veln", "unbound.veln"]
exit = 1

[stdout]
format = "text"
contains = [
  "error[name.type_parameter_shadow]: function type parameter `Int` shadows a visible type",
  "error[name.type_parameter_shadow]: function type parameter `Item` shadows a visible type",
  "error[name.type_parameter_shadow]: function type parameter `Alias` shadows a visible type",
  "Visible type `Item` is declared here.",
  "Visible type `Alias` is declared here.",
  "note: api.veln:5:1: Visible type `Alias` is declared here.",
  "error[name.unresolved]: unresolved type `T`",
]

[stderr]
format = "empty"
