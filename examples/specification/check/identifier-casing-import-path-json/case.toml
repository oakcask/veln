command = ["check", "--json", "main.veln", "net/http.veln", "crypto.veln"]
exit = 1

[stdout]
format = "json"
equals_file = "case-text/stdout-1.json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics"
length = 3

[[json_assert]]
path = "diagnostics.0.id"
equals = "module.unresolved_import"

[[json_assert]]
path = "diagnostics.1.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.1.span.start.line"
equals = 1

[[json_assert]]
path = "diagnostics.1.span.start.column"
equals = 10

[[json_assert]]
path = "diagnostics.1.span.end.column"
equals = 14

[[json_assert]]
path = "diagnostics.1.details.occurrence"
equals = "path_segment"

[[json_assert]]
path = "diagnostics.1.details.name"
equals = "HTTP"

[[json_assert]]
path = "diagnostics.1.details.name_class"
equals = "module"

[[json_assert]]
path = "diagnostics.1.details.required_initial"
equals = "ascii_lowercase"

[[json_assert]]
path = "diagnostics.1.details.observed_initial"
equals = "ascii_uppercase"

[[json_assert]]
path = "diagnostics.1.details.segment_index"
equals = 1

[[json_assert]]
path = "diagnostics.2.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.2.span.start.line"
equals = 2

[[json_assert]]
path = "diagnostics.2.span.start.column"
equals = 5

[[json_assert]]
path = "diagnostics.2.span.end.column"
equals = 12

[[json_assert]]
path = "diagnostics.2.details.name"
equals = "_crypto"

[[json_assert]]
path = "diagnostics.2.details.name_class"
equals = "module"

[[json_assert]]
path = "diagnostics.2.details.observed_initial"
equals = "underscore"

[[json_assert]]
path = "diagnostics.2.details.segment_index"
equals = 0

[[diagnostics]]
id = "name.invalid_case"
severity = "error"
kind = "name"
message = "module name `HTTP` must start with an ASCII lowercase letter"

[diagnostics.span]
file = "main.veln"
line = 1
column = 10

[[diagnostics]]
id = "name.invalid_case"
severity = "error"
kind = "name"
message = "module name `_crypto` must start with an ASCII lowercase letter"

[diagnostics.span]
file = "main.veln"
line = 2
column = 5
