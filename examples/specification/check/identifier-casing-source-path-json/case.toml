command = ["check", "--json", "App/_net.veln"]
exit = 1

[stdout]
format = "json"
equals_file = "case-text/stdout-1.json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics"
length = 2

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.0.span.start.line"
equals = 1

[[json_assert]]
path = "diagnostics.0.span.start.column"
equals = 1

[[json_assert]]
path = "diagnostics.0.span.end.line"
equals = 1

[[json_assert]]
path = "diagnostics.0.span.end.column"
equals = 1

[[json_assert]]
path = "diagnostics.0.details.origin"
equals = "source_path"

[[json_assert]]
path = "diagnostics.0.details.occurrence"
equals = "path_segment"

[[json_assert]]
path = "diagnostics.0.details.name"
equals = "App"

[[json_assert]]
path = "diagnostics.0.details.name_class"
equals = "module"

[[json_assert]]
path = "diagnostics.0.details.required_initial"
equals = "ascii_lowercase"

[[json_assert]]
path = "diagnostics.0.details.observed_initial"
equals = "ascii_uppercase"

[[json_assert]]
path = "diagnostics.0.details.source_path"
equals = "App/_net.veln"

[[json_assert]]
path = "diagnostics.0.details.source_kind"
equals = "regular"

[[json_assert]]
path = "diagnostics.0.details.segment"
equals = "App"

[[json_assert]]
path = "diagnostics.0.details.segment_index"
equals = 0

[[json_assert]]
path = "diagnostics.1.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.1.details.name"
equals = "_net"

[[json_assert]]
path = "diagnostics.1.details.observed_initial"
equals = "underscore"

[[json_assert]]
path = "diagnostics.1.details.source_kind"
equals = "regular"

[[json_assert]]
path = "diagnostics.1.details.segment"
equals = "_net"

[[json_assert]]
path = "diagnostics.1.details.segment_index"
equals = 1

[[diagnostics]]
id = "name.invalid_case"
severity = "error"
kind = "name"
message = "module name `App` must start with an ASCII lowercase letter"

[diagnostics.span]
file = "App/_net.veln"
line = 1
column = 1

[[diagnostics]]
id = "name.invalid_case"
severity = "error"
kind = "name"
message = "module name `_net` must start with an ASCII lowercase letter"

[diagnostics.span]
file = "App/_net.veln"
line = 1
column = 1
