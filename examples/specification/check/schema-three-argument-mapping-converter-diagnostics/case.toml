command = ["check", "--json", "main.veln", "helpers.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"schema.mapping_converter_arity\"", "schema mapping converter `four` expects 3 argument(s), but got 4", "schema mapping expression `kind == 1` is not supported", "schema mapping expression `identity(kind)` is not supported", "schema mapping converter `combine_text` expects `String`, but source field `kind` decodes as `Int`", "\"source_field\":\"helpers::combine_text(kind, length, kind)\"", "\"input_source_field\":\"kind\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics.0.id"
equals = "schema.mapping_converter_arity"

[[json_assert]]
path = "diagnostics.1.id"
equals = "schema.mapping_expression_unsupported"

[[json_assert]]
path = "diagnostics.2.id"
equals = "schema.mapping_expression_unsupported"

[[json_assert]]
path = "diagnostics.3.id"
equals = "schema.mapping_converter_input"

[[json_assert]]
path = "diagnostics.3.details.input_source_field"
equals = "kind"
