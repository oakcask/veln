command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[diagnostics]]
id = "module.unexported_import"
severity = "error"
kind = "module"
message = "external module `transport::network` is not exported by package `std`"

[diagnostics.span]
file = "main.veln"
line = 1
column = 1
