command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"name.unresolved\"", "\"id\":\"schema.encode_expression\"", "unresolved call_target `byte_encode_unsupported_option_list_packet`", "schema encode expression cannot resolve `UnsupportedOptionListPacket` as an eligible schema encode helper", "\"reason\":\"unresolved_schema\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 3

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved call_target `byte_encode_unsupported_option_list_packet`"

[[diagnostics]]
id = "schema.encode_expression"
severity = "error"
kind = "type"
message = "schema encode expression cannot resolve `UnsupportedOptionListPacket` as an eligible schema encode helper"
