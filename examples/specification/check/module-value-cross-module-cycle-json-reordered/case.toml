command = ["check", "--json", "downstream.veln", "consumer.veln", "gamma.veln", "beta.veln", "alpha.veln"]
exit = 1

[stdout]
format = "json"
contains = ["value.module_initializer_cycle", "module value reference `left` closes an initializer cycle", "cycle_declaration", "cycle_reference", "expected `String`, but found `Bool`"]
not_contains = ["name.ambiguous", "expected `String`, but found `Int`", "expected `Bool`, but found `Int`"]

[stderr]
format = "empty"

[[json_assert]]
path = "diagnostics.4"
equals_json_file = "case-text/cycle-diagnostic.json"
