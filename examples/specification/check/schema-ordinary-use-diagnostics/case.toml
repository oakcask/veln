command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"type.schema_reference\"", "schema `Http2FrameHeader` cannot be used as an ordinary type", "\"id\":\"name.unresolved\"", "unresolved value `Http2FrameHeader`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"
