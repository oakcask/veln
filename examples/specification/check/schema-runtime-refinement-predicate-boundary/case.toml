command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["schema validate expression cannot resolve `FieldPredicateSibling` as an eligible format-neutral schema", "schema validate expression cannot resolve `NestedFieldPredicateSibling` as an eligible format-neutral schema"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 2

[[json_assert]]
path = "diagnostics.0.id"
equals = "schema.validate_expression"

[[json_assert]]
path = "diagnostics.0.details.reason"
equals = "unresolved_schema"

[[json_assert]]
path = "diagnostics.1.id"
equals = "schema.validate_expression"

[[json_assert]]
path = "diagnostics.1.details.reason"
equals = "unresolved_schema"
