command = ["check", "--json", "main.veln"]
source_errors = "expected"
exit = 1

[stdout]
format = "json"
contains = [
  "\"id\":\"name.invalid_case\"",
  "\"name\":\"item\"",
  "\"name\":\"made\"",
  "\"name\":\"Broken\"",
  "unresolved call_target `Broken`",
]
not_contains = [
  "\"id\":\"name.duplicate\"",
]

[stderr]
format = "empty"
