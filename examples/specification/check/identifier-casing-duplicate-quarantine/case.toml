command = ["check", "--json", "main.veln"]
source_errors = "expected"
exit = 1

[stdout]
format = "json"
contains = [
  "\"id\":\"name.invalid_case\"",
  "\"name\":\"item\"",
  "\"name\":\"made\"",
  "\"name\":\"Broken\"",
  "\"id\":\"name.duplicate\"",
  "duplicate type declaration name `item`",
  "duplicate constructor declaration name `made`",
  "duplicate function declaration name `Broken`",
  "unresolved call_target `Broken`",
]

[stderr]
format = "empty"
