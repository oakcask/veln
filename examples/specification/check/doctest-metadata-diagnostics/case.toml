command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["unknown doctest attribute `skip`", "empty doctest error type", "empty doctest runtime failure kind", "unknown doctest runtime failure kind `panic`", "missing doctest runtime ensure predicate", "empty doctest runtime ensure predicate", "missing doctest runtime result value", "empty doctest runtime result value", "unknown doctest attribute `clause`", "unknown doctest attribute `value`", "missing doctest output stream", "unknown doctest output stream `combined`", "duplicate expected stdout output fence", "\"id\":\"doctest.expected_failure_missing\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"
