command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["effect.missing_public", "public function uses undeclared effect `stdio`", "\"symbol\":\"missing_retained_effect\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `stdio`"
