command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"type.private_inference_incomplete\"", "\"id\":\"type.local_inference_incomplete\"", "\"id\":\"type.mismatch\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 3

[[diagnostics]]
id = "type.private_inference_incomplete"
severity = "error"
kind = "type"
message = "private parameter `value` has no inferred type"

[diagnostics.span]
file = "main.veln"
line = 5
column = 16

[[diagnostics]]
id = "type.local_inference_incomplete"
severity = "error"
kind = "type"
message = "omitted local binding `callback` has no concrete inferred type"

[diagnostics.span]
file = "main.veln"
line = 18
column = 6

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `fn(String) -> String`, but found `fn(Int) -> String`"

[diagnostics.span]
file = "main.veln"
line = 25
column = 20
