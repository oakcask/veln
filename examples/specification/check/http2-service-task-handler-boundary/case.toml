command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"effect.missing_public\"", "public function uses undeclared effect `net`", "public function uses undeclared effect `std::net::IO`", "\"inferred_effects\":[\"net\",\"std::net::IO\",\"concurrency\"]"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 2

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `net`"

[diagnostics.span]
file = "main.veln"
line = 20
column = 1

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `std::net::IO`"

[diagnostics.span]
file = "main.veln"
line = 20
column = 1
