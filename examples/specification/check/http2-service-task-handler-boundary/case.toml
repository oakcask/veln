# Integration contract: a duplex adapter does not handle the TCP service's
# `net::IO` boundary; the asserted effect set detects regression.
command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"effect.missing_public\"", "public function uses undeclared effect `std::net::IO`", "\"inferred_effects\":[\"std::net::IO\",\"concurrency\"]"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `std::net::IO`"

[diagnostics.span]
file = "main.veln"
line = 20
column = 1
