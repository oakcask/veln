command = ["check", "--json", "main.veln", "helpers.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"schema.mapping_converter\"", "schema mapping converter `missing_helpers::convert` is not resolved", "\"id\":\"schema.mapping_converter_visibility\"", "schema mapping converter `helpers::private_convert` is private", "schema mapping converter `public_convert` is not resolved", "\"id\":\"schema.mapping_converter_arity\"", "schema mapping converter `two_params` expects 2 argument(s), but got 1", "schema mapping converter `four_params` expects 3 argument(s), but got 4", "\"id\":\"schema.mapping_converter_input\"", "schema mapping converter `needs_text` expects `String`, but source field `kind` decodes as `Int`", "\"id\":\"schema.mapping_converter_return\"", "schema mapping converter `to_text` returns `String`, but target field `bad_return` expects `Int`", "\"id\":\"schema.mapping_converter_purity\"", "schema mapping converter `noisy` must be pure", "\"reason\":\"private_converter\"", "\"converter\":\"helpers::private_convert\"", "\"input_source_field\":\"kind\"", "\"effects\":[\"stdio\"]"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics.0.id"
equals = "schema.mapping_converter"

[[json_assert]]
path = "diagnostics.1.id"
equals = "schema.mapping_converter_visibility"

[[json_assert]]
path = "diagnostics.1.details.reason"
equals = "private_converter"

[[json_assert]]
path = "diagnostics.2.id"
equals = "schema.mapping_converter"

[[json_assert]]
path = "diagnostics.3.id"
equals = "schema.mapping_converter_arity"

[[json_assert]]
path = "diagnostics.4.id"
equals = "schema.mapping_converter_arity"

[[json_assert]]
path = "diagnostics.5.id"
equals = "schema.mapping_converter_input"

[[json_assert]]
path = "diagnostics.6.id"
equals = "schema.mapping_converter_return"

[[json_assert]]
path = "diagnostics.7.id"
equals = "schema.mapping_converter_purity"
