command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["unresolved call_target `missing::helper`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"

[diagnostics.span]
file = "main.veln"
line = 7
column = 2
