command = ["check", "--json", "app.veln"]
exit = 1

[stdout]
format = "json"
contains = ["module.value_not_executable", "from_first", "from_second"]
not_contains = ["name.unresolved", "name.ambiguous", "value.module_initializer_unsupported"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"
