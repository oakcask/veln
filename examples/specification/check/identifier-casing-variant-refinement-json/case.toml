command = ["check", "--json", "main.veln", "helper.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics"
length = 1

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.0.details.name"
equals = "Helper"

[[json_assert]]
path = "diagnostics.0.details.name_class"
equals = "module"

[[json_assert]]
path = "diagnostics.0.details.segment_index"
equals = 0
