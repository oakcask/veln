command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved call_target `WallTimeValue`"

[diagnostics.span]
file = "main.veln"
line = 3
column = 2
