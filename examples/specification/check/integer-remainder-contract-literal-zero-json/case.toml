command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"type.remainder_by_zero\"", "\"message\":\"remainder divisor is zero\"", "\"operator\":\"%\"", "\"divisor\":0"]

[stderr]
format = "empty"

[[json_assert]]
path = "diagnostics.0.id"
equals = "type.remainder_by_zero"

[[json_assert]]
path = "diagnostics.0.span.start.line"
equals = 2

[[json_assert]]
path = "diagnostics.0.span.start.column"
equals = 21

[[json_assert]]
path = "diagnostics.0.related.0.span.start.column"
equals = 9

[[json_assert]]
path = "diagnostics.0.related.0.span.end.column"
equals = 22

[[json_assert]]
path = "diagnostics.1.id"
equals = "type.remainder_by_zero"

[[json_assert]]
path = "diagnostics.1.span.start.line"
equals = 3

[[json_assert]]
path = "diagnostics.1.span.start.column"
equals = 47

[[json_assert]]
path = "diagnostics.1.related.0.span.start.column"
equals = 31

[[json_assert]]
path = "diagnostics.1.related.0.span.end.column"
equals = 51
