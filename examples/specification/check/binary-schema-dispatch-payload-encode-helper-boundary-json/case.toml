command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[json_assert]]
path = "diagnostics.0.id"
equals = "schema.dispatch_payload"

[[json_assert]]
path = "diagnostics.0.kind"
equals = "type"

[[json_assert]]
path = "diagnostics.0.details.schema"
equals = "ClosedPacket"

[[json_assert]]
path = "diagnostics.0.details.field"
equals = "payload"

[[json_assert]]
path = "diagnostics.0.details.field_path"
equals = [{"kind":"schema","name":"ClosedPacket"},{"kind":"field","name":"payload"}]

[[json_assert]]
path = "diagnostics.0.details.reason"
equals = "incompatible_payload_schema"

[[json_assert]]
path = "diagnostics.0.details.case_tag"
equals = 1

[[json_assert]]
path = "diagnostics.0.details.payload"
equals = "UnsupportedMappedPayload"

[[json_assert]]
path = "diagnostics.0.details.expected_decode_helper"
equals = "byte_decode_step_unsupported_mapped_payload"

[[json_assert]]
path = "diagnostics.0.details.decode_helper_boundary"
equals = "generated_binary_schema_decode_step"

[[json_assert]]
path = "diagnostics.0.details.expected_encode_helper"
equals = "byte_encode_unsupported_mapped_payload"

[[json_assert]]
path = "diagnostics.0.details.encode_helper_boundary"
equals = "generated_binary_schema_encode"

[[json_assert]]
path = "diagnostics.0.details.unavailable_helper_directions"
equals = ["encode"]

[[json_assert]]
path = "diagnostics.0.details.unsupported_nested_schema"
equals = "UnsupportedMappedPayload"

[[json_assert]]
path = "diagnostics.0.details.unsupported_nested_mapping_target"
equals = "code"

[[json_assert]]
path = "diagnostics.0.details.unsupported_nested_mapping_target_path"
equals = [{"kind":"schema","name":"UnsupportedMappedPayload"},{"kind":"mapping_target","name":"code"}]

[[json_assert]]
path = "diagnostics.0.details.unsupported_nested_layout_reason"
equals = "ineligible_mapping_projection"

[[json_assert]]
path = "diagnostics.0.details.unsupported_nested_layout_fact"
equals = "mapping assignment `code * 2` cannot be projected back to schema-local fields for generated encode"

[[json_assert]]
path = "diagnostics.0.related.0.kind"
equals = "schema_declaration"

[[json_assert]]
path = "diagnostics.0.related.1.kind"
equals = "unsupported_nested_mapping"

[[json_assert]]
path = "diagnostics.0.related.1.mapping_target"
equals = "code"

[[json_assert]]
path = "diagnostics.0.related.2.kind"
equals = "helper_boundary"
