command = ["check", "--json", "main.veln"]
source_errors = "expected"
exit = 1

[stdout]
format = "json"
contains = [
  "\"id\":\"name.invalid_case\"",
  "\"name\":\"Bad\"",
  "\"name\":\"Build\"",
  "\"name\":\"exposed\"",
  "\"name\":\"wrong\"",
  "\"id\":\"name.duplicate\"",
  "duplicate function alias name `Bad`",
  "duplicate type alias name `exposed`",
  "duplicate type alias name `wrong`",
  "\"id\":\"name.unresolved\"",
  "unresolved call_target `Bad`",
]

[stderr]
format = "empty"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 11
