command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"parse.schema_mapping_removed\"", "schema mapping clauses are no longer accepted", "\"parser_context\":\"schema_declaration\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[json_assert]]
path = "summary.by_kind.parse"
equals = 1

[[diagnostics]]
id = "parse.schema_mapping_removed"
severity = "error"
kind = "parse"
message = "schema mapping clauses are no longer accepted"
