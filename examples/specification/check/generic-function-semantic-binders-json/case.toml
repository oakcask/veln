# This case covers JSON diagnostics and related context for generic function binder scope.
command = ["check", "--json", "main.veln", "api.veln", "unbound.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 6

[[diagnostics]]
id = "name.type_parameter_shadow"
severity = "error"
kind = "name"
message = "function type parameter `Int` shadows a visible type"

[diagnostics.span]
file = "main.veln"
line = 17
column = 20

[[diagnostics]]
id = "name.type_parameter_shadow"
severity = "error"
kind = "name"
message = "function type parameter `Item` shadows a visible type"

[diagnostics.span]
file = "main.veln"
line = 21
column = 19

[[diagnostics]]
id = "name.type_parameter_shadow"
severity = "error"
kind = "name"
message = "function type parameter `Alias` shadows a visible type"

[diagnostics.span]
file = "main.veln"
line = 25
column = 18

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved type `api::Missing`"

[diagnostics.span]
file = "main.veln"
line = 33
column = 29

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved type `api::Private`"

[diagnostics.span]
file = "main.veln"
line = 37
column = 29

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved type `T`"

[diagnostics.span]
file = "unbound.veln"
line = 1
column = 19

[[json_assert]]
path = "diagnostics.1.related.0.kind"
equals = "shadowed_type_declaration"

[[json_assert]]
path = "diagnostics.0.details.boundary"
equals = "function_type_parameter"

[[json_assert]]
path = "diagnostics.0.details.name"
equals = "Int"

[[json_assert]]
path = "diagnostics.0.details.ordinal"
equals = 0

[[json_assert]]
path = "diagnostics.0.details.shadowed_kind"
equals = "builtin_type"

[[json_assert]]
path = "diagnostics.1.details.boundary"
equals = "function_type_parameter"

[[json_assert]]
path = "diagnostics.1.details.name"
equals = "Item"

[[json_assert]]
path = "diagnostics.1.details.ordinal"
equals = 0

[[json_assert]]
path = "diagnostics.1.details.shadowed_kind"
equals = "visible_type"

[[json_assert]]
path = "diagnostics.1.related.0.span.start.line"
equals = 3

[[json_assert]]
path = "diagnostics.2.details.boundary"
equals = "function_type_parameter"

[[json_assert]]
path = "diagnostics.2.details.name"
equals = "Alias"

[[json_assert]]
path = "diagnostics.2.details.ordinal"
equals = 0

[[json_assert]]
path = "diagnostics.2.details.shadowed_kind"
equals = "visible_type"

[[json_assert]]
path = "diagnostics.2.related.0.span.file"
equals = "api.veln"

[[json_assert]]
path = "diagnostics.2.related.0.span.start.line"
equals = 5

[[json_assert]]
path = "diagnostics.3.details.symbol"
equals = "api::Missing"

[[json_assert]]
path = "diagnostics.4.details.symbol"
equals = "api::Private"
