command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"type.mismatch\"", "expected `fn(String) -> ()`, but found `fn(String) -> () effects [stdio]`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `fn(String) -> ()`, but found `fn(String) -> () effects [stdio]`"
