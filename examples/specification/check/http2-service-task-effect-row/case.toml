# Integration contract: compiler task-boundary checking retains the legacy network effects of spawned HTTP/2 service work; the asserted effect sets detect regression.
command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"effect.missing_public\"", "public function uses undeclared effect `concurrency`", "public function uses undeclared effect `db`", "public function uses undeclared effect `net`", "public function uses undeclared effect `std::net::IO`", "\"symbol\":\"http2::connection::serve_tcp\"", "\"inferred_effects\":[\"concurrency\"]", "\"inferred_effects\":[\"concurrency\",\"db\"]", "\"inferred_effects\":[\"concurrency\",\"std::net::IO\",\"db\"]", "\"inferred_effects\":[\"net\",\"concurrency\"]", "\"inferred_effects\":[\"net\",\"concurrency\",\"db\"]"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 7

