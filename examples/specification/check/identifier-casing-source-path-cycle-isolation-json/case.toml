command = ["check", "--json", "app.veln", "Bad/cycle.veln", "valid.veln"]
exit = 1

[stdout]
format = "json"
contains = ["local import `Bad::cycle` has no matching selected source file", "module name `Bad` must start with an ASCII lowercase letter", "duplicate function declaration name `duplicate`"]
not_contains = ["Selected source `Bad/cycle.veln` derives `Bad::cycle`.", "dependency cycle", "deny_cycles", "module.duplicate_source_path"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics"
length = 4

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.0.details.origin"
equals = "source_path"

[[json_assert]]
path = "diagnostics.0.details.source_path"
equals = "Bad/cycle.veln"

[[json_assert]]
path = "diagnostics.0.details.segment"
equals = "Bad"

[[json_assert]]
path = "diagnostics.1.id"
equals = "module.unresolved_import"

[[json_assert]]
path = "diagnostics.1.details.module_path"
equals = "Bad::cycle"

[[json_assert]]
path = "diagnostics.2.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.2.details.origin"
equals = "source"

[[json_assert]]
path = "diagnostics.2.details.segment_index"
equals = 0

[[json_assert]]
path = "diagnostics.3.id"
equals = "name.duplicate"

[[json_assert]]
path = "diagnostics.3.span.file"
equals = "valid.veln"
