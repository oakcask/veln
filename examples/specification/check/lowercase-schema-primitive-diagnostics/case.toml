command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"schema.lowercase_primitive\"", "\"reason\":\"missing_endian\"", "\"reason\":\"redundant_endian\"", "\"reason\":\"unsupported_width\"", "\"reason\":\"unknown_endian\"", "\"reason\":\"missing_width\"", "\"reason\":\"non_binary_format\"", "\"reason\":\"parameter_type\"", "\"reason\":\"return_type\"", "\"reason\":\"value_position\"", "\"primitive\":\"uint24\"", "\"primitive\":\"flag32\"", "\"primitive\":\"uint8be\"", "\"primitive\":\"flag8le\"", "\"primitive\":\"uint9\"", "\"primitive\":\"flag31be\"", "\"primitive\":\"uint16ne\"", "\"primitive\":\"uint\"", "\"primitive\":\"flagbe\"", "\"primitive\":\"uint16be\"", "\"primitive\":\"flag16le\"", "\"primitive\":\"uint32be\"", "\"primitive\":\"flag24le\"", "\"primitive\":\"uint24be\"", "\"primitive\":\"flag24be\"", "\"primitive\":\"flag16be\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 16

[[json_assert]]
path = "summary.by_kind.type"
equals = 16

