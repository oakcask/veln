command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"schema.lowercase_primitive\"", "\"reason\":\"missing_endian\"", "\"reason\":\"redundant_endian\"", "\"reason\":\"unsupported_width\"", "\"reason\":\"unknown_endian\"", "\"reason\":\"missing_width\"", "\"reason\":\"non_binary_format\"", "\"reason\":\"parameter_type\"", "\"reason\":\"value_position\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 8
