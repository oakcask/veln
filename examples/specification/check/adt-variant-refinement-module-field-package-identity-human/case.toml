# CLI human diagnostics keep module-rooted field refinements separate by the
# package-aware declaration identity selected by each explicit import alias.
command = ["check", "app.veln"]
exit = 1

[stdout]
format = "text"
contains = ["app.veln:9:39: error[type.variant_mismatch]: value of type `Option<Int>` is not assignable to variant type `Option<Int>::Some`", "app.veln:10:45: error[type.variant_mismatch]: value of type `Option<Int>` is not assignable to variant type `Option<Int>::Some`", "app.veln:15:36: error[type.variant_mismatch]: value of type `Option<Int>` is not assignable to variant type `Option<Int>::Some`"]
not_contains = ["type.match_non_exhaustive", "first::snapshot.state`"]

[stderr]
format = "empty"
