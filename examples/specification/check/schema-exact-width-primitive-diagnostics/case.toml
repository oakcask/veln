command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"schema.exact_width_primitive\"", "\"primitive\":\"UInt8\"", "\"primitive\":\"UInt24be\"", "\"primitive\":\"UInt31be\"", "\"reason\":\"parameter_type\"", "\"reason\":\"return_type\"", "\"reason\":\"value_position\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 3

[[diagnostics]]
id = "schema.exact_width_primitive"
severity = "error"
kind = "type"
message = "binary schema primitive `UInt8` can only be used in a `format binary` schema field"

[[diagnostics]]
id = "schema.exact_width_primitive"
severity = "error"
kind = "type"
message = "binary schema primitive `UInt24be` can only be used in a `format binary` schema field"

[[diagnostics]]
id = "schema.exact_width_primitive"
severity = "error"
kind = "type"
message = "binary schema primitive `UInt31be` can only be used in a `format binary` schema field"
