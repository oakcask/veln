command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[json_assert]]
path = "diagnostics.0.details.provenance.0.symbol"
equals = "net::connect"

[[json_assert]]
path = "diagnostics.0.details.inferred_effects.0"
equals = "std::net::IO"

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `std::net::IO`"

[diagnostics.span]
file = "main.veln"
line = 4
column = 1
