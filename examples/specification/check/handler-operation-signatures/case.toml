command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["handler.missing_provider", "handler.provider_signature", "handler.recursive_provider", "handler.duplicate_provider", "handler.unknown_operation"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "handler.missing_provider"
severity = "error"
kind = "effect"

[[diagnostics]]
id = "handler.provider_signature"
severity = "error"
kind = "type"

[[diagnostics]]
id = "handler.recursive_provider"
severity = "error"
kind = "effect"

[[diagnostics]]
id = "handler.duplicate_provider"
severity = "error"
kind = "effect"

[[diagnostics]]
id = "handler.unknown_operation"
severity = "error"
kind = "effect"

[[json_assert]]
path = "diagnostics.1.related.0.kind"
equals = "provider_function"

[[json_assert]]
path = "diagnostics.1.details.handler"
equals = "main::bad"

[[json_assert]]
path = "diagnostics.1.details.handled_effect"
equals = "main::Ask"

[[json_assert]]
path = "diagnostics.1.details.operation"
equals = "value"

[[json_assert]]
path = "diagnostics.1.details.provider"
equals = "wrong"

[[json_assert]]
path = "diagnostics.1.details.reason"
equals = "provider_signature"

[[json_assert]]
path = "diagnostics.1.related.1.kind"
equals = "effect_operation"

[[json_assert]]
path = "diagnostics.1.related.2.kind"
equals = "handler_declaration"

[[json_assert]]
path = "diagnostics.2.details.reason"
equals = "recursive_provider"

[[json_assert]]
path = "diagnostics.2.related.0.kind"
equals = "provider_function"

[[json_assert]]
path = "diagnostics.4.related.0.span.start.line"
equals = 7

[[json_assert]]
path = "diagnostics.4.related.0.span.start.column"
equals = 1
