command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["handler.missing_operation_clause", "type.mismatch", "handler.recursive_operation_clause", "handler.duplicate_operation_clause", "handler.unknown_operation"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "handler.missing_operation_clause"
severity = "error"
kind = "effect"

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"

[[diagnostics]]
id = "handler.recursive_operation_clause"
severity = "error"
kind = "effect"

[[diagnostics]]
id = "handler.duplicate_operation_clause"
severity = "error"
kind = "effect"

[[diagnostics]]
id = "handler.unknown_operation"
severity = "error"
kind = "effect"

[[json_assert]]
path = "diagnostics.0.details.handler"
equals = "main::bad"

[[json_assert]]
path = "diagnostics.0.details.handled_effect"
equals = "main::Ask"

[[json_assert]]
path = "diagnostics.0.details.operation"
equals = "missing"

[[json_assert]]
path = "diagnostics.2.details.reason"
equals = "recursive_operation_clause"

[[json_assert]]
path = "diagnostics.4.related.0.span.start.line"
equals = 7

[[json_assert]]
path = "diagnostics.4.related.0.span.start.column"
equals = 1
