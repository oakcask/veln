command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 2

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `std::transport::DuplexStream`"

[diagnostics.span]
file = "main.veln"
line = 8
column = 1

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `net`"

[diagnostics.span]
file = "main.veln"
line = 12
column = 1

[[json_assert]]
path = "diagnostics.0.details.inferred_effects.0"
equals = "std::transport::DuplexStream"

[[json_assert]]
path = "diagnostics.1.details.inferred_effects.0"
equals = "net"
