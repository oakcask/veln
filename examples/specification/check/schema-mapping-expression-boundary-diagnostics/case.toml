command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"schema.mapping_constructor\"", "schema mapping constructor `Missing` is not resolved", "\"id\":\"schema.mapping_constructor_arity\"", "schema mapping constructor `FrameKind::FrameKind` expects 1 argument(s), but got 2", "\"id\":\"schema.mapping_type\"", "expression `{ value: kind }` has type `{value: Int}`", "expression `payload` has type `ByteView`", "\"id\":\"schema.mapping_expression_unsupported\"", "schema mapping expression `length + 1` is not supported", "schema mapping expression `convert(length) + kind` is not supported", "schema mapping expression `kind / length` is not supported"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"
