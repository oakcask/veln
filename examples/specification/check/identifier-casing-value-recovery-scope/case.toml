command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"name.invalid_case\"", "\"id\":\"hole.unfilled\"", "\"id\":\"name.unresolved\"", "binding name must start with an ASCII lowercase letter", "\"label\":\"_Value\"", "unresolved value `Value`"]
not_contains = ["\"name\":\"Value\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"
