command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"name.invalid_case\"", "function name must start with an ASCII lowercase letter", "\"name\":\"BadTest\"", "\"name_class\":\"function\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"
