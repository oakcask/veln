command = ["check", "--json", "main.veln", "helpers.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"schema.mapping_converter_input\"", "schema mapping converter `combine_text` expects `String`, but source field `length` decodes as `Int`", "schema mapping expression `length == 1` is not supported", "schema mapping expression `identity(length)` is not supported", "\"source_field\":\"helpers::combine_text(kind, length)\"", "\"input_source_field\":\"length\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics.0.id"
equals = "schema.mapping_converter_input"

[[json_assert]]
path = "diagnostics.0.details.input_source_field"
equals = "length"

[[json_assert]]
path = "diagnostics.1.id"
equals = "schema.mapping_expression_unsupported"

[[json_assert]]
path = "diagnostics.2.id"
equals = "schema.mapping_expression_unsupported"

[[json_assert]]
path = "diagnostics.3.id"
equals = "schema.mapping_converter_input"
