command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"schema.lowercase_primitive\"", "\"reason\":\"reserves_value\"", "\"reason\":\"non_binary_format\"", "\"reason\":\"repeat_payload\"", "\"reason\":\"dispatch_payload\"", "\"primitive\":\"uint8 reserves\"", "\"primitive\":\"uint16be reserves 0\"", "\"primitive\":\"uint2 reserves 4\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 9
