command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = [
  "expected `State`, but found `String`",
  "expected `String`, but found `State::Ready`",
]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 4

[[json_assert]]
path = "diagnostics.0.id"
equals = "type.mismatch"

[[json_assert]]
path = "diagnostics.0.details.expected_type"
equals = "State"

[[json_assert]]
path = "diagnostics.0.details.actual_type"
equals = "String"

[[json_assert]]
path = "diagnostics.1.id"
equals = "type.mismatch"

[[json_assert]]
path = "diagnostics.1.details.expected_type"
equals = "String"

[[json_assert]]
path = "diagnostics.1.details.actual_type"
equals = "State::Ready"

[[json_assert]]
path = "diagnostics.2.id"
equals = "type.mismatch"

[[json_assert]]
path = "diagnostics.2.details.expected_type"
equals = "State"

[[json_assert]]
path = "diagnostics.2.details.actual_type"
equals = "String"

[[json_assert]]
path = "diagnostics.3.id"
equals = "type.mismatch"

[[json_assert]]
path = "diagnostics.3.details.expected_type"
equals = "String"

[[json_assert]]
path = "diagnostics.3.details.actual_type"
equals = "State::Ready"
