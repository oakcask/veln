command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["type.mismatch"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"

[diagnostics.span]
file = "main.veln"
line = 11
column = 10
