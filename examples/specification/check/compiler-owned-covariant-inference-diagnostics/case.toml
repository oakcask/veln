command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["type.mismatch", "name.ambiguous", "Dict<Int, Vec<unknown>>", "Dict<Vec<unknown>, Int>", "Dict<Int, Vec<State::Ready | State::Closed>>", "Vec<Dict<Int, Result<First::Ready | First::Closed, First::Ready>>>", "expected `String`, but found `Int`", "Vec<Result<State::Ready | State::Closed, String>>"]

[stderr]
