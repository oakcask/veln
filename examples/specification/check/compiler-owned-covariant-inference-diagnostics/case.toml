[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 15

[[json_assert]]
path = "diagnostics.0.details.actual_type"
equals = "Dict<Int, Vec<unknown>>"

[[json_assert]]
path = "diagnostics.2.details.actual_type"
equals = "Dict<Vec<unknown>, Int>"

[[json_assert]]
path = "diagnostics.9.details.actual_type"
equals = "Vec<Dict<Int, Result<First::Ready | First::Closed, First::Ready>>>"

[[json_assert]]
path = "diagnostics.10.details.actual_type"
equals = "Option<State::Ready | State::Closed>"

[[json_assert]]
path = "diagnostics.14.details.actual_type"
equals = "Vec<Result<State::Ready | State::Closed, String>>"

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"

[diagnostics.span]
file = "main.veln"
line = 41
column = 10

