# This case covers CLI JSON rendering and state preservation for malformed generic function binders.
command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 6

[[diagnostics]]
id = "parse.function_binder_bound"
kind = "parse"
message = "function type binders do not accept bounds or type arguments"

