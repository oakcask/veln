command = ["check", "--json", "bad.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"codec.decode_value_type\"", "\"id\":\"codec.encode_value_type\"", "\"reason\":\"return_value_type\"", "\"reason\":\"value_parameter_type\"", "\"expected_value_type\":\"{length: Int, kind: Int}\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "codec.decode_value_type"
severity = "error"
kind = "type"
message = "decode function value type is `Int`, but schema mapping value type is `{length: Int, kind: Int}`"

[[diagnostics]]
id = "codec.encode_value_type"
severity = "error"
kind = "type"
message = "encode function value parameter must match schema mapping value type"
