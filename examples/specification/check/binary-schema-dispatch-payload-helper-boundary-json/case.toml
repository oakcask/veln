command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[json_assert]]
path = "diagnostics.0.id"
equals = "schema.dispatch_payload"

[[json_assert]]
path = "diagnostics.0.kind"
equals = "type"

[[json_assert]]
path = "diagnostics.0.details.schema"
equals = "ClosedPacket"

[[json_assert]]
path = "diagnostics.0.details.field"
equals = "payload"

[[json_assert]]
path = "diagnostics.0.details.field_path"
equals = [{"kind":"schema","name":"ClosedPacket"},{"kind":"field","name":"payload"}]

[[json_assert]]
path = "diagnostics.0.details.reason"
equals = "incompatible_payload_schema"

[[json_assert]]
path = "diagnostics.0.details.case_tag"
equals = 1

[[json_assert]]
path = "diagnostics.0.details.payload"
equals = "UnsupportedReservedPayload"

[[json_assert]]
path = "diagnostics.0.details.expected_decode_helper"
equals = "byte_decode_step_unsupported_reserved_payload"

[[json_assert]]
path = "diagnostics.0.details.decode_helper_boundary"
equals = "generated_binary_schema_decode_step"

[[json_assert]]
path = "diagnostics.0.details.expected_encode_helper"
equals = "byte_encode_unsupported_reserved_payload"

[[json_assert]]
path = "diagnostics.0.details.encode_helper_boundary"
equals = "generated_binary_schema_encode"

[[json_assert]]
path = "diagnostics.0.details.unavailable_helper_directions"
equals = ["decode", "encode"]

[[json_assert]]
path = "diagnostics.0.details.unsupported_nested_schema"
equals = "UnsupportedReservedPayload"

[[json_assert]]
path = "diagnostics.0.details.unsupported_nested_field"
equals = "padding"

[[json_assert]]
path = "diagnostics.0.details.unsupported_nested_field_path"
equals = [{"kind":"schema","name":"UnsupportedReservedPayload"},{"kind":"field","name":"padding"}]

[[json_assert]]
path = "diagnostics.0.details.unsupported_nested_layout_reason"
equals = "unsupported_reserved_bits_layout"

[[json_assert]]
path = "diagnostics.0.details.unsupported_nested_layout_fact"
equals = "`ReservedBits(1, 1)` uses the general direct byte-prefix rule, which is outside dispatch and repeat payload helpers"

[[json_assert]]
path = "diagnostics.0.related.0.kind"
equals = "schema_declaration"

[[json_assert]]
path = "diagnostics.0.related.1.kind"
equals = "unsupported_nested_field"

[[json_assert]]
path = "diagnostics.0.related.1.field_path"
equals = [{"kind":"schema","name":"UnsupportedReservedPayload"},{"kind":"field","name":"padding"}]

[[json_assert]]
path = "diagnostics.0.related.2.kind"
equals = "helper_boundary"
