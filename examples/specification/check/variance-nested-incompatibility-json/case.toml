command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = [
  "\"nested_incompatibility\"",
  "\"kind\":\"named_argument\"",
  "\"kind\":\"record_field\",\"name\":\"alpha\"",
  "\"kind\":\"function_input\"",
  "\"kind\":\"variadic_element\"",
  "\"kind\":\"function_result\"",
  "\"kind\":\"effect_set\"",
  "\"comparison_direction\":\"actual_accepts_expected\"",
  "\"expected_declaration\":{\"file\":\"main.veln\"",
  "\"kind\":\"expected_type_origin\"",
  "\"id\":\"type.variant_mismatch\"",
]

[stderr]
format = "empty"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 8

[[json_assert]]
path = "diagnostics.0.id"
equals = "type.mismatch"

[[json_assert]]
path = "diagnostics.0.details.expected_type"
equals = "Vec<State::Ready>"

[[json_assert]]
path = "diagnostics.0.details.actual_type"
equals = "Vec<State>"

[[json_assert]]
path = "diagnostics.0.details.nested_incompatibility.path.0.kind"
equals = "named_argument"

[[json_assert]]
path = "diagnostics.0.details.nested_incompatibility.path.0.index"
equals = 0

[[json_assert]]
path = "diagnostics.0.related.0.kind"
equals = "nested_type_incompatibility"

[[json_assert]]
path = "diagnostics.0.related.1.kind"
equals = "expected_type_origin"

[[json_assert]]
path = "diagnostics.1.details.nested_incompatibility.path.0.name"
equals = "alpha"

[[json_assert]]
path = "diagnostics.2.details.nested_incompatibility.path.0.kind"
equals = "function_input"

[[json_assert]]
path = "diagnostics.2.details.nested_incompatibility.comparison_direction"
equals = "actual_accepts_expected"

[[json_assert]]
path = "diagnostics.3.details.nested_incompatibility.path.0.kind"
equals = "variadic_element"

[[json_assert]]
path = "diagnostics.4.details.nested_incompatibility.path.0.kind"
equals = "function_result"

[[json_assert]]
path = "diagnostics.5.details.nested_incompatibility.path.0.kind"
equals = "effect_set"

[[json_assert]]
path = "diagnostics.6.id"
equals = "type.variant_mismatch"

[[json_assert]]
path = "diagnostics.6.details.excluded_variants.form"
equals = "all_except_expected"

[[json_assert]]
path = "diagnostics.7.id"
equals = "type.variant_mismatch"

[[json_assert]]
path = "diagnostics.7.details.constraint"
equals = "record_field"

[[json_assert]]
path = "diagnostics.7.related.1.message"
equals = "Schema encode value must match the schema-local visible record."
