command = ["check", "--json", "main.veln", "wire.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"schema.decode_expression\"", "schema decode expression cannot resolve `MissingPacket` as an eligible binary schema", "schema decode expression schema `wire::PrivatePacket` is private", "schema decode expression target `wire::make_packet` is a function, not a schema", "schema decode expression target `wire::PacketShape` is a type, not a schema", "schema decode expression cannot resolve `wire::PacketCodec` as an eligible binary schema", "\"reason\":\"unresolved_schema\"", "\"reason\":\"private_schema\"", "\"reason\":\"wrong_kind\"", "\"resolved_kind\":\"function\"", "\"resolved_kind\":\"type\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

