command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[json_assert]]
path = "diagnostics.0.id"
equals = "schema.mapping_encode_projection"

[[json_assert]]
path = "diagnostics.0.details.schema"
equals = "UnsupportedMappedPayload"

[[json_assert]]
path = "diagnostics.0.details.mapping_target"
equals = "code"

[[json_assert]]
path = "diagnostics.0.details.expected_encode_helper"
equals = "byte_encode_unsupported_mapped_payload"

[[json_assert]]
path = "diagnostics.0.details.reason"
equals = "ineligible_mapping_projection"

[[json_assert]]
path = "diagnostics.0.related.0.kind"
equals = "schema_declaration"

[[json_assert]]
path = "diagnostics.0.related.1.kind"
equals = "call_target_request"

[[json_assert]]
path = "diagnostics.0.related.2.kind"
equals = "helper_boundary"
