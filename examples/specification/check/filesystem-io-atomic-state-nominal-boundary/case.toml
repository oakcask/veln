# Placement: this compiler case owns the nominal boundary between the opaque
# standard atomic state and an application declaration with the same name.
command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "summary.by_kind.type"
equals = 2

[[json_assert]]
path = "diagnostics.0.id"
equals = "type.mismatch"

[[json_assert]]
path = "diagnostics.1.id"
equals = "type.mismatch"
