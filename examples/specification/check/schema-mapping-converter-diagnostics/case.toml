command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"schema.mapping_converter\"", "schema mapping converter `missing_converter` is not resolved", "\"id\":\"schema.mapping_converter_arity\"", "schema mapping converter `two_params` expects 2 argument(s), but got 1", "schema mapping converter `six_params` expects 6 argument(s), but got 7", "\"id\":\"schema.mapping_converter_input\"", "schema mapping converter `needs_text` expects `String`, but source field `kind` decodes as `Int`", "schema mapping converter `from_text` expects `String`, but argument expression `{ value: kind }` has type `{value: Int}`", "\"id\":\"schema.mapping_converter_return\"", "schema mapping converter `to_text` returns `String`, but target field `bad_return` expects `Int`", "\"id\":\"schema.mapping_converter_purity\"", "schema mapping converter `noisy` must be pure", "\"id\":\"schema.mapping_expression_unsupported\"", "schema mapping expression `kind == 1` is not supported", "\"input_source_field\":\"kind\"", "\"input_expression\":\"{ value: kind }\"", "\"effects\":[\"stdio\"]"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics.0.id"
equals = "schema.mapping_converter"

[[json_assert]]
path = "diagnostics.0.details.reason"
equals = "unresolved_converter"

[[json_assert]]
path = "diagnostics.1.id"
equals = "schema.mapping_converter_arity"

[[json_assert]]
path = "diagnostics.2.id"
equals = "schema.mapping_converter_arity"

[[json_assert]]
path = "diagnostics.3.id"
equals = "schema.mapping_converter_input"

[[json_assert]]
path = "diagnostics.4.id"
equals = "schema.mapping_converter_return"

[[json_assert]]
path = "diagnostics.4.details.reason"
equals = "converter_return_type_mismatch"

[[json_assert]]
path = "diagnostics.5.id"
equals = "schema.mapping_converter_purity"

[[json_assert]]
path = "diagnostics.6.id"
equals = "schema.mapping_converter_input"

[[json_assert]]
path = "diagnostics.6.details.input_expression"
equals = "{ value: kind }"

[[json_assert]]
path = "diagnostics.7.id"
equals = "schema.mapping_expression_unsupported"
