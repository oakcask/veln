command = ["check", "--json", "accepted.veln", "rejected.veln", "duplicate.veln"]
exit = 1

[stdout]
format = "json"
contains = [
  "\"id\":\"name.callsite_requires_modifier\"",
  "\"id\":\"name.callsite_shadow\"",
  "\"id\":\"parse.duplicate_callsite_modifier\"",
  "\"id\":\"name.unresolved\"",
  "\"kind\":\"repair_hint\"",
  "\"kind\":\"builtin_origin\"",
]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 12

