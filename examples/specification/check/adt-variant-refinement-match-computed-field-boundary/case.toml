# Compiler integration contract: check keeps repeated field accesses rooted at
# calls, record constructors, and operators outside stable-path match refinement.
command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 3

[[diagnostics]]
id = "type.variant_mismatch"
severity = "error"
kind = "type"
message = "value of type `State` is not assignable to variant type `State::Ready`"

[diagnostics.span]
file = "main.veln"
line = 16
column = 25

[[diagnostics]]
id = "type.variant_mismatch"
severity = "error"
kind = "type"
message = "value of type `State` is not assignable to variant type `State::Ready`"

[diagnostics.span]
file = "main.veln"
line = 20
column = 25

