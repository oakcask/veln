# Integration contract: a caller adapter replaces only the direct DuplexStream boundary while preserving callback effects; the asserted effect sets detect regression.
command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"effect.missing_public\"", "public function uses undeclared effect `std::transport::DuplexStream`", "public function uses undeclared effect `db`", "\"symbol\":\"http2::connection::serve_connection\"", "\"inferred_effects\":[\"std::transport::DuplexStream\"]", "\"inferred_effects\":[\"std::transport::DuplexStream\",\"db\"]", "\"inferred_effects\":[\"db\",\"std::net::IO\"]"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 8

