command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"type.mismatch\"", "expected `String`, but found `Int`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `String`, but found `Int`"

[diagnostics.span]
file = "main.veln"
line = 2
column = 8
