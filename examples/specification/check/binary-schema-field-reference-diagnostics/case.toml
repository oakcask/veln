command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"schema.repeat_reference\"", "\"id\":\"schema.byte_view_reference\"", "\"id\":\"schema.dispatch_reference\"", "\"reason\":\"unknown_field_reference\"", "\"reason\":\"forward_field_reference\"", "\"reason\":\"incompatible_field_reference\"", "Compatible earlier count field `available_count` is declared here.", "Compatible earlier length field `available_length` is declared here.", "Compatible earlier tag field `available_tag` is declared here."]

