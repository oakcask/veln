command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"type.inference_ambiguous\"", "\"inferred_type\":\"Result<Int, unknown>\"", "\"inferred_type\":\"Result<unknown, String>\"", "\"id\":\"type.mismatch\"", "expected `Int`, but found `String`", "expected `List<Int>`, but found `List<String>`"]

[stderr]
