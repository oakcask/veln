command = ["check", "--json", "bad.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"parse.codec_declaration_removed\"", "codec declarations are no longer accepted", "\"parser_context\":\"codec_declaration\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics.0.id"
equals = "parse.codec_declaration_removed"

[[json_assert]]
path = "diagnostics.0.message"
equals = "codec declarations are no longer accepted; use ordinary functions plus explicit schema decode and encode expressions"
