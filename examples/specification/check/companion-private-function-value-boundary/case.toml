command = ["check", "--json", "math.test.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"name.unresolved\"", "unresolved value `math::increment`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved value `math::increment`"
