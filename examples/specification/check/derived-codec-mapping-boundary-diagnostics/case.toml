command = ["check", "--json", "bad.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"schema.mapping_encode_projection\"", "\"reason\":\"ineligible_mapping_projection\"", "\"expected_encode_helper\":\"byte_encode_header_wire\"", "\"encode_helper_boundary\":\"generated_binary_schema_encode\"", "\"mapping_target\":\"length\"", "\"target_value_path\":[{\"kind\":\"record_field\",\"name\":\"length\"}]"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "schema.mapping_encode_projection"
severity = "error"
kind = "type"
message = "schema mapping assignment `decode_length(wire_length)` cannot be projected for generated encode"
