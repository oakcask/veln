command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = [
  "expected `Vec<State>`, but found `Vec<State::Ready>`",
  "expected `Option<Int>::Some`, but found `Option<String>::Some`",
  "expected `First::Value`, but found `Second::Value`",
]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 4

