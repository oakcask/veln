command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = [
  "expected `Int`, but found `String`",
  "expected `Option<Int>::Some`, but found `Option<String>::Some`",
  "expected `First::Value`, but found `Second::Value`",
  "expected `unknown`, but found `Option<String>::Some`",
]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 8

