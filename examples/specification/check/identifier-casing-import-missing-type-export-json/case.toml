command = ["check", "--json", "app.veln", "http.veln"]
exit = 1

[stdout]
format = "json"
equals_file = "case-text/stdout-1.json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics"
length = 2

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.1.id"
equals = "type.mismatch"

[[diagnostics]]
id = "name.invalid_case"
severity = "error"
kind = "name"
message = "module name `HTTP` must start with an ASCII lowercase letter"

[diagnostics.span]
file = "app.veln"
line = 1
column = 5

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `Int`, but found `HTTP::Payload`"

[diagnostics.span]
file = "app.veln"
line = 4
column = 3
