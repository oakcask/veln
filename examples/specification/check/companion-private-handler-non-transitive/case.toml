command = ["check", "--json", "math.test.veln", "math.veln", "support.veln"]
exit = 1

[stdout]
format = "json"
contains = ["handler.private_companion_target", "companion_target_mismatch"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics.0.details.reason"
equals = "companion_target_mismatch"

[[json_assert]]
path = "diagnostics.0.details.companion_path"
equals = "math.test.veln"

[[json_assert]]
path = "diagnostics.0.details.companion_target_module"
equals = "math"

[[json_assert]]
path = "diagnostics.0.details.handler_module"
equals = "support"
