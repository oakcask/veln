command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = [
  "value of type `Second::Closed` is not assignable to variant type `First::Ready`",
  "value of type `State::Closed` is not assignable to variant type `First::Ready`",
  "value of type `First::Ready | First::Closed` is not assignable to variant type `State::Failed`",
  "value of type `State::Ready | State::Closed` is not assignable to variant type `State::Failed`",
  "expected `Int`, but found `Single`",
  "expected `Int`, but found `Pair`",
  "value of type `Envelope<Second::Ready>::Right` is not assignable to variant type `Envelope<First::Ready>::Left`",
  "value of type `Envelope<Second::Ready>` is not assignable to variant type `Envelope<First::Ready>::Left`",
  "expected `Envelope<First::Ready>::Left`, but found `Envelope<Second::Closed>::Right`",
]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 11

[[json_assert]]
path = "diagnostics.0.details.actual_type"
equals = "Second::Closed"

[[json_assert]]
path = "diagnostics.0.details.expected_type"
equals = "First::Ready"

