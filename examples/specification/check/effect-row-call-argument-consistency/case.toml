command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"type.mismatch\"", "public function uses undeclared effect `db`", "public function uses undeclared effect `net`"]
not_contains = ["public function uses undeclared effect `Ask`", "public function uses undeclared effect `fs`", "public function uses undeclared effect `time`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 5

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `db`"

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `Result<Int, String>`, but found `Result<String, String>`"

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `net`"

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `Int`, but found `String`"

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `Bool`, but found `Int`"
