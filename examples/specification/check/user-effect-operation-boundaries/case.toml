command = ["check", "--json", "main.veln", "logging.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "name.duplicate"
severity = "error"
kind = "name"
message = "duplicate effect operation declaration name `record`"

[diagnostics.span]
file = "main.veln"
line = 5
column = 2

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `main::LocalAudit`"

[diagnostics.span]
file = "main.veln"
line = 16
column = 1

[[diagnostics]]
id = "effect.unknown_operation"
severity = "error"
kind = "effect"
message = "effect `main::LocalAudit` has no operation `missing`"

[diagnostics.span]
file = "main.veln"
line = 21
column = 22

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"

[diagnostics.span]
file = "main.veln"
line = 25
column = 38

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"

[diagnostics.span]
file = "main.veln"
line = 29
column = 2
