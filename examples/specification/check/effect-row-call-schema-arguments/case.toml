command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["public function uses undeclared effect `db`", "public function uses undeclared effect `net`", "public function uses undeclared effect `fs`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 3

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `db`"

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `net`"

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `fs`"
