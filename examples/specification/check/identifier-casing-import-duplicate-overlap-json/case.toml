command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
equals_file = "case-text/stdout-1.json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics"
length = 3

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.1.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.2.id"
equals = "name.duplicate"

[[json_assert]]
path = "diagnostics.2.message"
equals = "duplicate import alias name `HTTP`"
