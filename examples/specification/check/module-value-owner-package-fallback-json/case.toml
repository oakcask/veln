command = ["check", "--json", "app.veln"]
exit = 1

[stdout]
format = "json"
contains = ["name.unresolved", "unresolved type `Secret`"]
not_contains = ["type.public_annotation_private", "one/pkg::shared::Secret", "private_type_declaration"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved type `Secret`"

[diagnostics.span]
file = "shared.veln"
line = 1
column = 17
