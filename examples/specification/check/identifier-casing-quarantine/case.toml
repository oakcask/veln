command = ["check", "--json", "main.veln", "bad.veln"]
source_errors = "expected"
exit = 1

[stdout]
format = "json"
contains = [
  "\"id\":\"name.invalid_case\"",
  "\"name\":\"Broken\"",
  "unresolved function alias target `Broken`",
  "\"target\":\"Broken\"",
  "unresolved call_target `bad::exposed`",
  "\"symbol\":\"bad::exposed\"",
]

[stderr]
format = "empty"
