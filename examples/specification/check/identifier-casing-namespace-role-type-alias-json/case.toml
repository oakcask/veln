command = ["check", "--json", "main.veln", "helper.veln"]
exit = 0

[stdout]
format = "json"
not_contains = ["type.schema_reference", "name.unresolved", "name.visibility"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "ok"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 0
