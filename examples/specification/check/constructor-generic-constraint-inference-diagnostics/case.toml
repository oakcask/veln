# Integration contract: `veln check --json` renders unavailable bounds through
# the existing ambiguity diagnostic and preserves a focused rejected-payload mismatch.
command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 9

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `State::Ready`, but found `State::Closed`"

[diagnostics.span]
file = "main.veln"
line = 56
column = 23

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `Box<State::Ready | State::Closed>`, but found `Other`"

