command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 3

[[diagnostics]]
id = "name.unresolved"
kind = "name"
message = "unresolved call_target `Bad`"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "type name `item` must start with an ASCII uppercase letter"

[diagnostics.span]
file = "main.veln"
line = 5
column = 6

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "function name `Bad` must start with an ASCII lowercase letter"

[diagnostics.span]
file = "main.veln"
line = 9
column = 4
