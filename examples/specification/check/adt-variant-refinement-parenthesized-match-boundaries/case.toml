# Compiler integration contract: only a parenthesized direct binding gains
# refinement; qualified values, paths, aliases, indexed lookup calls, and
# other computed scrutinees retain ordinary typing.
command = ["check", "--json", "main.veln", "states.veln"]
exit = 1

[stdout]
format = "json"
contains = [
  '"actual_type":"State::Ready | State::Closed"',
  '"expected_type":"State::Ready"',
]
not_contains = [
  '"id":"type.match_impossible_variant"',
  '"id":"type.match_redundant_arm"',
]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 8

[[diagnostics]]
id = "type.variant_mismatch"
severity = "error"
kind = "type"
message = "value of type `State::Ready | State::Closed` is not assignable to variant type `State::Ready`"

[diagnostics.span]
file = "main.veln"
line = 26
column = 17
