command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["type.mismatch", "Vec<Dict<String, State>>", "Vec<Option<State>>"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 4

[[json_assert]]
path = "diagnostics.0.details.actual_type"
equals = "Vec<Dict<String, State>>"

[[json_assert]]
path = "diagnostics.1.details.actual_type"
equals = "Vec<Dict<String, State>>"

[[json_assert]]
path = "diagnostics.2.details.actual_type"
equals = "Vec<Option<State>>"

[[json_assert]]
path = "diagnostics.3.details.actual_type"
equals = "Vec<Option<State>>"

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"

