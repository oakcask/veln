command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["type.mismatch", "Vec<Dict<String, State>>"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 2

[[json_assert]]
path = "diagnostics.0.details.actual_type"
equals = "Vec<Dict<String, State>>"

[[json_assert]]
path = "diagnostics.1.details.actual_type"
equals = "Vec<Dict<String, State>>"

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"

[diagnostics.span]
file = "main.veln"
line = 22
column = 12

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"

[diagnostics.span]
file = "main.veln"
line = 23
column = 12
