command = ["check", "--json", "Bad.veln", "bad.veln", "other.veln"]
exit = 1

[stdout]
format = "json"
not_contains = ["module.duplicate_source_path", "multiple source files derive module path"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics"
length = 2

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.0.span.file"
equals = "Bad.veln"

[[json_assert]]
path = "diagnostics.0.details.origin"
equals = "source_path"

[[json_assert]]
path = "diagnostics.1.id"
equals = "type.mismatch"

[[json_assert]]
path = "diagnostics.1.span.file"
equals = "other.veln"

[[diagnostics]]
id = "name.invalid_case"
severity = "error"
kind = "name"
message = "module name `Bad` must start with an ASCII lowercase letter"

[diagnostics.span]
file = "Bad.veln"
line = 1
column = 1

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `Int`, but found `Bool`"

[diagnostics.span]
file = "other.veln"
line = 2
column = 3
