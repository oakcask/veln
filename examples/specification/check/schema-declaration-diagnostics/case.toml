command = ["check", "--json", "bad.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"parse.schema_field_before_format\"", "\"id\":\"parse.schema_multiple_format\"", "\"id\":\"parse.schema_field_name\"", "\"id\":\"parse.schema_field_where\"", "\"id\":\"parse.schema_mapping_removed\"", "\"id\":\"parse.expected_identifier\"", "\"id\":\"parse.expected_end\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 9

[[json_assert]]
path = "summary.by_kind.parse"
equals = 9

[[json_assert]]
path = "diagnostics.3.id"
equals = "parse.schema_field_where"

[[json_assert]]
path = "diagnostics.3.details.parser_context"
equals = "schema_field"

[[json_assert]]
path = "diagnostics.3.details.expected.0"
equals = "predicate"

[[diagnostics]]
id = "parse.schema_field_where"
severity = "error"
kind = "parse"
message = "expected schema field where predicate"
