command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"name.invalid_case\"", "type name must start with an ASCII uppercase letter", "constructor name must start with an ASCII uppercase letter", "\"name\":\"lower\"", "\"name\":\"bad\""]
not_contains = ["\"id\":\"name.unresolved\"", "unresolved call_target `bad`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"
