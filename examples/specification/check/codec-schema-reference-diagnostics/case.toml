command = ["check", "--json", "main.veln", "app/wire.veln", "facade.veln", "other.veln"]
exit = 1

[stdout]
format = "json"
contains = ["codec schema `app::wire::PrivatePacket` is private", "unresolved codec schema `app::wire::MissingPacket`", "codec schema target `app::wire::make_packet` is a function, not a schema", "codec schema target `app::wire::PacketShape` is a type, not a schema", "codec schema target `app::wire::PacketCodec` is a codec, not a schema", "unresolved codec schema `PublicPacket`", "unresolved codec schema `other::PublicPacket`", "unresolved codec schema `facade::PublicPacket`", "unresolved value `payload`", "expected `Int`, but found `DecodeStep<{payload: Int}>`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "name.visibility"
severity = "error"
kind = "name"
message = "codec schema `app::wire::PrivatePacket` is private"

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved codec schema `app::wire::MissingPacket`"

[[diagnostics]]
id = "name.kind_mismatch"
severity = "error"
kind = "name"
message = "codec schema target `app::wire::make_packet` is a function, not a schema"

[[diagnostics]]
id = "name.kind_mismatch"
severity = "error"
kind = "name"
message = "codec schema target `app::wire::PacketShape` is a type, not a schema"

[[diagnostics]]
id = "name.kind_mismatch"
severity = "error"
kind = "name"
message = "codec schema target `app::wire::PacketCodec` is a codec, not a schema"

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved codec schema `PublicPacket`"

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved codec schema `other::PublicPacket`"

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved codec schema `facade::PublicPacket`"

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved value `payload`"

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `Int`, but found `DecodeStep<{payload: Int}>`"
