command = ["check", "--json", "main.veln", "wire.veln", "other.veln"]
exit = 1

[stdout]
format = "json"
contains = ["codec schema `wire::PrivatePacket` is private", "unresolved codec schema `wire::MissingPacket`", "codec schema target `wire::make_packet` is a function, not a schema", "codec schema target `wire::PacketShape` is a type, not a schema", "codec schema target `wire::PacketCodec` is a codec, not a schema", "unresolved codec schema `PublicPacket`", "unresolved codec schema `other::PublicPacket`", "unresolved value `payload`", "unresolved call_target `wire::PacketCodec`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "name.visibility"
severity = "error"
kind = "name"
message = "codec schema `wire::PrivatePacket` is private"

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved codec schema `wire::MissingPacket`"

[[diagnostics]]
id = "name.kind_mismatch"
severity = "error"
kind = "name"
message = "codec schema target `wire::make_packet` is a function, not a schema"

[[diagnostics]]
id = "name.kind_mismatch"
severity = "error"
kind = "name"
message = "codec schema target `wire::PacketShape` is a type, not a schema"

[[diagnostics]]
id = "name.kind_mismatch"
severity = "error"
kind = "name"
message = "codec schema target `wire::PacketCodec` is a codec, not a schema"

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved codec schema `other::PublicPacket`"
