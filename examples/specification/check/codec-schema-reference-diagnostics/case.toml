command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"parse.codec_declaration_removed\"", "codec declarations are no longer accepted", "\"parser_context\":\"codec_declaration\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "parse.codec_declaration_removed"
severity = "error"
kind = "parse"
message = "codec declarations are no longer accepted; use ordinary functions plus explicit schema decode and encode expressions"
