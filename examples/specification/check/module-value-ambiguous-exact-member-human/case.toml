command = ["check", "forward.veln", "reverse.veln"]
exit = 1

[stdout]
format = "text"
contains = ["ambiguous value `shared::answer`", "ambiguous value `shared::hidden`", "ambiguous value `shared::broken`"]
not_contains = ["unresolved value `shared::answer`", "unresolved value `shared::hidden`", "unresolved value `shared::broken`"]

[stderr]
format = "empty"
