command = ["check", "--json", "app.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 3

[[diagnostics]]
id = "module.unexported_import"
severity = "error"
kind = "module"
message = "external module `private` is not exported by package `github.com/oakcask/git-api`"

[diagnostics.span]
file = "app.veln"
line = 2
column = 5

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved call_target `private::value`"

[diagnostics.span]
file = "app.veln"
line = 5
column = 3

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved call_target `remote::hidden`"

[diagnostics.span]
file = "app.veln"
line = 6
column = 3
