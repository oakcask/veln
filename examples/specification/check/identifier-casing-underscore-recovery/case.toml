command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
not_contains = ["parser.expected_name"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 15

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.14.id"
equals = "name.invalid_case"
