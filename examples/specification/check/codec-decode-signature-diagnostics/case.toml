command = ["check", "--json", "bad.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"name.unresolved\"", "unresolved decode function `missing_decoder`", "\"id\":\"codec.decode_signature\"", "\"reason\":\"parameter_count\"", "\"reason\":\"input_view_type\"", "\"reason\":\"base_offset_type\"", "\"reason\":\"return_type\"", "Referenced function `wrong_return` is declared here."]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved decode function `missing_decoder`"

[[diagnostics]]
id = "codec.decode_signature"
severity = "error"
kind = "type"
message = "decode function must take `ByteView` and `ByteOffset` parameters"

[[diagnostics]]
id = "codec.decode_signature"
severity = "error"
kind = "type"
message = "decode function first parameter must be `ByteView`"

[[diagnostics]]
id = "codec.decode_signature"
severity = "error"
kind = "type"
message = "decode function second parameter must be `ByteOffset`"

[[diagnostics]]
id = "codec.decode_signature"
severity = "error"
kind = "type"
message = "decode function must return `DecodeStep<T>`"
