# Compiler integration contract: JSON diagnostics preserve qualified module
# value identity refinement, transitive local aliases, companion-private
# availability, arm-local restoration, finite coverage, and the inaccessible
# and qualified-call boundaries.
command = ["check", "--json", "app.veln", "a/b.veln", "a/b.test.veln", "broken.test.veln"]
exit = 1

[stdout]
format = "json"
not_contains = ["b.test.veln", "type.match_non_exhaustive"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 10

[[json_assert]]
path = "diagnostics.0.id"
equals = "type.mismatch"

[[json_assert]]
path = "diagnostics.1.id"
equals = "type.variant_mismatch"

[[json_assert]]
path = "diagnostics.2.id"
equals = "type.match_impossible_variant"

[[json_assert]]
path = "diagnostics.3.id"
equals = "type.match_redundant_arm"

[[json_assert]]
path = "diagnostics.4.id"
equals = "type.match_impossible_variant"

[[json_assert]]
path = "diagnostics.5.id"
equals = "type.match_redundant_arm"

[[json_assert]]
path = "diagnostics.4.details.scrutinee_type"
equals = "State::Ready | State::Closed"

[[json_assert]]
path = "diagnostics.5.details.reason"
equals = "duplicate_variant"

[[json_assert]]
path = "diagnostics.6.id"
equals = "type.variant_mismatch"

[[json_assert]]
path = "diagnostics.6.details.actual_type"
equals = "State::Ready | State::Closed"

[[json_assert]]
path = "diagnostics.7.id"
equals = "type.variant_mismatch"

[[json_assert]]
path = "diagnostics.8.id"
equals = "name.unresolved"

[[json_assert]]
path = "diagnostics.8.message"
equals = "unresolved value `wire::private_current`"

[[json_assert]]
path = "diagnostics.8.span.file"
equals = "app.veln"

[[json_assert]]
path = "diagnostics.9.id"
equals = "name.unresolved"

[[json_assert]]
path = "diagnostics.9.message"
equals = "unresolved value `broken::private_current`"
