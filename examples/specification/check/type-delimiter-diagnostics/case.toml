command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"parse.legacy_type_parameter_delimiters\"", "\"id\":\"parse.legacy_type_argument_delimiters\"", "\"id\":\"parse.legacy_call_type_argument_delimiters\"", "\"candidate_queries\"", "\"replacement\":\"<\"", "\"replacement\":\">\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"
