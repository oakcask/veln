command = ["check", "--json", "main.veln", "type_position.veln", "call.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"parse.expected_newline\"", "\"id\":\"type.invalid_annotation\"", "unexpected `(Int, String)`"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"
