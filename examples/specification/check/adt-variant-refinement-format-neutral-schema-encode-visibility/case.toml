command = ["check", "--json", "main.veln", "main.test.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 2

[[json_assert]]
path = "diagnostics.0.id"
equals = "schema.format_neutral_decode_helper"

[[json_assert]]
path = "diagnostics.1.id"
equals = "schema.format_neutral_encode_helper"

[[json_assert]]
path = "diagnostics.1.message"
equals = "format-neutral schema field `state` cannot expose a generated encode helper because `State::Hidden` is not a recursive format-neutral visible shape"

[[json_assert]]
path = "diagnostics.1.details.schema"
equals = "HiddenPacket"
