command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[json_assert]]
path = "diagnostics.0.related"
length = 3

[[json_assert]]
path = "diagnostics.0.related.0.message"
equals = 'Import the exported network module with `use net from "std"`.'

[[json_assert]]
path = "diagnostics.0.related.1.message"
equals = "Declare the nominal `net::IO` effect for functions that use network operations."

[[json_assert]]
path = "diagnostics.0.related.2.message"
equals = "At the application boundary, handle `net::IO` with `net::system()`."

[[diagnostics]]
id = "name.unresolved"
severity = "error"
kind = "name"
message = "unresolved call_target `net::connect`"

[diagnostics.span]
file = "main.veln"
line = 4
column = 2
