# Integration contract: compiler effect inference retains the public HTTP/2
# client `net::IO` boundary and callback effects across its task boundary.
command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"effect.missing_public\"", "public function uses undeclared effect `std::net::IO`", "public function uses undeclared effect `concurrency`", "public function uses undeclared effect `db`", "\"symbol\":\"http2::connection::request_endpoint_sequence\"", "\"inferred_effects\":[\"std::net::IO\",\"concurrency\"]", "\"inferred_effects\":[\"std::net::IO\",\"concurrency\",\"db\"]"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 3

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `std::net::IO`"

[diagnostics.span]
file = "main.veln"
line = 27
column = 1

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `concurrency`"

[diagnostics.span]
file = "main.veln"
line = 27
column = 1

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `db`"

[diagnostics.span]
file = "main.veln"
line = 31
column = 1
