command = ["check", "--json", "main.veln", "wire.veln"]
exit = 1

[stdout]
format = "json"
contains = ["dispatch payload schema `MissingPayload` is not declared", "dispatch payload `Shape` resolves to a type, not a schema", "imported dispatch payload schema `wire::PrivatePayload` is private", "dispatch payload schema `wire::MissingPayload` is not declared", "dispatch payload `wire::WireShape` resolves to a type, not a schema", "dispatch payload schema `SelfPacket` cannot reference itself", "dispatch payload schema `LaterPayload` must be declared before schema `ForwardPacket`", "dispatch payload case `2` decodes as `{code: Int, value: Int}`, but earlier cases decode as `Int`"]

