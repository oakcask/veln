command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
equals_file = "case-text/stdout-1.json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.0.span.start.line"
equals = 1

[[json_assert]]
path = "diagnostics.0.span.start.column"
equals = 6

[[json_assert]]
path = "diagnostics.0.span.end.column"
equals = 10

[[json_assert]]
path = "diagnostics.0.details.phase"
equals = "name"

[[json_assert]]
path = "diagnostics.0.details.origin"
equals = "source"

[[json_assert]]
path = "diagnostics.0.details.occurrence"
equals = "declaration"

[[json_assert]]
path = "diagnostics.0.details.name"
equals = "item"

[[json_assert]]
path = "diagnostics.0.details.name_class"
equals = "type"

[[json_assert]]
path = "diagnostics.0.details.required_initial"
equals = "ascii_uppercase"

[[json_assert]]
path = "diagnostics.0.details.observed_initial"
equals = "ascii_lowercase"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "type name `item` must start with an ASCII uppercase letter"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "constructor name `_Payload` must start with an ASCII uppercase letter"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "function name `Build` must start with an ASCII lowercase letter"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "binding name `Local` must start with an ASCII lowercase letter"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "function name `Verify` must start with an ASCII lowercase letter"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "type name `exported` must start with an ASCII uppercase letter"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "function alias target `Build` must start with an ASCII lowercase letter"

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "type alias target `item` must start with an ASCII uppercase letter"
