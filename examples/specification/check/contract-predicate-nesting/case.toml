command = ["check", "--json", "accepted.veln", "rejected.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"parse.contract_predicate\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "parse.contract_predicate"
kind = "contract"
message = "contract predicate nesting exceeds the supported limit of 128 parenthesized expressions"
