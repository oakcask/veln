command = ["check", "--json", "app.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 6

[[json_assert]]
path = "diagnostics.0.span.end.line"
equals = 2

[[json_assert]]
path = "diagnostics.0.span.end.column"
equals = 12

[[json_assert]]
path = "diagnostics.4.span.end.line"
equals = 7

[[json_assert]]
path = "diagnostics.4.span.end.column"
equals = 50

[[json_assert]]
path = "diagnostics.5.span.end.line"
equals = 7

[[json_assert]]
path = "diagnostics.5.span.end.column"
equals = 77

