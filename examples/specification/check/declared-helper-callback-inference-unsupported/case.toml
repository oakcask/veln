command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"
contains = ["\"id\":\"type.private_inference_incomplete\"", "private parameter `value` has no inferred type"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 2

[[json_assert]]
path = "diagnostics.0.details.slot_kind"
equals = "private_parameter"

[[json_assert]]
path = "diagnostics.0.details.parameter"
equals = "value"

[[json_assert]]
path = "diagnostics.0.details.missing_fact"
equals = "parameter_type"

[[json_assert]]
path = "diagnostics.0.details.inferred_type"
equals = "unknown"

[[diagnostics]]
id = "type.private_inference_incomplete"
severity = "error"
kind = "type"
message = "private parameter `value` has no inferred type"

[diagnostics.span]
file = "main.veln"
line = 5
column = 14

[[diagnostics]]
id = "type.mismatch"
severity = "error"
kind = "type"
message = "expected `String`, but found `fn(unknown) -> String`"

[diagnostics.span]
file = "main.veln"
line = 10
column = 16
