command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[diagnostics]]
id = "effect.missing_public"
severity = "error"
kind = "effect"
message = "public function uses undeclared effect `time`"

[diagnostics.span]
file = "main.veln"
line = 2
column = 1

[[json_assert]]
path = "diagnostics.0.related.0.kind"
equals = "effect_provenance"

[[json_assert]]
path = "diagnostics.0.related.0.message"
equals = "Call to `time::wall_time` requires this effect."

[[json_assert]]
path = "diagnostics.0.related.0.span.start.line"
equals = 3

[[json_assert]]
path = "diagnostics.0.related.0.span.start.column"
equals = 2

[[json_assert]]
path = "diagnostics.0.related.0.span.end.line"
equals = 3

[[json_assert]]
path = "diagnostics.0.related.0.span.end.column"
equals = 19
