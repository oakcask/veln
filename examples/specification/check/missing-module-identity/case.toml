command = ["check", "--json", "main.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[diagnostics]]
id = "module.invalid_import_path"
severity = "error"
kind = "module"
message = "module import `foo.bar` uses `.`; source module paths use `::`"
