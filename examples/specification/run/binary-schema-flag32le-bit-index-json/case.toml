command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "flag bit index must be between 0 and 31"

[[json_assert]]
path = "stderr"
equals = "Err(flag bit index must be between 0 and 31)\n"
