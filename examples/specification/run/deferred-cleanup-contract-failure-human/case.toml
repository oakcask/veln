command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "text"
equals_file = "case-text/stdout.txt"

[stderr]
format = "text"
contains = [
  "contract failure: require `value` in `reject` blame caller",
  "related cleanup failure: invalid shift count 64 for operator `<<`; expected a value between 0 and 63",
]
