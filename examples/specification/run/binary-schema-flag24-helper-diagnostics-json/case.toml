command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "flag bit index must be between 0 and 23\nflag bit index must be between 0 and 23\nflag24be bits must be between 0 and 16777215\nflag24le bits must be between 0 and 16777215\n"

[[json_assert]]
path = "error"
equals = null
