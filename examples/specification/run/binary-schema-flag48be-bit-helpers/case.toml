command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals = "140737488355329\n1\n1\n0\noutput_chunk_list flag48be-packet count 1\noutput_chunk flag48be-packet index 0 hex \"800000000001\" count 6\n"

[[output_chunk_list]]
name = "flag48be-packet"
chunks = ["800000000001"]
