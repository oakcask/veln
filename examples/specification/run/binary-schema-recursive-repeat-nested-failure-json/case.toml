command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "payload length out of bounds at byte offset 8"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.length_out_of_bounds"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 8

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"PacketBatch"},{"kind":"field","name":"items"},{"kind":"index","name":"1"},{"kind":"schema","name":"RecursivePacket"},{"kind":"field","name":"payload"},{"kind":"schema","name":"RecursivePacket"},{"kind":"field","name":"payload"}]

[[json_assert]]
path = "error.details.byte_diagnostic.expected_count"
equals = 2

[[json_assert]]
path = "error.details.byte_diagnostic.available_count"
equals = 0
