# CLI/JVM integration contract: `veln run --json` keeps the entry invocation
# open until its spawned descendants finish; exact captured stdout detects
# premature report publication.
command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/stdout.txt"

[[json_assert]]
path = "error"
equals = null
