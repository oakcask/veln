command = ["run", "--json", "main", "main.veln", "broken.veln"]
source_errors = "expected"
exit = 0

[requires]
jdk = true

[stdout]
format = "json"
not_contains = [
  "name.invalid_case",
  "unresolved function alias target `Broken`",
  "Broken",
]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"
