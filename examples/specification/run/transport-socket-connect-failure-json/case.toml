command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_CONNECT_FAILED = "1"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals = ""

[[json_assert]]
path = "stderr"
equals = "transport connect failed: forced_failure\n"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.message"
equals = "transport connect failed: forced_failure"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.operation"
equals = "connect"

[[json_assert]]
path = "error.details.category"
equals = "forced_failure"

[[json_assert]]
path = "error.details.peer_endpoint"
equals = "127.0.0.1:443"

[[json_assert]]
path = "error.details.platform_cause"
equals = "VELN_NET_CONNECT_FAILED"
