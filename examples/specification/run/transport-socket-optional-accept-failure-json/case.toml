command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_ACCEPT_FAILED = "1"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals = ""

[[json_assert]]
path = "stderr"
equals = "transport accept failed: forced_failure\n"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.message"
equals = "transport accept failed: forced_failure"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.id"
equals = "runtime.transport_failure"

[[json_assert]]
path = "error.details.operation"
equals = "accept"

[[json_assert]]
path = "error.details.category"
equals = "forced_failure"

[[json_assert]]
path = "error.details.local_endpoint"
equals = "127.0.0.1:0"

[[json_assert]]
path = "error.details.listener_id"
equals = "127.0.0.1:0"

[[json_assert]]
path = "error.details.peer_endpoint"
missing = true

[[json_assert]]
path = "error.details.stream_id"
missing = true

[[json_assert]]
path = "error.details.lifecycle_phase"
equals = "before_operation"

[[json_assert]]
path = "error.details.input_committed"
equals = false

[[json_assert]]
path = "error.details.output_committed"
equals = false

[[json_assert]]
path = "error.details.ownership_committed"
equals = false

[[json_assert]]
path = "error.details.platform_cause"
equals = "VELN_NET_ACCEPT_FAILED"
