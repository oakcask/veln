command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n148\n7\nneed_more\nneed_bytes\n7\n0\ninvalid\n0\nschema.validation_failed\n25\nSubByteBoundary.three_bits\nencoded\n1\n7\noutput_chunk_list sub-byte-complete count 1\noutput_chunk sub-byte-complete index 0 hex \"0102030405067f\" count 7\npartial\n1\n3\n3\noutput_chunk_list sub-byte-partial count 1\noutput_chunk sub-byte-partial index 0 hex \"010203\" count 3\nencoded\n1\n4\noutput_chunk_list sub-byte-resume count 1\noutput_chunk sub-byte-resume index 0 hex \"0405067f\" count 4\ninvalid\n0\ncodec.encode_value_unrepresentable\nSubByteBoundary.seven_bits\nvalue must be between 0 and 127\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "sub-byte-complete"
chunks = ["0102030405067f"]

[[output_chunk_list]]
name = "sub-byte-partial"
chunks = ["010203"]

[[output_chunk_list]]
name = "sub-byte-resume"
chunks = ["0405067f"]
