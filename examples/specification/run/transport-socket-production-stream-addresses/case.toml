command = ["run", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READ_HEX = "0102ff"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "text"
contains = ["local 127.0.0.1:", " peer 127.0.0.1:", " bytes 3\n"]

[stderr]
format = "empty"

[[file_assert]]
path = "net-events.log"
equals = "listen-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream\nread-production production-stream 0102ff\nclose-production production-stream\nclose-listener-production 127.0.0.1:0\n"
