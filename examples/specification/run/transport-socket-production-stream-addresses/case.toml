command = ["run", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READ_HEX = "0102ff"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "text"
contains = ["local 127.0.0.1:", " peer 127.0.0.1:"]
contains_files = ["case-text/stdout-contains-1.txt"]

[stderr]
format = "empty"

[[file_assert]]
path = "net-events.log"
equals_file = "case-text/file-assert-equals-1.txt"
