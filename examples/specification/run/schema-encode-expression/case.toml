command = ["run", "--json", "main", "main.veln", "wire.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "schema-encode-local"
chunks = ["0503"]

[[output_chunk_list]]
name = "schema-encode-imported"
chunks = ["0702"]
