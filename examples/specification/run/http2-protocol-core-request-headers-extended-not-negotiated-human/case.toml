command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[http2.protocol.invalid_request_header_list]: request header list uses extended CONNECT before negotiation at byte offset 12", "note: Frame kind 9 on stream 1 decoded request header names: :method,:protocol,:scheme,:path,:authority.", "note: Active protocol state: local-connect-protocol-disabled.", "note: Rule provenance: rfc8441_extended_connect_negotiation."]
