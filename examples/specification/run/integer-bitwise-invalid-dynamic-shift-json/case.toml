jdk = true

[stdout]
format = "json"
contains = ["\"kind\":\"runtime\"", "\"id\":\"runtime.invalid_shift_count\"", "\"operator\":\">>>\"", "\"actual_count\":64", "\"minimum_count\":0", "\"maximum_count\":63"]

[stderr]
