command = ["run", "--json", "main", "main.veln", "wire.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.length_out_of_bounds"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 4

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"ImportedRecursiveClosedPacket"},{"kind":"field","name":"payload"},{"kind":"schema","name":"RecursiveClosedPayload"},{"kind":"field","name":"payload"}]
