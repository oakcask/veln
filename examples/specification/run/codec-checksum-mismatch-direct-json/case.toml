command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "schema_version"
equals = "veln-run-json/v0"

[[json_assert]]
path = "command"
equals = "run"

[[json_assert]]
path = "exit_code"
equals = 1

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.message"
equals = "runtime result failure: Err(DecodeErrorWithReason(codec.checksum_mismatch, ByteOffset(12), ManualPacketWire.checksum, expected_checksum=0xabcd; actual_checksum=0x1234; reason=payload checksum did not match header checksum))"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "DecodeErrorWithReason(codec.checksum_mismatch, ByteOffset(12), ManualPacketWire.checksum, expected_checksum=0xabcd; actual_checksum=0x1234; reason=payload checksum did not match header checksum)"

[[json_assert]]
path = "error.details.byte_diagnostic.kind"
equals = "byte_diagnostic"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "codec.checksum_mismatch"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 12

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"ManualPacketWire"},{"kind":"field","name":"checksum"}]

[[json_assert]]
path = "error.details.byte_diagnostic.field_path_display"
equals = "ManualPacketWire.checksum"

[[json_assert]]
path = "error.details.byte_diagnostic.expected_checksum"
equals = "0xabcd"

[[json_assert]]
path = "error.details.byte_diagnostic.actual_checksum"
equals = "0x1234"

[[json_assert]]
path = "error.details.byte_diagnostic.reason"
equals = "payload checksum did not match header checksum"

[[json_assert]]
path = "stderr"
equals = "Err(DecodeErrorWithReason(codec.checksum_mismatch, ByteOffset(12), ManualPacketWire.checksum, expected_checksum=0xabcd; actual_checksum=0x1234; reason=payload checksum did not match header checksum))\n"
