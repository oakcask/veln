command = ["run", "--json", "main", "main.veln", "fixture_effects.veln", "fake_effects.veln"]
exit = 1

[requires]
jdk = true

[env]

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals = ""

[[json_assert]]
path = "stderr"
equals_file = "case-text/json-assert-equals-1.txt"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.message"
equals = "runtime result failure: Err(NetError(listen, Some(Tcp4), Some(127.0.0.1), InvalidAddress, port must be between 0 and 65535))"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"
