command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals = ""

[[json_assert]]
path = "stderr"
equals = "transport listen failed: invalid_endpoint\n"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.message"
equals = "transport listen failed: invalid_endpoint"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.operation"
equals = "listen"

[[json_assert]]
path = "error.details.category"
equals = "invalid_endpoint"

[[json_assert]]
path = "error.details.local_endpoint"
equals = "not-a-socket-address"

[[json_assert]]
path = "error.details.lifecycle_phase"
equals = "before_operation"

[[json_assert]]
path = "error.details.ownership_committed"
equals = false
