command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(hpack.fixture.huffman_eos_symbol, HPACK fixture Huffman EOS symbol at byte offset 9, RuntimeHttp2HpackDiagnostic(RuntimeHpackFixtureDiagnostic(9, 6, 4, fixture HPACK Huffman data symbol instead of EOS, hpack_fixture, ByteChunk([Byte(4), Byte(132), Byte(255), Byte(255), Byte(255), Byte(255)]))))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "hpack.fixture.huffman_eos_symbol"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_header_block_size"
equals = 6

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_first_byte"
equals = 4

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "0484ffffffff"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.constructor"
equals = "RuntimeHpackFixtureDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.expected_fixture"
equals = "fixture HPACK Huffman data symbol instead of EOS"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.preview.bytes.5.value"
equals = 255
