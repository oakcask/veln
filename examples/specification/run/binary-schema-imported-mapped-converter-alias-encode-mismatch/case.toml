command = ["run", "--json", "main", "main.veln", "facade.veln", "helpers.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "codec.encode_mapping_mismatch\nHeaderWire.kind\ninverse converter projection does not round-trip through mapped converter\n"

[[json_assert]]
path = "error"
equals = null
