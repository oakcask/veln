command = ["run", "--json", "main", "main.veln", "fixtures.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[binary_fixture]]
name = "valid-preface"
hex = "0001ff"
consumed = 3

[[binary_fixture]]
name = "valid-window-update"
hex = "00040000000f000001"

[[binary_fixture]]
name = "bad-separator"
error = "fixture.hex.invalid_character: expected ASCII hex digit at byte offset 1 high nibble"

[[output_chunk_list]]
name = "protocol-output"
chunks = ["0001ff", "00040000000f000001"]

[[output_chunk_list]]
name = "empty-chunk"
chunks = [""]

[[output_chunk_list]]
name = "no-output"
chunks = []
