command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.initial_peer_settings_required"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 24

[[json_assert]]
path = "error.details.protocol_diagnostic.actual_frame_kind"
equals = 6

[[json_assert]]
path = "error.details.protocol_diagnostic.actual_flags"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "connection"

[[json_assert]]
path = "error.details.protocol_diagnostic.endpoint_role"
equals = "server"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "0000000601000000"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = true

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "expect-initial-peer-settings"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_initial_peer_frame_requires_non_ack_settings"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.constructor"
equals = "RuntimeHttp2ProtocolInitialPeerSettingsRequiredDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.actual_flags"
equals = 1
