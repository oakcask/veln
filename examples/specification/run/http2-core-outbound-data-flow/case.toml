command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "data accepted\ndata lifecycle half-closed-local receive 5 send 6 observed 4\noutput_chunk_list data count 1\noutput_chunk data index 0 hex \"000004000100000001aabbccdd\" count 13\ndata-short failure http2.protocol.content_length_mismatch offset 23 kind 0 stream 1 data 0 increment 0 observed 0 expected 4 actual 2 state open-stream rule rfc9113_content_length_body\noutput_chunk_list data-short count 0\nstream-window accepted\nstream-window lifecycle open receive 12 send 10 observed 0\noutput_chunk_list stream-window count 1\noutput_chunk stream-window index 0 hex \"00000408000000000100000007\" count 13\nconnection-window accepted\nconnection-window receive 19\noutput_chunk_list connection-window count 1\noutput_chunk connection-window index 0 hex \"00000408000000000000000009\" count 13\nwindow-increment failure http2.flow_control.window_increment_out_of_range offset 41 kind 8 stream 1 data 0 increment 0 observed 0 expected -1 actual 0 state window-update-increment rule window_update_increment_range\noutput_chunk_list window-increment count 0\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "data"
chunks = ["000004000100000001aabbccdd"]

[[output_chunk_list]]
name = "stream-window"
chunks = ["00000408000000000100000007"]

[[output_chunk_list]]
name = "connection-window"
chunks = ["00000408000000000000000009"]
