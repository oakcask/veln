command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "data"
chunks = ["000004000100000001aabbccdd"]

[[output_chunk_list]]
name = "stream-window"
chunks = ["00000408000000000100000007"]

[[output_chunk_list]]
name = "connection-window"
chunks = ["00000408000000000000000009"]
