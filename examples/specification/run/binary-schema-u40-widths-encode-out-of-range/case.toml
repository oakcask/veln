command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "codec.encode_value_unrepresentable\nUInt40BigWidth.value\nvalue must be between 0 and 1099511627775\ncodec.encode_value_unrepresentable\nUInt40LittleWidth.value\nvalue must be between 0 and 1099511627775\n"

[[json_assert]]
path = "error"
equals = null
