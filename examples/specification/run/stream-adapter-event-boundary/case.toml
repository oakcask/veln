command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "direct actions 2 state 1 first send-bytes stream 1 bytes 2\ndirect second end-stream\nrouted actions 1 state 2 first send-bytes stream 3 bytes 1\nrouted second decline\nclosed actions 1 state 2 first decline stream 5 bytes 0\nclosed second decline\n"

[[json_assert]]
path = "error"
equals = null
