command = ["run", "--json", "main", "main.veln", "models.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.variant_refinement_mismatch"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 23

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"Packet"},{"kind":"field","name":"child"},{"kind":"field","name":"state"}]
