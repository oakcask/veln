command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n85\n115\n7\nneed_more\nneed_bytes\n7\n0\npartial\n3\n3\noutput_chunk_list packed-visible-seven-byte-partial count 1\noutput_chunk packed-visible-seven-byte-partial index 0 hex \"abcdef\" count 3\nencoded\n4\noutput_chunk_list packed-visible-seven-byte-resume count 1\noutput_chunk packed-visible-seven-byte-resume index 0 hex \"12345678\" count 4\ninvalid\ncodec.encode_value_unrepresentable\nPackedVisibleSevenByteHeader.upper\nvalue must be between 0 and 127\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "packed-visible-seven-byte-partial"
chunks = ["abcdef"]

[[output_chunk_list]]
name = "packed-visible-seven-byte-resume"
chunks = ["12345678"]
