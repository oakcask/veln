command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "10\n5\n11184853\ncodec.encode_value_unrepresentable\nThreeBytePrefixReservedGroupHeader.high\nvalue must be between 0 and 15\ncodec.encode_value_unrepresentable\nThreeBytePrefixReservedGroupHeader.low\nvalue must be between 0 and 7\n"

[[json_assert]]
path = "error"
equals = null
