command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[schema.truncated_field]: truncated schema field at byte offset 6", "note: pending readiness is `need_bytes` because input is closed.", "note: Schema field expected 4 byte(s); 1 byte(s) were available.", "note: Nearby bytes: 00 00 05 01 04 00 (showing 6 of 6 byte(s), complete).", "note: Field path: schema `Http2FrameHeader` / field `stream_id`."]
