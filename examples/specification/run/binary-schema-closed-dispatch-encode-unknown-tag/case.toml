command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "schema.dispatch_unknown_tag\nClosedDispatchWritePacket.payload\ntag field `kind` value 7 must be one of 1, 2\n"

[[json_assert]]
path = "error"
equals = null
