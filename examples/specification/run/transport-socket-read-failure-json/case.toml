command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_READ_FAILED = "1"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals = ""

[[json_assert]]
path = "stderr"
equals = "transport read failed: forced_failure\n"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.message"
equals = "transport read failed: forced_failure"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.operation"
equals = "read"

[[json_assert]]
path = "error.details.stream_id"
equals = "stream-1"

[[json_assert]]
path = "error.details.input_committed"
equals = false

[[json_assert]]
path = "error.details.platform_cause"
equals = "VELN_NET_READ_FAILED"
