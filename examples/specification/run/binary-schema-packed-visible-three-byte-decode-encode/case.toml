command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "21\n60\n27\n3\n5\ndecoded\n21\n60\n27\n3\n5\n3\ndecoded\n21\n60\n27\n3\n5\n3\noutput_chunk_list packed-visible-three-byte-direct count 1\noutput_chunk packed-visible-three-byte-direct index 0 hex \"abcde5\" count 3\nencoded\noutput_chunk_list packed-visible-three-byte-derived count 1\noutput_chunk packed-visible-three-byte-derived index 0 hex \"abcde5\" count 3\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "packed-visible-three-byte-direct"
chunks = ["abcde5"]

[[output_chunk_list]]
name = "packed-visible-three-byte-derived"
chunks = ["abcde5"]
