command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "left 13 right 121 tie 31 timeout 0 closed 0\n"

[[json_assert]]
path = "error"
equals = null
