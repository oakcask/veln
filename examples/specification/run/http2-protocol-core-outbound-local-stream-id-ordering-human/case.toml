command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[http2.protocol.peer_stream_id_not_increasing]: peer-created stream id 1 is not greater than 3 at byte offset 0", "note: The client endpoint attempted to create idle stream 1 after peer-created stream 3.", "note: Nearby bytes: 00 00 01 01 04 00 00 00 (showing 8 of 9 byte(s), truncated).", "note: Active protocol state: idle-stream.", "note: Rule provenance: rfc9113_outbound_local_stream_ids_increase.", "note: Use a new peer-created stream id greater than 3."]
