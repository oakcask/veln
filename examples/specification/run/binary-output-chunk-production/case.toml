command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "full-produced"
chunks = ["0102", "030405", "06"]

[[output_chunk_list]]
name = "full-remaining"
chunks = []

[[output_chunk_list]]
name = "partial-produced"
chunks = ["0102", "030405"]

[[output_chunk_list]]
name = "partial-remaining"
chunks = ["06"]

[[output_chunk_list]]
name = "first-too-large-produced"
chunks = []

[[output_chunk_list]]
name = "first-too-large-remaining"
chunks = ["0102", "030405", "06"]

[[output_chunk_list]]
name = "zero-produced"
chunks = []

[[output_chunk_list]]
name = "zero-remaining"
chunks = ["0102", "030405", "06"]
