command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READS_HEX = "0102;0304,0a;0b0c"
VELN_NET_PRODUCTION_CLIENT_WRITES = "client-writes.hex"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "loop-complete\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "net-events.log"
equals = "listen-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream-1\nread-production production-stream-1 0102\nread-production production-stream-1 0304\nread-end-production production-stream-1\nwrite-production production-stream-1 ByteChunk([Byte(1), Byte(2)])\nwrite-production production-stream-1 ByteChunk([Byte(3), Byte(4)])\nclose-production production-stream-1\naccept-production 127.0.0.1:0 production-stream-2\nread-production production-stream-2 0a\nread-production production-stream-2 0b0c\nread-end-production production-stream-2\nwrite-production production-stream-2 ByteChunk([Byte(10)])\nwrite-production production-stream-2 ByteChunk([Byte(11), Byte(12)])\nclose-production production-stream-2\naccept-end-production 127.0.0.1:0\nclose-listener-production 127.0.0.1:0\n"

[[file_assert]]
path = "client-writes.hex"
equals = "01020304\n0a0b0c"
