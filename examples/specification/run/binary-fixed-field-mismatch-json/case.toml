command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "fixed field mismatch at byte offset 0"

[[json_assert]]
path = "error.details.byte_diagnostic.kind"
equals = "byte_diagnostic"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.fixed_field_mismatch"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 0

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"DemoPacket"},{"kind":"field","name":"kind"}]

[[json_assert]]
path = "error.details.byte_diagnostic.expected_value"
equals = 1

[[json_assert]]
path = "error.details.byte_diagnostic.actual_value"
equals = 255

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.data"
equals = "ff"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.preview_byte_count"
equals = 1

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.total_byte_count"
equals = 1

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.truncated"
equals = false

[[json_assert]]
path = "stderr"
equals = "Err(fixed field mismatch at byte offset 0)\n"
