command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READS_HEX = "0102,0a0b"
VELN_NET_PRODUCTION_CLIENT_WRITES = "client-writes.hex"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "success-streams 2 success-chunks 2 success-ended 2 success-writes 4 success-end-actions 2 success-retries 0 success-cleanup 0 success-clean-end true success-accept-cancelled 0 success-accept-deadline 0 cancel-streams 0 cancel-chunks 0 cancel-ended 0 cancel-writes 0 cancel-end-actions 0 cancel-retries 0 cancel-cleanup 0 cancel-clean-end false cancel-accept-cancelled 1 cancel-accept-deadline 0 midcancel-read cancelled midcancel-chunks 1 midcancel-writes 2 midcancel-cleanup 1\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "net-events.log"
equals = "listen-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream-1\nread-production production-stream-1 0102\nread-end-production production-stream-1\nwrite-production production-stream-1 ByteChunk([Byte(1), Byte(2)])\nwrite-production production-stream-1 ByteChunk([Byte(160)])\nclose-production production-stream-1\naccept-production 127.0.0.1:0 production-stream-2\nread-production production-stream-2 0a0b\nread-end-production production-stream-2\nwrite-production production-stream-2 ByteChunk([Byte(10), Byte(11)])\nwrite-production production-stream-2 ByteChunk([Byte(160)])\nclose-production production-stream-2\naccept-end-production 127.0.0.1:0\nclose-listener-production 127.0.0.1:0\nlisten-production 127.0.0.1:0\naccept-cancelled 127.0.0.1:0\nclose-listener-production 127.0.0.1:0\nlisten-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream-1\nread-production production-stream-1 0102\nread-cancelled production-stream-1\nwrite-production production-stream-1 ByteChunk([Byte(1), Byte(2)])\nwrite-production production-stream-1 ByteChunk([Byte(85)])\nclose-production production-stream-1\nclose-listener-production 127.0.0.1:0\n"

[[file_assert]]
path = "client-writes.hex"
equals = "0102a0\n0a0ba0"
