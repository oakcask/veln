command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_request_header_list"

[[json_assert]]
path = "error.details.protocol_diagnostic.failed_header_fact"
equals = "extended_connect_not_negotiated"

[[json_assert]]
path = "error.details.protocol_diagnostic.header_name"
equals = ":protocol"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "local-connect-protocol-disabled"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc8441_extended_connect_negotiation"
