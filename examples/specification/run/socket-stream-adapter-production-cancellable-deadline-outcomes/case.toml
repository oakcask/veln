command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READ_HEX = "0102ff"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "accept accept-deadline,accept-cancelled read read-deadline,read-cancelled\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "net-events.log"
equals = "listen-production 127.0.0.1:0\naccept-deadline 127.0.0.1:0\nclose-listener-production 127.0.0.1:0\nlisten-production 127.0.0.1:0\naccept-cancelled 127.0.0.1:0\nclose-listener-production 127.0.0.1:0\nlisten-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream\nread-deadline production-stream\nclose-production production-stream\nclose-listener-production 127.0.0.1:0\nlisten-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream\nread-cancelled production-stream\nclose-production production-stream\nclose-listener-production 127.0.0.1:0\n"
