command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_stream_id"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.required_stream_id_domain"
equals = "peer-created stream id greater than every previously admitted peer-created stream id"

[[json_assert]]
path = "error.details.protocol_diagnostic.endpoint_role"
equals = "server"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "idle-stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "peer_created_stream_ids_increase"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "0000000104000000"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = true

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.required_stream_id_domain"
equals = "peer-created stream id greater than every previously admitted peer-created stream id"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.rule_provenance"
equals = "peer_created_stream_ids_increase"
