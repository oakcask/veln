command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(codec.encode_value_unrepresentable, encode value is unrepresentable, RuntimeValueDiagnostic(Cons(RuntimeDiagnosticFieldPathSegment(schema, RuntimeValuePacket), Cons(RuntimeDiagnosticFieldPathSegment(field, value), Nil)), value must be between 0 and 255))"

[[json_assert]]
path = "error.details.value_diagnostic.kind"
equals = "value_diagnostic"

[[json_assert]]
path = "error.details.value_diagnostic.id"
equals = "codec.encode_value_unrepresentable"

[[json_assert]]
path = "error.details.value_diagnostic.field_path"
equals = [{"kind":"schema","name":"RuntimeValuePacket"},{"kind":"field","name":"value"}]

[[json_assert]]
path = "error.details.value_diagnostic.field_path_display"
equals = "RuntimeValuePacket.value"

[[json_assert]]
path = "error.details.value_diagnostic.reason"
equals = "value must be between 0 and 255"

[[result_value_assert]]
value_path = "error.details.value"
path = "constructor"
equals = "Err"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.constructor"
equals = "RuntimeDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.id"
equals = "codec.encode_value_unrepresentable"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeValueDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.field_path.0.name"
equals = "RuntimeValuePacket"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.reason"
equals = "value must be between 0 and 255"
