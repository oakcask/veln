format = "text"
contains = ["error[http2.protocol.continuation_expected]: expected CONTINUATION frame at byte offset 9", "note: Incoming frame kind 0 on stream 1 violated active continuation state `headers`.", "note: Pending header block started with frame kind 1 at byte offset 0 for stream 1; accumulated 3 header-block byte(s).", "note: Nearby bytes: 00 00 00 00 00 00 00 00 (showing 8 of 9 byte(s), truncated).", "note: Rule provenance: rfc9113_continuation_sequence."]
