command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "hpack.fixture.table_size_update_trailing_bytes"

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_header_table_size"
equals = 33

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_fixture"
equals = "fixture HPACK table-size update without trailing bytes"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "3f0200"
