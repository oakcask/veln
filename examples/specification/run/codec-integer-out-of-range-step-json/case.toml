command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "schema_version"
equals = "veln-run-json/v0"

[[json_assert]]
path = "command"
equals = "run"

[[json_assert]]
path = "exit_code"
equals = 1

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.message"
equals = "runtime result failure: Err(DecodeErrorWithReason(codec.integer_out_of_range, ByteOffset(18), ManualPacketWire.signed_byte, byte_width=1; min_value=-128; max_value=127; actual_value=128; reason=decoded value exceeds signed byte range))"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "DecodeErrorWithReason(codec.integer_out_of_range, ByteOffset(18), ManualPacketWire.signed_byte, byte_width=1; min_value=-128; max_value=127; actual_value=128; reason=decoded value exceeds signed byte range)"

[[json_assert]]
path = "error.details.byte_diagnostic.kind"
equals = "byte_diagnostic"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "codec.integer_out_of_range"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 18

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"ManualPacketWire"},{"kind":"field","name":"signed_byte"}]

[[json_assert]]
path = "error.details.byte_diagnostic.field_path_display"
equals = "ManualPacketWire.signed_byte"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_width"
equals = 1

[[json_assert]]
path = "error.details.byte_diagnostic.min_value"
equals = -128

[[json_assert]]
path = "error.details.byte_diagnostic.max_value"
equals = 127

[[json_assert]]
path = "error.details.byte_diagnostic.actual_value"
equals = 128

[[json_assert]]
path = "error.details.byte_diagnostic.reason"
equals = "decoded value exceeds signed byte range"

[[json_assert]]
path = "stderr"
equals_file = "case-text/json-assert-equals-1.txt"
