command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "stderr"
equals = "Err(byte count exceeds chunk length)\n"
