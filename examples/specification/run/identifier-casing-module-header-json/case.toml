command = ["run", "--json", "main.veln"]
exit = 1
source_errors = "expected"

[stdout]
format = "json"
equals_file = "case-text/stdout-1.json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics.0.id"
equals = "module.source_mod"

[[json_assert]]
path = "diagnostics.1.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.1.message"
equals = "module name `_net` must start with an ASCII lowercase letter"

[[json_assert]]
path = "diagnostics.1.span.start.line"
equals = 1

[[json_assert]]
path = "diagnostics.1.span.start.column"
equals = 5

[[json_assert]]
path = "diagnostics.1.span.end.column"
equals = 9

[[json_assert]]
path = "diagnostics.1.details.origin"
equals = "source"

[[json_assert]]
path = "diagnostics.1.details.occurrence"
equals = "declaration"

[[json_assert]]
path = "diagnostics.1.details.name"
equals = "_net"

[[json_assert]]
path = "diagnostics.1.details.name_class"
equals = "module"

[[json_assert]]
path = "diagnostics.1.details.required_initial"
equals = "ascii_lowercase"

[[json_assert]]
path = "diagnostics.1.details.observed_initial"
equals = "underscore"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 2

[[diagnostics]]
id = "name.invalid_case"
severity = "error"
kind = "name"
message = "module name `_net` must start with an ASCII lowercase letter"

[diagnostics.span]
file = "main.veln"
line = 1
column = 5
