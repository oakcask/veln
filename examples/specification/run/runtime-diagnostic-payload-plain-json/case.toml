command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "plain result failure"

[[json_assert]]
path = "error.details.byte_diagnostic"
missing = true

[[json_assert]]
path = "stderr"
equals_file = "case-text/json-assert-equals-1.txt"
