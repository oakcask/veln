command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "85\n171\n54699\ncodec.encode_value_unrepresentable\nLowWidthPrefixReservedTwoByteHeader.high\nvalue must be between 0 and 127\ncodec.encode_value_unrepresentable\nLowWidthPrefixReservedTwoByteHeader.low\nvalue must be between 0 and 255\n"

[[json_assert]]
path = "error"
equals = null
