command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "first decoded value 258 consumed 2 pending 2 base 102 suffix16 772\nsecond decoded value 772 consumed 2 pending 0 base 104\nwaiting need_more expected 2 consumed 0 pending 1 base 200 first8 5\n"

[[json_assert]]
path = "error"
equals = null
