command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "schema length division by zero at byte offset 2"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.length_division_by_zero"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 2

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"CountedValues"},{"kind":"field","name":"items"}]

[[json_assert]]
path = "error.details.byte_diagnostic.length_expression"
equals = "total_count / group_count"

[[json_assert]]
path = "error.details.byte_diagnostic.divisor_operand"
equals = "group_count"

[[json_assert]]
path = "error.details.byte_diagnostic.operator"
equals = "/"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.data"
equals = "0800"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.preview_byte_count"
equals = 2

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.total_byte_count"
equals = 2

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.truncated"
equals = false
