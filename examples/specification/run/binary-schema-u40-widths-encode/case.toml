command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals = "output_chunk_list u40-widths count 1\noutput_chunk u40-widths index 0 hex \"01020304050504030201\" count 10\ndecoded 4328719365 4328719365\n"

[[output_chunk_list]]
name = "u40-widths"
chunks = ["01020304050504030201"]
