command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "output_chunk_list range-field-selection count 1\noutput_chunk range-field-selection index 0 hex \"12340102\" count 4\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "range-field-selection"
chunks = ["12340102"]
