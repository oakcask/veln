command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(hpack.fixture.malformed_huffman_padding, HPACK fixture malformed Huffman padding at byte offset 9, RuntimeHpackFixtureDiagnostic(9, 3, 4, fixture HPACK Huffman padding, hpack_fixture, ByteChunk([Byte(4), Byte(129), Byte(0)])))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "hpack.fixture.malformed_huffman_padding"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_header_block_size"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_first_byte"
equals = 4

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "048100"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.id"
equals = "hpack.fixture.malformed_huffman_padding"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHpackFixtureDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.preview.bytes.2.value"
equals = 0
