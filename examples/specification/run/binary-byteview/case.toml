command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "1\n258\n66051\n66051\n2147483647\n4294967295\n2\n4660\nbyte read requires 3 bytes but view has 2\nbyte view range exceeds chunk length\nbyte_write_u8_be value must be between 0 and 255\nbyte_read_u31_be value exceeds maximum 2147483647\n1\n"

[[json_assert]]
path = "error"
equals = null
