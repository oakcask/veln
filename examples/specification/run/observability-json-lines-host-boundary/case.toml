command = ["run", "--json", "main", "main.veln", "clock.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/stdout.txt"

[[json_assert]]
path = "stderr"
equals_file = "case-text/stderr.txt"

[[json_assert]]
path = "error"
equals = null
