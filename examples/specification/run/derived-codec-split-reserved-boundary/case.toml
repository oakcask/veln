command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n2\n5\n1\ninvalid\n0\nschema.reserved_bits_mismatch\n11\nSplitReservedHeader.gap\nencoded\n"

[[json_assert]]
path = "error"
equals = null
