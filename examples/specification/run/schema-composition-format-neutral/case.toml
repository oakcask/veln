command = ["run", "--json", "main", "main.veln", "wire.veln", "facade.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "3\nstable\n4\nalias\nbody\n"

[[json_assert]]
path = "error"
equals = null
