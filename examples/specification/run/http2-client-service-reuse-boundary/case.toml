command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READS_HEX = "00000004000000000000000101050000000189;00000604000000000000030000000000000101050000000389,00000004000000000000000101050000000189"
VELN_NET_PRODUCTION_CLIENT_WRITES = "client-writes.hex"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "response stream 1 reused false lifecycle open active 0 capacity 2147483647\nresponse stream 3 reused true lifecycle open active 0 capacity 0\nresponse stream 1 reused false lifecycle open active 0 capacity 2147483647\nservice ok\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "client-writes.hex"
equals = "505249202a20485454502f322e300d0a0d0a534d0d0a0d0a000000040000000000000003010500000001828784"

[[file_assert]]
path = "net-events.log"
