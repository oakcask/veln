command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.peer_limit.concurrent_streams_exceeded, HTTP/2 concurrent stream receive limit exceeded at byte offset 9, RuntimeHttp2Diagnostic(RuntimeHttp2PeerLimitConcurrentStreamsDiagnostic(9, 3, 2, 1, server, open-stream, local_configuration, peer_created_stream_receive_limit, ByteChunk([Byte(0), Byte(0), Byte(0), Byte(1), Byte(4), Byte(0), Byte(0), Byte(0), Byte(3)]))))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.peer_limit.concurrent_streams_exceeded"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.current_open_peer_created_stream_count"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.attempted_concurrent_stream_count"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.allowed_concurrent_stream_count"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.endpoint_role"
equals = "server"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "open-stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.receive_limit_provenance"
equals = "local_configuration"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "peer_created_stream_receive_limit"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "0000000104000000"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = true

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.attempted_concurrent_stream_count"
equals = 2

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.allowed_concurrent_stream_count"
equals = 1

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.endpoint_role"
equals = "server"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.rule_provenance"
equals = "peer_created_stream_receive_limit"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.preview.bytes.8.value"
equals = 3
