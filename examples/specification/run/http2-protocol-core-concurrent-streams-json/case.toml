command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "HTTP/2 concurrent stream receive limit exceeded at byte offset 9"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.peer_limit.concurrent_streams_exceeded"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.attempted_concurrent_stream_count"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.allowed_concurrent_stream_count"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "open-stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.receive_limit_provenance"
equals = "local_configuration"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "peer_created_stream_receive_limit"
