command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value_diagnostic.id"
equals = "schema.encode_value_unrepresentable"

[[json_assert]]
path = "error.details.value_diagnostic.field_path"
equals = [{"kind":"schema","name":"PacketWire"},{"kind":"field","name":"payload"}]

[[json_assert]]
path = "error.details.value_diagnostic.field_path_display"
equals = "PacketWire.payload"

[[json_assert]]
path = "error.details.value_diagnostic.reason"
equals = "byte view count 3 does not match length field `length` value 2"

[[json_assert]]
path = "error.details.value_diagnostic.expected_count"
equals = 2

[[json_assert]]
path = "error.details.value_diagnostic.actual_count"
equals = 3

[[json_assert]]
path = "error.details.value_diagnostic.length_expression"
equals = "length"

[[json_assert]]
path = "error.details.value_diagnostic.byte_offset"
equals = 0

[[json_assert]]
path = "error.details.value_diagnostic.byte_preview"
equals = {"encoding":"hex","data":"aabbcc","preview_byte_count":3,"total_byte_count":3,"truncated":false}
