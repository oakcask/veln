command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals = "output_chunk_list big-endian-widths count 1\noutput_chunk big-endian-widths index 0 hex \"12341234567fffffffdeadbeef\" count 13\ndecoded 4660 1193046 2147483647 3735928559\n"

[[output_chunk_list]]
name = "big-endian-widths"
chunks = ["12341234567fffffffdeadbeef"]
