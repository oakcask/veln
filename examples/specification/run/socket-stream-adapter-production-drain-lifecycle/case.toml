command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READS_HEX = "010203,0a0b,0c0d0e0f"
VELN_NET_PRODUCTION_CLIENT_WRITES = "client-writes.hex"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "streams 3 chunks 3 ended 3 writes 3 end-actions 3 clean-end true\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "net-events.log"
equals = "listen-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream-1\nread-production production-stream-1 010203\nread-end-production production-stream-1\nwrite-production production-stream-1 ByteChunk([Byte(1), Byte(2), Byte(3)])\nclose-production production-stream-1\naccept-production 127.0.0.1:0 production-stream-2\nread-production production-stream-2 0a0b\nread-end-production production-stream-2\nwrite-production production-stream-2 ByteChunk([Byte(10), Byte(11)])\nclose-production production-stream-2\naccept-production 127.0.0.1:0 production-stream-3\nread-production production-stream-3 0c0d0e0f\nread-end-production production-stream-3\nwrite-production production-stream-3 ByteChunk([Byte(12), Byte(13), Byte(14), Byte(15)])\nclose-production production-stream-3\naccept-end-production 127.0.0.1:0\n"

[[file_assert]]
path = "client-writes.hex"
equals = "010203\n0a0b\n0c0d0e0f"
