command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "HTTP/2 expected CONTINUATION frame at byte offset 9"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.continuation_expected"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.actual_frame_kind"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.actual_stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.started_frame_kind"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.started_byte_offset"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.active_continuation"
equals = "headers"
