command = ["run", "main", "main.veln"]
source_errors = "expected"
exit = 1

[tools]
java = "fake-success"

[env]
JAVA_MARKER = "java-started"

[stdout]
format = "empty"

[stderr]
format = "text"
contains = [
  "main.veln:6:13: error[type.invalid_annotation]: invalid type annotation `State::Missing`: variant refinement alternatives must resolve to declared variants of one ADT",
]

[[file_assert]]
path = ".veln-harness-cache/jvm"
missing = true

[[file_assert]]
path = "java-started"
missing = true
