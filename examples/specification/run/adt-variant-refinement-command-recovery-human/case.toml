command = ["run", "main", "main.veln"]
source_errors = "expected"
exit = 1

[tools]
java = "fake-success"

[env]
JAVA_MARKER = "java-started"

[stdout]
format = "empty"

[stderr]
format = "text"
contains = [
  "main.veln:7:20: error[type.variant_refinement_unknown]: variant `Missing` is not a variant of `State`",
]

[[file_assert]]
path = ".veln-harness-cache/jvm"
missing = true

[[file_assert]]
path = "java-started"
missing = true
