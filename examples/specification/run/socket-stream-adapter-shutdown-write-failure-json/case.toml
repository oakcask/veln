command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_ACCEPT_STREAM = "fixture-stream"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals = ""

[[json_assert]]
path = "stderr"
equals = "transport write failed: closed\n"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.message"
equals = "transport write failed: closed"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.lifecycle_phase"
equals = "write_shutdown"

[[json_assert]]
path = "error.details.ownership_committed"
equals = true

[[json_assert]]
path = "error.details.platform_cause"
equals = "stream write side is shut down"

[[file_assert]]
path = "net-events.log"
equals = "listen 127.0.0.1:0\naccept 127.0.0.1:0 fixture-stream\nwrite fixture-stream ByteChunk([Byte(10), Byte(11)])\nshutdown-write fixture-stream\n"
