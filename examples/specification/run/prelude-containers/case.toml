command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "odd\nno-separator\n42\n1\n2\nremoved\n6\n9\nbad\nb\n7\nstop\n"

[[json_assert]]
path = "error"
equals = null
