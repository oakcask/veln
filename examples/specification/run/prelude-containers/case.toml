command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "odd\nb:c\nno-separator\n42\n1\n2\nremoved\n6\n15\nbad\nb\n7\nstop\nempty\n6\n6\n4\n12\nstop\nlist-empty\n"

[[json_assert]]
path = "error"
equals = null
