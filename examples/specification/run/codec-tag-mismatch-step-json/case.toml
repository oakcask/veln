command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "schema_version"
equals = "veln-run-json/v0"

[[json_assert]]
path = "command"
equals = "run"

[[json_assert]]
path = "exit_code"
equals = 1

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.message"
equals = "runtime result failure: Err(DecodeErrorWithReason(codec.tag_mismatch, ByteOffset(14), ManualPacketWire.kind, expected_tag=DATA; actual_tag=HEADERS; reason=dispatch tag did not match selected payload))"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "DecodeErrorWithReason(codec.tag_mismatch, ByteOffset(14), ManualPacketWire.kind, expected_tag=DATA; actual_tag=HEADERS; reason=dispatch tag did not match selected payload)"

[[json_assert]]
path = "error.details.byte_diagnostic.kind"
equals = "byte_diagnostic"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "codec.tag_mismatch"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 14

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"ManualPacketWire"},{"kind":"field","name":"kind"}]

[[json_assert]]
path = "error.details.byte_diagnostic.field_path_display"
equals = "ManualPacketWire.kind"

[[json_assert]]
path = "error.details.byte_diagnostic.expected_tag"
equals = "DATA"

[[json_assert]]
path = "error.details.byte_diagnostic.actual_tag"
equals = "HEADERS"

[[json_assert]]
path = "error.details.byte_diagnostic.reason"
equals = "dispatch tag did not match selected payload"

[[json_assert]]
path = "stderr"
equals = "Err(DecodeErrorWithReason(codec.tag_mismatch, ByteOffset(14), ManualPacketWire.kind, expected_tag=DATA; actual_tag=HEADERS; reason=dispatch tag did not match selected payload))\n"
