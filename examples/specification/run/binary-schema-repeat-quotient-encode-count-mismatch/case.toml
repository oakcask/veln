command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "codec.encode_value_unrepresentable\nCountedValues.items\nlist length 3 does not match count expression `total_count / group_count` value 4\n"

[[json_assert]]
path = "error"
equals = null
