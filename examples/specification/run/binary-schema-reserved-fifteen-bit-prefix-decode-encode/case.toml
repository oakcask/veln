command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "1\n170\n170\ndecoded\n1\n2\nencoded\noutput_chunk_list reserved-fifteen-bit-prefix count 1\noutput_chunk reserved-fifteen-bit-prefix index 0 hex \"aaab\" count 2\ninvalid\ncodec.encode_value_unrepresentable\nFifteenBitPrefixHeader.control\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "reserved-fifteen-bit-prefix"
chunks = ["aaab"]
