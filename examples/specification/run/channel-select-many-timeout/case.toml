command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "ready 121 timeout 0 route-actions 170 chunks 1 ended false\n"

[[json_assert]]
path = "error"
equals = null
