command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "4660 5\noutput_chunk_list schema-local-projection count 1\noutput_chunk schema-local-projection index 0 hex \"123405\" count 3\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "schema-local-projection"
chunks = ["123405"]
