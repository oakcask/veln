command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "empty highest 0\nfirst highest 1\nignored-trailer highest 1\nignored-known highest 1\nhigher highest 7\nnew-higher decision accepted\nlower decision rejected\nlower stream 3 previous 7 role server state idle-stream rule peer_created_stream_ids_increase preview 9\n"

[[json_assert]]
path = "error"
equals = null
