command = ["run", "--json", "main", "main.veln", "hpack_fixture.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(hpack.fixture.dynamic_index_out_of_range, HPACK dynamic index out of range at byte offset 29, RuntimeHttp2HpackDiagnostic(RuntimeHpackFixtureDynamicIndexDiagnostic(29, 1, 190, 0, 0, fixture dynamic indexed header, hpack_fixture, ByteChunk([Byte(190)]))))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "hpack.fixture.dynamic_index_out_of_range"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 29

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_header_block_size"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_first_byte"
equals = 190

[[json_assert]]
path = "error.details.protocol_diagnostic.requested_dynamic_index"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.dynamic_table_entry_count"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_fixture"
equals = "fixture dynamic indexed header"

[[json_assert]]
path = "error.details.protocol_diagnostic.codec_module"
equals = "hpack_fixture"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "be"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = false

[[result_value_assert]]
value_path = "error.details.value"
path = "constructor"
equals = "Err"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.constructor"
equals = "RuntimeDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.id"
equals = "hpack.fixture.dynamic_index_out_of_range"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.constructor"
equals = "RuntimeHpackFixtureDynamicIndexDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.byte_offset"
equals = 29

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.requested_dynamic_index"
equals = 0

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.dynamic_table_entry_count"
equals = 0

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.preview.bytes.0.value"
equals = 190
