command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals = "2147483649\n1\n1\n0\noutput_chunk_list flag32le-packet count 1\noutput_chunk flag32le-packet index 0 hex \"01000080\" count 4\n"

[[output_chunk_list]]
name = "flag32le-packet"
chunks = ["01000080"]
