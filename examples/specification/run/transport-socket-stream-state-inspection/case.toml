command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READ_HEX = "010203"
VELN_NET_PRODUCTION_CLIENT_WRITES = "client-writes.hex"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "open read=true write=true closed=false\nread-shutdown read=false write=true closed=false\nwrite-shutdown read=false write=false closed=false\nclosed read=false write=false closed=true\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "net-events.log"
equals = "listen-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream\nshutdown-read-production production-stream\nwrite-production production-stream ByteChunk([Byte(14), Byte(15)])\nshutdown-write-production production-stream\nclose-production production-stream\n"

[[file_assert]]
path = "client-writes.hex"
equals = "0e0f"
