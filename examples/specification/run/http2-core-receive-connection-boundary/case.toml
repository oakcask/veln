command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "settings accepted settings\nsettings offset 39 buffered 0 initial true output 1\noutput_chunk_list settings count 1\noutput_chunk settings index 0 hex \"000000040100000000\" count 9\nping-buffered accepted buffered\nping-buffered offset 39 buffered 12 initial true output 1\nping accepted none\nping offset 56 buffered 0 initial true output 2\noutput_chunk_list ping count 2\noutput_chunk ping index 0 hex \"000000040100000000\" count 9\noutput_chunk ping index 1 hex \"0000080601000000000102030405060708\" count 17\npriority accepted priority\npriority offset 55 buffered 0 initial true output 0\ninitial-gate failure initial-peer-settings http2.protocol.initial_peer_settings_required offset 0 kind 6 stream 0 preview 9\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "settings"
chunks = ["000000040100000000"]

[[output_chunk_list]]
name = "ping"
chunks = ["000000040100000000", "0000080601000000000102030405060708"]
