command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "settings"
chunks = ["000000040100000000"]

[[output_chunk_list]]
name = "ping"
chunks = ["000000040100000000", "0000080601000000000102030405060708"]

[[output_chunk_list]]
name = "ordered"
chunks = ["000000040100000000", "0000080601000000000102030405060708"]

[[output_chunk_list]]
name = "complete-partial"
chunks = ["000000040100000000"]

[[output_chunk_list]]
name = "push-promise"
chunks = ["0000080600000000000908070605040302"]
