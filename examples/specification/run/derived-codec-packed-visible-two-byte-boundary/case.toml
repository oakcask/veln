command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n10\n2\nneed_more\nneed_bytes\n2\n0\npartial\n1\n1\noutput_chunk_list packed-visible-two-byte-partial count 1\noutput_chunk packed-visible-two-byte-partial index 0 hex \"ab\" count 1\nencoded\n1\noutput_chunk_list packed-visible-two-byte-resume count 1\noutput_chunk packed-visible-two-byte-resume index 0 hex \"cd\" count 1\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "packed-visible-two-byte-partial"
chunks = ["ab"]

[[output_chunk_list]]
name = "packed-visible-two-byte-resume"
chunks = ["cd"]
