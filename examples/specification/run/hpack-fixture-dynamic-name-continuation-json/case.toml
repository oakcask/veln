command = ["run", "--json", "main", "main.veln", "hpack_fixture.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "hpack.fixture.dynamic_name_continuation_missing"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 97

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_header_block_size"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_first_byte"
equals = 127

[[json_assert]]
path = "error.details.protocol_diagnostic.requested_dynamic_index"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.dynamic_table_entry_count"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_fixture"
equals = "fixture dynamic-name continuation entry"

[[json_assert]]
path = "error.details.protocol_diagnostic.codec_module"
equals = "hpack_fixture"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "7f00055041544348"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = false
