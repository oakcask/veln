command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "first accepted\nfirst lifecycle draining last 5 error 11 active 1\ndrained lifecycle closed last 5 error 11 active 0\ntightened accepted\ntightened lifecycle closed last 3 error 22 active 1\nrelaxed failure http2.protocol.stream_after_goaway offset 57 stream 7 last 5 state draining role server rule goaway_last_stream_id reason boundary_increased preview 9\ntruncated failure http2.frame.payload_read_failure offset 66 stream 0 last 0 state none role none rule payload_read reason byte view range exceeds chunk length preview 9\ninput lifecycle open last 0 error 0 active 1\naccepted-accessor accepted connection shutdown decision has no failure\nrejected-accessor rejected connection shutdown decision has no state\n"

[[json_assert]]
path = "error"
equals = null
