command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.reserved_bits_mismatch"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 71

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"ReservedStepPacket"},{"kind":"field","name":"padding"}]

[[json_assert]]
path = "error.details.byte_diagnostic.field_path_display"
equals = "ReservedStepPacket.padding"

[[json_assert]]
path = "stderr"
equals_file = "case-text/json-assert-equals-1.txt"
