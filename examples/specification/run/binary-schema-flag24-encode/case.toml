command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "output_chunk_list flag24-packet count 1\noutput_chunk flag24-packet index 0 hex \"123456563412\" count 6\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "flag24-packet"
chunks = ["123456563412"]
