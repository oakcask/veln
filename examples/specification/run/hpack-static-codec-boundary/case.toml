command = ["run", "--json", "main", "main.veln", "hpack_fixture.veln", "hpack_static.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "authority decoded :authority,:fixture first :authority  wire_size 1\nmethod-get decoded :method,:fixture first :method GET wire_size 8\nmethod-post decoded :method,:fixture first :method POST wire_size 9\npath-root decoded :path,:fixture first :path / wire_size 6\npath-index decoded :path,:fixture first :path /index.html wire_size 9\nscheme-http decoded :scheme,:fixture first :scheme http wire_size 8\nscheme-https decoded :scheme,:fixture first :scheme https wire_size 9\nstatus-200 decoded :status,:fixture first :status 200 wire_size 9\nstatus-500 decoded :status,:fixture first :status 500 wire_size 9\naccept-encoding decoded accept-encoding,:fixture first accept-encoding gzip, deflate wire_size 9\nstatus-404 decoded :status,:fixture first :status 404 wire_size 9\nwww-authenticate decoded www-authenticate,:fixture first www-authenticate  wire_size 9\nrequest-get-https-root decoded :method,:scheme,:path first :method GET wire_size 9\nrequest-post-http-root decoded :method,:scheme,:path first :method POST wire_size 9\nunsupported-static-index failed offset 20 observed_size 1 observed_first_byte 128 expected HPACK static indexed header\nstatic-table-above-boundary failed offset 21 observed_size 1 observed_first_byte 190 expected HPACK static indexed header\nliteral-falls-through failed offset 21 observed_size 3 observed_first_byte 16 expected HPACK static indexed header block\nliteral-authority decoded :authority,:fixture first :authority abc.test wire_size 10\nliteral-path decoded :path,:fixture first :path /target wire_size 9\nliteral-status decoded :status,:fixture first :status 201 wire_size 5\nliteral-server decoded server,:fixture first server ok wire_size 5\nliteral-content-type decoded content-type,:fixture first content-type text wire_size 7\nliteral-user-agent decoded user-agent,:fixture first user-agent agent wire_size 8\nliteral-method-falls-through failed offset 28 observed_size 5 observed_first_byte 2 expected HPACK static indexed header block\nliteral-huffman-falls-through failed offset 29 observed_size 5 observed_first_byte 4 expected HPACK static indexed header block\nliteral-malformed-length-falls-through failed offset 30 observed_size 5 observed_first_byte 8 expected HPACK static indexed header block\nliteral-saturated-length-falls-through failed offset 31 observed_size 2 observed_first_byte 8 expected HPACK static indexed header block\n"

[[json_assert]]
path = "error"
equals = null
