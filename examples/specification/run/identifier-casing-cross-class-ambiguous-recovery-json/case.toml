command = ["run", "--json", "main", "main.veln"]
source_errors = "expected"
exit = 1

[stdout]
format = "json"
not_contains = ["name.invalid_case"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[diagnostics]]
id = "name.unresolved"
kind = "name"
message = "unresolved call_target `Bad`"
