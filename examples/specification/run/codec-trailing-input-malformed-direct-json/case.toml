command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "codec.trailing_input"

[[json_assert]]
path = "error.details.byte_diagnostic.reason"
equals = "consumed_count=5; available_count=8; remaining_count=4; reason=inconsistent trailing byte counts"

[[json_assert]]
path = "error.details.byte_diagnostic.consumed_count"
missing = true

[[json_assert]]
path = "error.details.byte_diagnostic.remaining_count"
missing = true

[[json_assert]]
path = "error.details.byte_diagnostic.available_count"
missing = true
