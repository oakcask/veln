# Host-integration contract: protocol failure crosses the spawned service task;
# inherited `net::IO` provider and JSON output detects classification drift.
command = ["run", "--json", "main", "main.veln", "fixture_effects.veln", "fake_effects.veln", "http2_service_effects.veln"]
exit = 0

[requires]
jdk = true

[env]

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"
