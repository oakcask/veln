command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.peer_limit.header_table_size_exceeded, HTTP/2 header table size exceeds receive maximum at byte offset 35, RuntimeHttp2Diagnostic(RuntimeHttp2PeerLimitHeaderTableSizeDiagnostic(35, 289, 160, 9, 1, local_configuration, hpack_dynamic_table_size_update, ByteChunk([Byte(63), Byte(129), Byte(1)]))))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.peer_limit.header_table_size_exceeded"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 35

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_header_table_size"
equals = 289

[[json_assert]]
path = "error.details.protocol_diagnostic.allowed_header_table_size"
equals = 160

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.receive_limit_provenance"
equals = "local_configuration"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "hpack_dynamic_table_size_update"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "3f8101"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = false

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.constructor"
equals = "RuntimeHttp2PeerLimitHeaderTableSizeDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.observed_header_table_size"
equals = 289

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.allowed_header_table_size"
equals = 160

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.receive_limit_provenance"
equals = "local_configuration"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.preview.bytes.1.value"
equals = 129
