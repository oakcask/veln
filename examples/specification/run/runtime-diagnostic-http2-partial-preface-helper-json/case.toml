command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.partial_preface, HTTP/2 input ended with partial client connection preface at byte offset 0, RuntimeHttp2ProtocolPartialPrefaceDiagnostic(0, 12, 24, connection-preface, rfc9113_client_connection_preface, ByteChunk([Byte(80), Byte(82), Byte(73), Byte(32), Byte(42), Byte(32), Byte(72), Byte(84), Byte(84), Byte(80), Byte(47), Byte(50)])))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.partial_preface"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.pending_count"
equals = 12

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_count"
equals = 24

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "505249202a204854"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 12

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = true

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "connection-preface"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_client_connection_preface"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHttp2ProtocolPartialPrefaceDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.pending_count"
equals = 12

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.expected_count"
equals = 24

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.active_state"
equals = "connection-preface"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.rule_provenance"
equals = "rfc9113_client_connection_preface"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.preview.constructor"
equals = "ByteChunk"
