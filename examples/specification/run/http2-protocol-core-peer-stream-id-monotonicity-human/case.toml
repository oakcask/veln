command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[http2.protocol.peer_stream_id_not_increasing]: peer-created stream id 3 is not greater than 5 at byte offset 9", "note: The server endpoint attempted to create idle stream 3 after peer-created stream 5.", "note: Nearby bytes: 00 00 00 01 04 00 00 00 (showing 8 of 9 byte(s), truncated).", "note: Active protocol state: idle-stream.", "note: Rule provenance: rfc9113_peer_stream_ids_increase.", "note: Use a new peer-created stream id greater than 5."]
