command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[http2.protocol.invalid_stream_id]: invalid stream id at byte offset 9", "note: Frame kind 1 on stream 3 requires peer-created stream id greater than every previously admitted peer-created stream id for server.", "note: Nearby bytes: 00 00 00 01 04 00 00 00 (showing 8 of 9 byte(s), truncated).", "note: Active protocol state: idle-stream.", "note: Rule provenance: peer_created_stream_ids_increase."]
