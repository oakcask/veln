command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.invalid_window_update_increment, HTTP/2 invalid WINDOW_UPDATE increment at byte offset 0, RuntimeHttp2Diagnostic(RuntimeHttp2ProtocolInvalidWindowUpdateIncrementDiagnostic(0, 0, 0, 1, 2147483647, connection-flow-control, window_update_increment_nonzero, ByteChunk([Byte(0), Byte(0), Byte(0), Byte(0)]))))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_window_update_increment"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "connection"

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_window_increment"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.accepted_min_window_increment"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.accepted_max_window_increment"
equals = 2147483647

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "00000000"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 4

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 4

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = false

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "connection-flow-control"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "window_update_increment_nonzero"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.constructor"
equals = "RuntimeHttp2ProtocolInvalidWindowUpdateIncrementDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.stream_id"
equals = 0

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.observed_window_increment"
equals = 0

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.accepted_min_window_increment"
equals = 1

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.accepted_max_window_increment"
equals = 2147483647

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.preview.constructor"
equals = "ByteChunk"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.fields"
missing = true
