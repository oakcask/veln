command = ["run", "--json", "main", "main.veln", "wire.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "imported-closed 5 2 3 abc\nimported-extension 5 2 3 abc\ncodec-imported-closed decoded 6\ncodec-imported-extension decoded 7\n"

[[json_assert]]
path = "error"
equals = null
