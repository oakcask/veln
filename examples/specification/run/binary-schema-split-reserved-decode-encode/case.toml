command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "2\n5\n213\ncodec.encode_value_unrepresentable\nSplitReservedHeader.high\nvalue must be between 0 and 3\n"

[[json_assert]]
path = "error"
equals = null
