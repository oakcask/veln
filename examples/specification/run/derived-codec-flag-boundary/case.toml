command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n40\n4660\n3\nneed_more\nneed_bytes\n3\n0\nencoded\noutput_chunk_list derived-codec-flag count 1\noutput_chunk derived-codec-flag index 0 hex \"283412\" count 3\ninvalid\ncodec.encode_value_unrepresentable\nFlagControlPacket.window\nvalue must be between 0 and 65535\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "derived-codec-flag"
chunks = ["283412"]
