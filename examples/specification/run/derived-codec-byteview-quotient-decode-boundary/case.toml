command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n8\n4\n43707\n6\nneed_more\nneed_bytes\n2\n0\ninvalid\nnone\n0\n0\nschema.length_out_of_bounds\n28\nPacketWire.payload\n"

[[json_assert]]
path = "error"
equals = null
