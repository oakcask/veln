# Integration contract: `veln run` must stop at whole-analysis function and
# named-generic variance failures. The output sentinel, JVM cache, and fake-Java
# marker independently detect accidental execution after semantic rejection.
command = ["run", "--json", "main", "main.veln"]
source_errors = "expected"
exit = 1

[tools]
java = "fake-success"

[env]
JAVA_MARKER = "java-started"

[stdout]
format = "json"
not_contains = ["forbidden"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 2

[[json_assert]]
path = "diagnostics.0.id"
equals = "type.mismatch"

[[json_assert]]
path = "diagnostics.0.details.nested_incompatibility.path.0.kind"
equals = "function_input"

[[json_assert]]
path = "diagnostics.1.id"
equals = "type.mismatch"

[[json_assert]]
path = "diagnostics.1.details.nested_incompatibility.path.0.kind"
equals = "named_argument"

[[file_assert]]
path = ".veln-harness-cache/jvm"
missing = true

[[file_assert]]
path = "java-started"
missing = true
