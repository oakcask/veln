command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals = "4611686018427387905\n0\n1\n1\n0\noutput_chunk_list flag64be-packet count 1\noutput_chunk flag64be-packet index 0 hex \"4000000000000001\" count 8\n"

[[output_chunk_list]]
name = "flag64be-packet"
chunks = ["4000000000000001"]
