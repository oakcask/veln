command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "width-1 18 42 52\nwidth-2 18 17 52\nwidth-3 18 18 52\nwidth-4 18 7 52\nwidth-5 18 3 52\nwidth-6 18 2 52\nwidth-7 18 1 52\n"

[[json_assert]]
path = "error"
equals = null
