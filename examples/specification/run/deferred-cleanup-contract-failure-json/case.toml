command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/stdout.txt"

[[json_assert]]
path = "error.kind"
equals = "contract"

[[json_assert]]
path = "error.details.clause"
equals = "require"

[[json_assert]]
path = "error.details.function"
equals = "reject"

[[json_assert]]
path = "error.related"
length = 1

[[json_assert]]
path = "error.related.0.kind"
equals = "cleanup_failure"

[[json_assert]]
path = "error.related.0.message"
equals = "invalid shift count 64 for operator `<<`; expected a value between 0 and 63"
