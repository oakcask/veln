command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "18 171 52\noutput_chunk_list byte-aligned-reserved-mapping count 1\noutput_chunk byte-aligned-reserved-mapping index 0 hex \"12ab34\" count 3\ncodec.encode_mapping_mismatch\nReservedPacketWire.marker\nmapped reserved field `marker` must equal declared value 171\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "byte-aligned-reserved-mapping"
chunks = ["12ab34"]
