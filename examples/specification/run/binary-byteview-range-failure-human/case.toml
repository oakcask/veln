command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[codec.byte_range_out_of_bounds]: byte range out of bounds at byte offset 2", "note: Byte range requested 2 byte(s); 1 byte(s) were available from the offset.", "note: Nearby bytes: 02 (showing 1 of 1 byte(s), complete)."]
