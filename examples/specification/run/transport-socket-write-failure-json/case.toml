command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_WRITE_FAILED = "1"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals = ""

[[json_assert]]
path = "stderr"
equals = "transport write failed: forced_failure\n"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.message"
equals = "transport write failed: forced_failure"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.operation"
equals = "write"

[[json_assert]]
path = "error.details.local_endpoint"
equals = "127.0.0.1:0"

[[json_assert]]
path = "error.details.peer_endpoint"
equals = "stream-1"

[[json_assert]]
path = "error.details.stream_id"
equals = "stream-1"

[[json_assert]]
path = "error.details.output_committed"
equals = false
