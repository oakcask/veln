command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.invalid_priority_dependency, HTTP/2 invalid PRIORITY dependency at byte offset 0, RuntimeHttp2ProtocolPriorityDependencyDiagnostic(0, 1, 1, stream-control, rfc9113_priority_dependency, ByteChunk([Byte(0), Byte(0), Byte(0), Byte(1), Byte(15)])))"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_priority_dependency"

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.dependency_stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "000000010f"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "stream-control"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_priority_dependency"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHttp2ProtocolPriorityDependencyDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.5.constructor"
equals = "ByteChunk"
