command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.peer_limit.header_list_size_exceeded, HTTP/2 header list size exceeds peer-advertised outbound maximum at byte offset 0, RuntimeHttp2Diagnostic(RuntimeHttp2PeerLimitHeaderListSizeDiagnostic(0, 42, 41, 5, 1, peer_settings_item, peer_settings_max_header_list_size, ByteChunk([]))))"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.peer_limit.header_list_size_exceeded"

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_header_list_size"
equals = 42

[[json_assert]]
path = "error.details.protocol_diagnostic.allowed_header_list_size"
equals = 41

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 5

[[json_assert]]
path = "error.details.protocol_diagnostic.receive_limit_provenance"
equals = "peer_settings_item"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "peer_settings_max_header_list_size"
