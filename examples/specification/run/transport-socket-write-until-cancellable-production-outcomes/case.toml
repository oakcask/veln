command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "write-completed,write-deadline,write-cancelled\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "net-events.log"
equals = "listen-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream\nwrite-production production-stream ByteChunk([Byte(10), Byte(11)])\nclose-production production-stream\nclose-listener-production 127.0.0.1:0\nlisten-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream\nwrite-deadline production-stream\nclose-production production-stream\nclose-listener-production 127.0.0.1:0\nlisten-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream\nwrite-cancelled production-stream\nclose-production production-stream\nclose-listener-production 127.0.0.1:0\n"
