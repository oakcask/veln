command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals = "36028797018963969\n1\n1\n0\noutput_chunk_list flag56be-packet count 1\noutput_chunk flag56be-packet index 0 hex \"80000000000001\" count 7\n"

[[output_chunk_list]]
name = "flag56be-packet"
chunks = ["80000000000001"]
