command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(hpack.fixture.malformed_string_length, HPACK fixture malformed string length at byte offset 9, RuntimeHpackFixtureDiagnostic(9, 2, 4, fixture HPACK string length, hpack_fixture, ByteChunk([Byte(4), Byte(255)])))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "hpack.fixture.malformed_string_length"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_header_block_size"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_first_byte"
equals = 4

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_fixture"
equals = "fixture HPACK string length"

[[json_assert]]
path = "error.details.protocol_diagnostic.codec_module"
equals = "hpack_fixture"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "04ff"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = false

[[result_value_assert]]
value_path = "error.details.value"
path = "constructor"
equals = "Err"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.constructor"
equals = "RuntimeDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.id"
equals = "hpack.fixture.malformed_string_length"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.message"
equals = "HPACK fixture malformed string length at byte offset 9"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHpackFixtureDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.byte_offset"
equals = 9

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.observed_header_block_size"
equals = 2

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.observed_first_byte"
equals = 4

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.expected_fixture"
equals = "fixture HPACK string length"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.codec_module"
equals = "hpack_fixture"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.preview.constructor"
equals = "ByteChunk"
