command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.stream_after_goaway, HTTP/2 stream opened after graceful shutdown at byte offset 0, RuntimeHttp2ProtocolStreamAfterGoawayDiagnostic(0, 7, 5, graceful_shutdown, local, goaway_last_stream_id))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.stream_after_goaway"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 7

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.last_stream_id"
equals = 5

[[json_assert]]
path = "error.details.protocol_diagnostic.shutdown_state"
equals = "graceful_shutdown"

[[json_assert]]
path = "error.details.protocol_diagnostic.endpoint_role"
equals = "local"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "graceful_shutdown"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "goaway_last_stream_id"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHttp2ProtocolStreamAfterGoawayDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.0"
equals = 0

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.1"
equals = 7

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.2"
equals = 5

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.4"
equals = "local"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.6"
missing = true
