command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "selected 0:1:2:3:4:5:6:7 action-score 640 payload-bytes 11 first-ended true second-chunks 1 third-ended true fourth-chunks 1 fifth-ended true sixth-chunks 1 seventh-chunks 1 eighth-chunks 1 writes 5\n"

[[json_assert]]
path = "error"
equals = null
