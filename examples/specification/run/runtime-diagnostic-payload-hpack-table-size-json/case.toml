command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(hpack.fixture.table_size_update_not_at_start, HPACK fixture table-size update after header field at byte offset 10, RuntimeHttp2HpackDiagnostic(RuntimeHpackFixtureTableSizeUpdateDiagnostic(10, 2, 62, 30, 1, 1, hpack-fixture, fixture HPACK table-size update at header block start, hpack_fixture, ByteChunk([Byte(130), Byte(62)]))))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "hpack.fixture.table_size_update_not_at_start"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 10

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_header_block_size"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_first_byte"
equals = 62

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_header_table_size"
equals = 30

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "hpack-fixture"

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_fixture"
equals = "fixture HPACK table-size update at header block start"

[[json_assert]]
path = "error.details.protocol_diagnostic.codec_module"
equals = "hpack_fixture"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "823e"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = false

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.constructor"
equals = "RuntimeHpackFixtureTableSizeUpdateDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.observed_header_table_size"
equals = 30

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.frame_kind"
equals = 1

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.stream_id"
equals = 1
