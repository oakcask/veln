command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "encoded\noutput_chunk_list derived-counted-views count 1\noutput_chunk derived-counted-views index 0 hex \"0202aabbccdd\" count 6\ninvalid\nschema.encode_value_unrepresentable\nCountedViews.items.0\nbyte view count 1 does not match length field `item_length` value 2\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "derived-counted-views"
chunks = ["0202aabbccdd"]
