command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "closed 1 42\nextension 1 42\nunknown 7 2\n"

[[json_assert]]
path = "error"
equals = null
