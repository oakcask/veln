command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n1193046\n1193046\n6\nneed_more\nneed_bytes\n6\n0\nencoded\noutput_chunk_list flag24-derived-encoded count 1\noutput_chunk flag24-derived-encoded index 0 hex \"123456563412\" count 6\npartial\n2\n2\noutput_chunk_list flag24-derived-partial count 1\noutput_chunk flag24-derived-partial index 0 hex \"1234\" count 2\nencoded\n4\noutput_chunk_list flag24-derived-resume count 1\noutput_chunk flag24-derived-resume index 0 hex \"56563412\" count 4\ninvalid\ncodec.encode_value_unrepresentable\nFlag24ControlPacket.flags_be\nvalue must be between 0 and 16777215\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "flag24-derived-encoded"
chunks = ["123456563412"]

[[output_chunk_list]]
name = "flag24-derived-partial"
chunks = ["1234"]

[[output_chunk_list]]
name = "flag24-derived-resume"
chunks = ["56563412"]
