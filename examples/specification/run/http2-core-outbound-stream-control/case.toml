command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "rst-stream"
chunks = ["00000403000000000100000008"]

[[output_chunk_list]]
name = "priority"
chunks = ["000005020000000001800000030f"]
