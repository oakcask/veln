command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "repeat-add"
chunks = ["0203000100020003000400ff"]

[[output_chunk_list]]
name = "repeat-subtract"
chunks = ["05020001000200ff"]

[[output_chunk_list]]
name = "repeat-product"
chunks = ["02030001000200030004000500ff"]
