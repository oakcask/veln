command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.peer_limit.settings_value_out_of_range, HTTP/2 SETTINGS value outside accepted range at byte offset 15, RuntimeHttp2Diagnostic(RuntimeHttp2PeerLimitSettingsValueDiagnostic(15, 2, SETTINGS_ENABLE_PUSH, 2, 0, 1, peer_settings, ByteChunk([Byte(0), Byte(2), Byte(0), Byte(0), Byte(0), Byte(2)]))))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.peer_limit.settings_value_out_of_range"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 15

[[json_assert]]
path = "error.details.protocol_diagnostic.setting_identifier"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.setting_name"
equals = "SETTINGS_ENABLE_PUSH"

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_value"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.accepted_min_value"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.accepted_max_value"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "000200000002"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 6

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 6

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = false

[[json_assert]]
path = "error.details.protocol_diagnostic.peer_limit_provenance"
equals = "peer_settings"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.constructor"
equals = "RuntimeHttp2PeerLimitSettingsValueDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.setting_identifier"
equals = 2

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.setting_name"
equals = "SETTINGS_ENABLE_PUSH"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.peer_limit_provenance"
equals = "peer_settings"
