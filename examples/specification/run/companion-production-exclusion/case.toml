command = ["run", "--json", "main"]
source_errors = "expected"
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "production\n"

[[json_assert]]
path = "error"
equals = null
