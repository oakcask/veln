command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n21\n60\n3\nneed_more\nneed_bytes\n3\n0\npartial\n1\n1\noutput_chunk_list packed-visible-three-byte-partial count 1\noutput_chunk packed-visible-three-byte-partial index 0 hex \"ab\" count 1\nencoded\n2\noutput_chunk_list packed-visible-three-byte-resume count 1\noutput_chunk packed-visible-three-byte-resume index 0 hex \"cde5\" count 2\ninvalid\ncodec.encode_value_unrepresentable\nPackedVisibleThreeByteHeader.upper\nvalue must be between 0 and 127\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "packed-visible-three-byte-partial"
chunks = ["ab"]

[[output_chunk_list]]
name = "packed-visible-three-byte-resume"
chunks = ["cde5"]
