command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n2\n87\n6\nneed_more\nneed_bytes\n6\n0\npartial\n2\n2\noutput_chunk_list packed-visible-six-byte-partial count 1\noutput_chunk packed-visible-six-byte-partial index 0 hex \"abcd\" count 2\nencoded\n4\noutput_chunk_list packed-visible-six-byte-resume count 1\noutput_chunk packed-visible-six-byte-resume index 0 hex \"ef123456\" count 4\ninvalid\ncodec.encode_value_unrepresentable\nPackedVisibleSixByteHeader.upper\nvalue must be between 0 and 127\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "packed-visible-six-byte-partial"
chunks = ["abcd"]

[[output_chunk_list]]
name = "packed-visible-six-byte-resume"
chunks = ["ef123456"]
