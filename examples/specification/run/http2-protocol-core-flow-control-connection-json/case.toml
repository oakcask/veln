command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.peer_limit.flow_control_window_exceeded, HTTP/2 flow-control window exceeded at byte offset 0, RuntimeHttp2Diagnostic(RuntimeHttp2PeerLimitFlowControlWindowDiagnostic(0, 4, 3, 0, 1, connection-flow-control, connection_receive_window, ByteChunk([Byte(1), Byte(2), Byte(3), Byte(4)]))))"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.constructor"
equals = "RuntimeDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.constructor"
equals = "RuntimeHttp2PeerLimitFlowControlWindowDiagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.peer_limit.flow_control_window_exceeded"

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_payload_length"
equals = 4

[[json_assert]]
path = "error.details.protocol_diagnostic.allowed_window_credit"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "connection-flow-control"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "connection_receive_window"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "01020304"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 4

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 4

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = false
