command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "EncodeError(codec.encode_value_unrepresentable, ManualPacketWire.kind, kind must be less than or equal to length)"

[[json_assert]]
path = "error.details.value_diagnostic.kind"
equals = "value_diagnostic"

[[json_assert]]
path = "error.details.value_diagnostic.id"
equals = "codec.encode_value_unrepresentable"

[[json_assert]]
path = "error.details.value_diagnostic.field_path"
equals = [{"kind":"schema","name":"ManualPacketWire"},{"kind":"field","name":"kind"}]

[[json_assert]]
path = "error.details.value_diagnostic.field_path_display"
equals = "ManualPacketWire.kind"

[[json_assert]]
path = "error.details.value_diagnostic.reason"
equals = "kind must be less than or equal to length"

[[json_assert]]
path = "stderr"
equals = "Err(EncodeError(codec.encode_value_unrepresentable, ManualPacketWire.kind, kind must be less than or equal to length))\n"
