command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "data accepted data kind 0 stream 5 length 4\nupdated connection 16 receive 10 send 21 lifecycle half-closed-remote error 0 offset 44\ninput connection 20 receive 14 send 21 lifecycle open error 0 offset 31\nstream-window accepted stream-window-update kind 8 stream 5 length 4\nstream-window connection 16 receive 10 send 27 lifecycle half-closed-remote error 0 offset 57\nconnection-window accepted connection-window-update kind 8 stream 0 length 4\nconnection-window connection 23 receive 10 send 27 lifecycle half-closed-remote error 0 offset 70\ngoaway accepted goaway kind 7 stream 0 length 8\ngoaway lifecycle draining last 5 error 11 offset 48\nrst accepted rst-stream kind 3 stream 5 length 4\nrst connection 20 receive 14 send 21 lifecycle reset error 8 offset 44\nadmission failure stream-frame-admission http2.protocol.invalid_frame_kind offset 31 kind 0 stream 0 preview 9\nflow failure data-flow-control http2.flow_control.window_exceeded offset 31 kind 0 stream 5 preview 9\ngoaway failure connection-shutdown http2.protocol.stream_after_goaway offset 48 kind 7 stream 7 preview 9\naccessor accepted receive frame decision has no failure\nrejected-accessor rejected receive frame decision has no state\n"

[[json_assert]]
path = "error"
equals = null
