# Integration contract: `run --json` projects a residual computed-zero remainder
# after folding its divisor, including source context, prior output, and cleanup.
command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"
contains = ["\"id\":\"runtime.remainder_by_zero\"", "\"operator\":\"%\"", "\"divisor\":0", "\"divisor_span\"", "\"operation_span\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.message"
equals = "remainder divisor is zero"

[[json_assert]]
path = "error.related.0.kind"
equals = "operation"

[[json_assert]]
path = "error.details.divisor_span.start.line"
equals = 6

[[json_assert]]
path = "error.details.divisor_span.start.column"
equals = 18

[[json_assert]]
path = "error.details.divisor_span.end.column"
equals = 25

[[json_assert]]
path = "error.details.operation_span.start.column"
equals = 14

[[json_assert]]
path = "error.details.operation_span.end.column"
equals = 25

[[json_assert]]
path = "stdout"
equals_file = "case-text/stdout.txt"
