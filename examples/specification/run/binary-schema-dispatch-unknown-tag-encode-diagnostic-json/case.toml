command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value_diagnostic.id"
equals = "codec.dispatch_unknown_tag"

[[json_assert]]
path = "error.details.value_diagnostic.field_path"
equals = [{"kind":"schema","name":"ClosedDispatchWritePacket"},{"kind":"field","name":"payload"}]

[[json_assert]]
path = "error.details.value_diagnostic.field_path_display"
equals = "ClosedDispatchWritePacket.payload"

[[json_assert]]
path = "error.details.value_diagnostic.reason"
equals = "tag field `kind` value 7 must be one of 1, 2"
