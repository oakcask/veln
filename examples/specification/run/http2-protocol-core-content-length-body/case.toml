command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "outbound-content-length-data-first accepted encoded_length 2 application_length 2 end_stream 0 connection_window 18 open_stream 1 closed_stream 0 stream_window 18 expected 5 observed 2 output_frames 1\noutbound-content-length-data-exact accepted encoded_length 3 application_length 3 end_stream 1 connection_window 15 open_stream 0 closed_stream 1 stream_window 0 expected 0 observed 0 output_frames 1\noutbound-content-length-padded accepted encoded_length 20 application_length 5 end_stream 1 connection_window 10 open_stream 0 closed_stream 1 stream_window 0 expected 0 observed 0 output_frames 5\n"

[[json_assert]]
path = "error"
equals = null
