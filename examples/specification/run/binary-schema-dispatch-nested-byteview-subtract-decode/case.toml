command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "closed 5 2 3 43707\n5 1 extension 5 2 3 43707\nstep decoded 6\ncodec-closed decoded 6\ncodec-extension decoded 7\n"

[[json_assert]]
path = "error"
equals = null
