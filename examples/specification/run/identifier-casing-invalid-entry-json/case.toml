command = ["run", "--json", "Main", "main.veln", "--", "1"]
source_errors = "expected"
exit = 1

[stdout]
format = "json"
contains = [
  "\"id\":\"name.invalid_case\"",
  "\"name\":\"Main\"",
  "\"name\":\"Value\"",
  "\"name_class\":\"function\"",
  "\"name_class\":\"value_binding\"",
]

[stderr]
format = "empty"

[[json_assert]]
path = "schema_version"
equals = 1

[[json_assert]]
path = "summary.diagnostic_count"
equals = 2

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.1.id"
equals = "name.invalid_case"
