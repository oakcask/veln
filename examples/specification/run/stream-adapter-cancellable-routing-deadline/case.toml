command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_TIME_DEADLINE_EXPIRED = "1"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "deadline-expired score 1912 chunks 1\n"

[[json_assert]]
path = "error"
equals = null
