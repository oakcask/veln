command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "closed 2 3 6 43707\n8 1 extension 2 3 6 43707\nstep decoded 9\ncodec-closed decoded 9\ncodec-extension decoded 10\n"

[[json_assert]]
path = "error"
equals = null
