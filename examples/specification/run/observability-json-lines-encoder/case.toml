command = ["run", "--json", "main", "main.veln", "a/b.veln", "clock.veln", "exporter.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/records.jsonl"

[[json_assert]]
path = "stderr"
equals = ""

[[json_assert]]
path = "error"
equals = null
