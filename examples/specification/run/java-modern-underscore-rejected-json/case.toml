# CLI/JVM integration: run rejects the malformed modern Java version before
# cache preparation or VelnEntry launch and owns the JSON tool error.
command = ["run", "--json", "main", "main.veln"]
exit = 1

[tools]
java = "fake-java-modern-underscore"

[env]
JAVA_MARKER = "java-started"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "error.kind"
equals = "runner"

[[json_assert]]
path = "error.details.phase"
equals = "tool"

[[json_assert]]
path = "error.message"
contains = "could not determine the selected `java` major version"

[[file_assert]]
path = ".veln-harness-cache/jvm"
missing = true

[[file_assert]]
path = "java-started"
missing = true
