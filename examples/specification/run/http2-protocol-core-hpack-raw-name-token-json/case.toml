command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.invalid_request_header_list, HTTP/2 request header list contains invalid ordinary header name bad@name at byte offset 12, RuntimeHttp2ProtocolInvalidRequestHeaderListDiagnostic(12, 1, 1, ordinary_header_name_invalid_token, bad@name, bad@name, request-trailers, rfc9110_field_name_token))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_request_header_list"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 12

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.failed_header_fact"
equals = "ordinary_header_name_invalid_token"

[[json_assert]]
path = "error.details.protocol_diagnostic.header_name"
equals = "bad@name"

[[json_assert]]
path = "error.details.protocol_diagnostic.decoded_header_names"
equals = "bad@name"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "request-trailers"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9110_field_name_token"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.constructor"
equals = "RuntimeDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.id"
equals = "http2.protocol.invalid_request_header_list"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHttp2ProtocolInvalidRequestHeaderListDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.failed_header_fact"
equals = "ordinary_header_name_invalid_token"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.active_state"
equals = "request-trailers"
