command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "derived-control 1 7 3\nderived-data 2 5 3\nwritten-control 1 7 3\nwritten-data 2 5 3\n"

[[json_assert]]
path = "error"
equals = null
