command = ["run", "--json", "main", "main.veln", "hpack_fixture.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[output_chunk_list]]
name = "http2-outbound-hpack-table-size-update-accepted"
chunks = ["0000010104000000013e"]

[[output_chunk_list]]
name = "http2-outbound-hpack-after-table-size-update-headers"
chunks = ["00000401000000000144072f740000040900000000016172676500000109040000000174"]

[[output_chunk_list]]
name = "http2-outbound-hpack-after-table-size-update-push-promise"
chunks = ["0000060500000000010000000244070000060900000000012f746172676500000109040000000174"]

[[output_chunk_list]]
name = "http2-outbound-hpack-table-size-update-over-peer-limit"
chunks = []
