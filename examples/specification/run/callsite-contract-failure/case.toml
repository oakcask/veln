command = ["run", "--json", "main", "main.veln", "contracts.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "contract"

[[json_assert]]
path = "error.details.clause"
equals = "require"

[[json_assert]]
path = "error.details.predicate"
equals = "rejects()"

[[json_assert]]
path = "error.details.function"
equals = "rejected"

[[json_assert]]
path = "error.details.blame"
equals = "caller"
