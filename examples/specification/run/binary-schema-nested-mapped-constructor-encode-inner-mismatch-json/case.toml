command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value_diagnostic.id"
equals = "codec.encode_mapping_mismatch"

[[json_assert]]
path = "error.details.value_diagnostic.field_path"
equals = [{"kind":"schema","name":"HeaderWire"},{"kind":"field","name":"wrapped"}]

[[json_assert]]
path = "error.details.value_diagnostic.field_path_display"
equals = "HeaderWire.wrapped"

[[json_assert]]
path = "error.details.value_diagnostic.reason"
equals = "expected constructor `Payload::Payload`, found `Payload::OtherPayload`"
