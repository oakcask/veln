command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.invalid_request_header_list, HTTP/2 request header list contains empty :path at byte offset 12, RuntimeHttp2ProtocolInvalidRequestHeaderListDiagnostic(12, 1, 1, path_value_empty, :path, :method,:scheme,:path, request-headers, rfc9113_request_pseudo_headers))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_request_header_list"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 12

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.failed_header_fact"
equals = "path_value_empty"

[[json_assert]]
path = "error.details.protocol_diagnostic.header_name"
equals = ":path"

[[json_assert]]
path = "error.details.protocol_diagnostic.decoded_header_names"
equals = ":method,:scheme,:path"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "request-headers"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_request_pseudo_headers"
