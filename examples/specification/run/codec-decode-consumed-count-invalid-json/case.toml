command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.message"
equals = "runtime result failure: Err(DecodeError(codec.consumed_count_invalid, ByteOffset(9), OversizedPacketCodec))"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "DecodeError(codec.consumed_count_invalid, ByteOffset(9), OversizedPacketCodec)"

[[json_assert]]
path = "error.details.byte_diagnostic.kind"
equals = "byte_diagnostic"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "codec.consumed_count_invalid"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 9

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"OversizedPacketCodec"}]

[[json_assert]]
path = "error.details.byte_diagnostic.field_path_display"
equals = "OversizedPacketCodec"

[[json_assert]]
path = "stderr"
equals = "Err(DecodeError(codec.consumed_count_invalid, ByteOffset(9), OversizedPacketCodec))\n"
