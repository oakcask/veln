command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "output_chunk_list derived-record-payload-packet count 1\noutput_chunk derived-record-payload-packet index 0 hex \"071234\" count 3\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "derived-record-payload-packet"
chunks = ["071234"]
