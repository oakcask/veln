command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.closed_with_pending"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 12

[[json_assert]]
path = "error.details.protocol_diagnostic.pending_count"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.active_continuation"
equals = "headers"

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.started_frame_kind"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.started_byte_offset"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.accumulated_header_block_bytes"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_continuation_sequence"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHttp2ProtocolClosedWithPendingDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.active_continuation"
equals = "headers"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.accumulated_header_block_bytes"
equals = 3
