command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "wide-suffix-eight"
chunks = ["5415555555555555"]

[[output_chunk_list]]
name = "wide-suffix-eight-derived"
chunks = ["5415555555555555"]
