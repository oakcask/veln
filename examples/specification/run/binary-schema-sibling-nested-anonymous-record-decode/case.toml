command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "helper 10 1 515 1284 6 460809 11 255\nexplicit 460809 12\n"

[[json_assert]]
path = "error"
equals = null
