command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_EVENT_RECORD_FAILED_PREFIX = "listen-production "
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "error.message"
equals = "transport listen failed: event_record_failed"

[[json_assert]]
path = "error.details.operation"
equals = "listen"

[[json_assert]]
path = "error.details.category"
equals = "event_record_failed"

[[json_assert]]
path = "error.details.local_endpoint"
equals = "127.0.0.1:39127"

[[json_assert]]
path = "error.details.listener_id"
equals = "127.0.0.1:39127"

[[json_assert]]
path = "error.details.stream_id"
missing = true

[[json_assert]]
path = "error.details.lifecycle_phase"
equals = "listener_bound"

[[json_assert]]
path = "error.details.ownership_committed"
equals = true

[[json_assert]]
path = "error.details.platform_cause"
equals = "could not record VELN_NET_EVENTS"
