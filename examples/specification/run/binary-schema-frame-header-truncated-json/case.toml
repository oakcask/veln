command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "DecodeError(schema.truncated_field, ByteOffset(6), Http2FrameHeaderWire.stream_id)"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.truncated_field"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 6

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"Http2FrameHeaderWire"},{"kind":"field","name":"stream_id"}]

[[json_assert]]
path = "error.details.byte_diagnostic.field_path_display"
equals = "Http2FrameHeaderWire.stream_id"

[[json_assert]]
path = "stderr"
equals_file = "case-text/json-assert-equals-1.txt"
