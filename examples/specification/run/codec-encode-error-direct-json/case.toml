command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "schema_version"
equals = "veln-run-json/v0"

[[json_assert]]
path = "command"
equals = "run"

[[json_assert]]
path = "exit_code"
equals = 1

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "EncodeError(codec.encode_value_unrepresentable, ManualPacketWire.payload, byte view count 3 does not match length field `length` value 2)"

[[json_assert]]
path = "error.details.value_diagnostic.kind"
equals = "value_diagnostic"

[[json_assert]]
path = "error.details.value_diagnostic.id"
equals = "codec.encode_value_unrepresentable"

[[json_assert]]
path = "error.details.value_diagnostic.field_path"
equals = [{"kind":"schema","name":"ManualPacketWire"},{"kind":"field","name":"payload"}]

[[json_assert]]
path = "error.details.value_diagnostic.field_path_display"
equals = "ManualPacketWire.payload"

[[json_assert]]
path = "error.details.value_diagnostic.reason"
equals = "byte view count 3 does not match length field `length` value 2"

[[json_assert]]
path = "stderr"
equals = "Err(EncodeError(codec.encode_value_unrepresentable, ManualPacketWire.payload, byte view count 3 does not match length field `length` value 2))\n"
