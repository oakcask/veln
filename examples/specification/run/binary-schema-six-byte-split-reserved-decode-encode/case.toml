command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "10\n45\n42\n187727495509930\ncodec.encode_value_unrepresentable\nSixByteSplitReservedHeader.mode\nvalue must be between 0 and 63\n"

[[json_assert]]
path = "error"
equals = null
