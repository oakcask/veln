command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_CLOSE_FAILED = "1"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals = ""

[[json_assert]]
path = "stderr"
equals = "transport listener close failed: forced_failure\n"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.message"
equals = "transport listener close failed: forced_failure"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.operation"
equals = "listener_close"

[[json_assert]]
path = "error.details.listener_id"
equals = "127.0.0.1:0"

[[json_assert]]
path = "error.details.lifecycle_phase"
equals = "before_operation"

[[json_assert]]
path = "error.details.ownership_committed"
equals = false

[[file_assert]]
path = "net-events.log"
equals = "listen 127.0.0.1:0\n"
