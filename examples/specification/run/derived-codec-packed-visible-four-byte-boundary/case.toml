command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n21\n60\n4\nneed_more\nneed_bytes\n4\n0\npartial\n2\n2\noutput_chunk_list packed-visible-four-byte-partial count 1\noutput_chunk packed-visible-four-byte-partial index 0 hex \"abcd\" count 2\nencoded\n2\noutput_chunk_list packed-visible-four-byte-resume count 1\noutput_chunk packed-visible-four-byte-resume index 0 hex \"ef12\" count 2\ninvalid\ncodec.encode_value_unrepresentable\nPackedVisibleFourByteHeader.upper\nvalue must be between 0 and 127\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "packed-visible-four-byte-partial"
chunks = ["abcd"]

[[output_chunk_list]]
name = "packed-visible-four-byte-resume"
chunks = ["ef12"]
