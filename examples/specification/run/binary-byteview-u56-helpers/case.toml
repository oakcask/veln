command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "u56-big"
chunks = ["01020304050607"]

[[output_chunk_list]]
name = "u56-little"
chunks = ["07060504030201"]

[[output_chunk_list]]
name = "u56-max-big"
chunks = ["ffffffffffffff"]

[[output_chunk_list]]
name = "u56-max-little"
chunks = ["ffffffffffffff"]
