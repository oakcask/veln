command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "truncated schema field `tail` at byte offset 5"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.truncated_field"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 5

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"RecursiveAnonymousRecordPacket"},{"kind":"field","name":"header"},{"kind":"field","name":"detail"},{"kind":"field","name":"trailer"},{"kind":"field","name":"tail"}]

[[json_assert]]
path = "error.details.byte_diagnostic.expected_count"
equals = 2

[[json_assert]]
path = "error.details.byte_diagnostic.available_count"
equals = 1

[[json_assert]]
path = "error.details.byte_diagnostic.readiness"
equals = "need_bytes"
