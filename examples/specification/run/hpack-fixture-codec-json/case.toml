command = ["run", "--json", "main", "main.veln", "hpack_fixture.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "stdout"
equals = "path-index decoded :path /index.html wire_size 9 next_decode_count 1\nmethod-get encoded_count 1 first_byte 130 expected_first_byte 130 next_encode_count 1 table_size 4096\npath-root encoded_count 1 first_byte 132 expected_first_byte 132 next_encode_count 1 table_size 4096\nscheme-https encoded_count 1 first_byte 135 expected_first_byte 135 next_encode_count 1 table_size 4096\nstatus-200 encoded_count 1 first_byte 136 expected_first_byte 136 next_encode_count 1 table_size 4096\nunsupported-name encode_failure offset 31 observed_size 6 observed_first_byte 120 expected_fixture fixture header list encoding codec_module hpack_fixture\nunsupported-value encode_failure offset 37 observed_size 7 observed_first_byte 58 expected_fixture fixture header list encoding codec_module hpack_fixture\n"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(hpack.fixture.unsupported_header_block, HPACK fixture unsupported header block at byte offset 27, RuntimeHpackFixtureDiagnostic(27, 1, 255, fixture header block, hpack_fixture, ByteChunk([Byte(255)])))"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "hpack.fixture.unsupported_header_block"

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_header_block_size"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_first_byte"
equals = 255

[[json_assert]]
path = "error.details.protocol_diagnostic.codec_module"
equals = "hpack_fixture"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "ff"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = false

[[result_value_assert]]
value_path = "error.details.value"
path = "constructor"
equals = "Err"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.constructor"
equals = "RuntimeDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.id"
equals = "hpack.fixture.unsupported_header_block"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.message"
equals = "HPACK fixture unsupported header block at byte offset 27"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHpackFixtureDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.byte_offset"
equals = 27

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.observed_header_block_size"
equals = 1

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.observed_first_byte"
equals = 255

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.expected_fixture"
equals = "fixture header block"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.codec_module"
equals = "hpack_fixture"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.preview.constructor"
equals = "ByteChunk"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.preview.bytes.0.value"
equals = 255
