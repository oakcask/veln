command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.peer_limit.header_list_size_exceeded, HTTP/2 header list size exceeds receive maximum at byte offset 12, RuntimeHttp2PeerLimitHeaderListSizeDiagnostic(12, 10, 9, 9, 1, local_configuration, header_list_receive_limit, ByteChunk([Byte(6), Byte(7), Byte(8), Byte(9), Byte(10), Byte(11), Byte(12), Byte(13), Byte(14)])))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.peer_limit.header_list_size_exceeded"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 12

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_header_list_size"
equals = 10

[[json_assert]]
path = "error.details.protocol_diagnostic.allowed_header_list_size"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.receive_limit_provenance"
equals = "local_configuration"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "header_list_receive_limit"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "060708090a0b0c0d"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = true

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHttp2PeerLimitHeaderListSizeDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.observed_header_list_size"
equals = 10

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.allowed_header_list_size"
equals = 9

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.receive_limit_provenance"
equals = "local_configuration"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.rule_provenance"
equals = "header_list_receive_limit"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.preview.constructor"
equals = "ByteChunk"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields"
missing = true
