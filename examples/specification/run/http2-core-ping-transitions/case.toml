command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "ping-request"
chunks = ["0000080600000000000102030405060708"]

[[output_chunk_list]]
name = "ping-ack"
chunks = ["0000080601000000000102030405060708"]
