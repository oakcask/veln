command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "channel count 2 u16 772 offset fixed field mismatch at byte offset 3\nretained-count 2\ntask count 2 u16 1029 offset fixed field mismatch at byte offset 4\n"

[[json_assert]]
path = "error"
equals = null
