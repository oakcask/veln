command = ["run", "--json", "main", "main.veln", "wire.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n7\n3\n3\nneed_more\nneed_bytes\n3\n0\ninvalid\nschema.validation_failed\n32\nPacketWire.wire_kind\n"

[[json_assert]]
path = "error"
equals = null
