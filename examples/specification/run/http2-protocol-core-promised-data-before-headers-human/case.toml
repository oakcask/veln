command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[http2.protocol.invalid_frame_kind]: invalid frame kind at byte offset 0", "note: Frame kind 0 on stream 2 did not match expected frame kind 1.", "note: Active protocol state: reserved-by-peer-stream.", "note: Rule provenance: reserved_by_peer_requires_response_headers."]
