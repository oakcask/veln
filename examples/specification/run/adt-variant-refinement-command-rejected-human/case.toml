# At the `veln run` semantic gate, stdio::println is only a user-code execution sentinel.
# `not_contains = ["forbidden"]` proves rejection precedes user code; missing JVM cache
# and `java-started` assertions separately prove backend execution did not start.
command = ["run", "main", "main.veln"]
source_errors = "expected"
exit = 1

[tools]
java = "fake-success"

[env]
JAVA_MARKER = "java-started"

[stdout]
format = "empty"

[stderr]
format = "text"
contains = [
  "main.veln:12:14: error[type.variant_mismatch]: value of type `State::Closed` is not assignable to variant type `State::Ready`",
  "note: main.veln:12:14: Excluded variants: Closed.",
  "note: main.veln:6:1: Callee parameter type declared here.",
]
not_contains = ["forbidden"]

[[file_assert]]
path = ".veln-harness-cache/jvm"
missing = true

[[file_assert]]
path = "java-started"
missing = true
