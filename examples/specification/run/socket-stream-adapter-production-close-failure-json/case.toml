command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READS_HEX = "010203,0a0b"
VELN_NET_CLOSE_FAILED = "1"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals = ""

[[json_assert]]
path = "stderr"
equals = "transport stream close failed: forced_failure\n"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.message"
equals = "transport stream close failed: forced_failure"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.operation"
equals = "stream_close"

[[json_assert]]
path = "error.details.stream_id"
equals = "production-stream-1"

[[json_assert]]
path = "error.details.lifecycle_phase"
equals = "before_operation"

[[json_assert]]
path = "error.details.ownership_committed"
equals = false

[[file_assert]]
path = "net-events.log"
equals = "listen-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream-1\nread-production production-stream-1 010203\nwrite-production production-stream-1 ByteChunk([Byte(1), Byte(2), Byte(3)])\n"
