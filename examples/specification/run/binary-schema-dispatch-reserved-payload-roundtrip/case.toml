command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[output_chunk_list]]
name = "closed-reserved-roundtrip"
chunks = ["014a"]

[[output_chunk_list]]
name = "one-bit-reserved-roundtrip"
chunks = ["010180"]

[[output_chunk_list]]
name = "extension-reserved-roundtrip"
chunks = ["0201ab07"]
