command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals = "closed-decode 1 10\noutput_chunk_list closed-reserved-roundtrip count 1\noutput_chunk closed-reserved-roundtrip index 0 hex \"014a\" count 2\none-bit-decode 1 3\noutput_chunk_list one-bit-reserved-roundtrip count 1\noutput_chunk one-bit-reserved-roundtrip index 0 hex \"010180\" count 3\nextension-decode 2 1 7\noutput_chunk_list extension-reserved-roundtrip count 1\noutput_chunk extension-reserved-roundtrip index 0 hex \"0201ab07\" count 4\n"

[[output_chunk_list]]
name = "closed-reserved-roundtrip"
chunks = ["014a"]

[[output_chunk_list]]
name = "one-bit-reserved-roundtrip"
chunks = ["010180"]

[[output_chunk_list]]
name = "extension-reserved-roundtrip"
chunks = ["0201ab07"]
