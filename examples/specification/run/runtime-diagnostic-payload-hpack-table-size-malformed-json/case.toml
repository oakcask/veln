command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(hpack.fixture.table_size_update_malformed, HPACK fixture malformed table-size update integer at byte offset 77, RuntimeHpackFixtureDiagnostic(77, 2, 63, fixture HPACK malformed table-size update integer, hpack_fixture, ByteChunk([Byte(63), Byte(128)])))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "hpack.fixture.table_size_update_malformed"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 77

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_header_block_size"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_first_byte"
equals = 63

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_fixture"
equals = "fixture HPACK malformed table-size update integer"

[[json_assert]]
path = "error.details.protocol_diagnostic.codec_module"
equals = "hpack_fixture"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "3f80"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = false

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHpackFixtureDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.byte_offset"
equals = 77

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.observed_header_block_size"
equals = 2

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.observed_first_byte"
equals = 63

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.expected_fixture"
equals = "fixture HPACK malformed table-size update integer"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.codec_module"
equals = "hpack_fixture"
