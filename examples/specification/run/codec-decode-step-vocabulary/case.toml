command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n3\n3\nneed_more\nneed_bytes\n8\ninvalid\ncodec.invalid_input\n5\nDemoPacket.kind\n"

[[json_assert]]
path = "error"
equals = null
