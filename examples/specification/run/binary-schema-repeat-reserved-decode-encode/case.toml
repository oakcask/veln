command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "3\n42\noutput_chunk_list repeat-reserved count 1\noutput_chunk repeat-reserved index 0 hex \"03abcdabcdabcd2a\" count 8\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "repeat-reserved"
chunks = ["03abcdabcdabcd2a"]
