command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals = ""

[[json_assert]]
path = "stderr"
equals_file = "case-text/json-assert-equals-1.txt"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.message"
equals = "cancellation token is observer-only"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"
