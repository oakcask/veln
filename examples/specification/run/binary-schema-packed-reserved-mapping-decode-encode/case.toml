command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "18 5\noutput_chunk_list packed-reserved-mapping count 1\noutput_chunk packed-reserved-mapping index 0 hex \"b2\" count 1\ncodec.encode_mapping_mismatch\nPackedControlHeader.reserved\nmapped reserved field `control_reserved` must equal declared value 5\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "packed-reserved-mapping"
chunks = ["b2"]
