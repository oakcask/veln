command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_TIME_CANCELLABLE_OUTCOMES = "completed,deadline-expired,cancelled"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "completed score 1302 chunks 1\ndeadline-expired score 2113 chunks 2\ncancelled score 2187 ended true\n"

[[json_assert]]
path = "error"
equals = null
