command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "routed score 1702 chunks 1\ntimed-out score 0 chunks 1\ncancelled score 2017 ended false\n"

[[json_assert]]
path = "error"
equals = null
