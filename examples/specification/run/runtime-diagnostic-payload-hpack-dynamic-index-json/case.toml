command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(hpack.fixture.dynamic_index_out_of_range, HPACK dynamic index out of range at byte offset 27, RuntimeHpackFixtureDynamicIndexDiagnostic(27, 1, 190, 0, 0, fixture dynamic indexed header, hpack_fixture, ByteChunk([Byte(190)])))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "hpack.fixture.dynamic_index_out_of_range"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 27

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_header_block_size"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_first_byte"
equals = 190

[[json_assert]]
path = "error.details.protocol_diagnostic.requested_dynamic_index"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.dynamic_table_entry_count"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "be"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHpackFixtureDynamicIndexDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.requested_dynamic_index"
equals = 0
