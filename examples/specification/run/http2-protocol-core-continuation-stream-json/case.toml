command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.continuation_expected"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 12

[[json_assert]]
path = "error.details.protocol_diagnostic.actual_frame_kind"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.actual_stream_id"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.started_frame_kind"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.started_byte_offset"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.active_continuation"
equals = "headers"

[[json_assert]]
path = "error.details.protocol_diagnostic.accumulated_header_block_bytes"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_continuation_sequence"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "0000000900000000"
