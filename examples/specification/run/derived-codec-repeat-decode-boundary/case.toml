command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n3\n3\n258\n7\nneed_more\nneed_bytes\n1\n0\ninvalid\nnone\n0\n0\nschema.truncated_field\n46\nCountedValues.items.2\n"

[[json_assert]]
path = "error"
equals = null
