command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "7\nready\nratio-high\nscalar\n7\nready\nratio-high\nscalar\n"

[[json_assert]]
path = "error"
equals = null
