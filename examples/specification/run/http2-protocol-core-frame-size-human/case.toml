command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[http2.peer_limit.frame_size_exceeded]: frame payload length exceeds receive maximum at byte offset 0", "note: Frame kind 0 on stream 3 declared 1025 byte(s); active receive maximum is 1024 byte(s).", "note: Nearby bytes: 00 04 01 00 00 00 00 00 (showing 8 of 9 byte(s), truncated).", "note: Receive limit provenance: local_configuration."]
