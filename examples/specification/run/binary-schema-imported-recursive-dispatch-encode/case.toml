command = ["run", "--json", "main", "main.veln", "wire.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "imported-recursive-closed-dispatch"
chunks = ["030101002a"]

[[output_chunk_list]]
name = "imported-recursive-extension-dispatch"
chunks = ["030101002a"]

[[output_chunk_list]]
name = "imported-recursive-extension-unknown"
chunks = ["0207aabb"]
