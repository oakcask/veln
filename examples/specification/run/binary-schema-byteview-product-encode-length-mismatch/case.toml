command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "codec.encode_value_unrepresentable\nPacketWire.payload\nbyte view count 4 does not match length expression `row_count * column_count` value 6\n"

[[json_assert]]
path = "error"
equals = null
