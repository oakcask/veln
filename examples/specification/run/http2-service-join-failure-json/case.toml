# JVM task contract: a callback runtime failure becomes the service join failure;
# JSON output through an inherited `net::IO` provider detects join mapping drift.
command = ["run", "--json", "main", "main.veln", "fixture_effects.veln", "fake_effects.veln", "http2_service_effects.veln"]
exit = 0

[requires]
jdk = true

[env]

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"
