command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "7\nready\n10\n2\nratio-high\nalpha\n11\ncore\nenabled\nweight-high\n9\nready\ninner\n3\nactive\nratio-high\n10\n2\nnested-ratio-high\nnested-alpha\n17\nnested-core\nnested-enabled\nnested-weight-high\n"

[[json_assert]]
path = "error"
equals = null
