command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value_diagnostic.id"
equals = "codec.encode_value_unrepresentable"

[[json_assert]]
path = "error.details.value_diagnostic.field_path"
equals = [{"kind":"schema","name":"SubByteWrite"},{"kind":"field","name":"control"}]

[[json_assert]]
path = "error.details.value_diagnostic.field_path_display"
equals = "SubByteWrite.control"

[[json_assert]]
path = "error.details.value_diagnostic.reason"
equals = "value must be between 0 and 7"
