command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decode 3 2 9\noutput_chunk_list recursive-base count 1\noutput_chunk recursive-base index 0 hex \"010107\" count 3\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "recursive-base"
chunks = ["010107"]
