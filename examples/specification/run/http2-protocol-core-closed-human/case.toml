command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[http2.protocol.closed_with_pending]: input ended with pending bytes at byte offset 0", "note: Input end arrived while 4 byte(s) remained undecoded.", "note: Active continuation state: none."]
