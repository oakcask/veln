command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READS_HEX = "505249,505249202a20485454502f322e300d0a0d0a534d0d0a0d0a0000060400000000000005000080000000080600,505249202a20485454502f322e300d0a0d0a534d0d0a0d0a000006040000000000000500008000000008060000000000010203,505249202a20485454502f322e300d0a0d0a534d0d0a0d0a,505249202a20485454502f322e300d0a0d0a534d0d0a0d0a00000604000000000000050000800000000101000000000182"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[json_assert]]
path = "error"
equals = null
