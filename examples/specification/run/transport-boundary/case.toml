command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_CHUNK_HEX = "0102ff"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "3\n2\ntimeout\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "net-events.log"
equals = "send ByteChunk([Byte(10), Byte(11)])\n"
