command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_ACCEPT_STREAM = "fixture-stream"
VELN_NET_READ_CHUNKS_HEX = "0a0b0c"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "wait cancelled read cancelled actions 2 chunks 1 writes 1 cleanup 1\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "net-events.log"
equals = "listen 127.0.0.1:0\naccept 127.0.0.1:0 fixture-stream\nread fixture-stream 0a0b0c\nread-cancelled fixture-stream\nwrite fixture-stream ByteChunk([Byte(10), Byte(11), Byte(12)])\nclose fixture-stream\nclose-listener 127.0.0.1:0\n"
