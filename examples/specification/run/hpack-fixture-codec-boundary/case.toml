command = ["run", "--json", "main", "main.veln", "hpack_fixture.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "first decoded :fixture single-headers wire_size 8 next_decode_count 1\nsecond decoded :fixture header-list-accepted wire_size 8 next_decode_count 2\nmethod-post decoded :method POST wire_size 9 next_decode_count 3\naccept-charset decoded accept-charset  wire_size 9 next_decode_count 4\naccept-encoding decoded accept-encoding gzip, deflate wire_size 9 next_decode_count 5\naccept-language decoded accept-language  wire_size 9 next_decode_count 6\ncontent-disposition decoded content-disposition  wire_size 9 next_decode_count 7\ncontent-encoding decoded content-encoding  wire_size 9 next_decode_count 8\ncontent-language decoded content-language  wire_size 9 next_decode_count 9\ncontent-length decoded content-length  wire_size 9 next_decode_count 10\ncontent-location decoded content-location  wire_size 9 next_decode_count 11\ncontent-range decoded content-range  wire_size 9 next_decode_count 12\ncontent-type decoded content-type  wire_size 9 next_decode_count 13\ncookie decoded cookie  wire_size 9 next_decode_count 14\ndate decoded date  wire_size 9 next_decode_count 15\netag decoded etag  wire_size 9 next_decode_count 16\nliteral-path decoded :path /target wire_size 9 next_decode_count 17\nmalformed-literal failed offset 49 observed_size 2 observed_first_byte 4 expected fixture header block\nbad failed offset 27 observed_size 1 observed_first_byte 255 expected fixture header block\n"

[[json_assert]]
path = "error"
equals = null
