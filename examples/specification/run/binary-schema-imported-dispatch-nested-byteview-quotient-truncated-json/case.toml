command = ["run", "--json", "main", "main.veln", "wire.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.length_out_of_bounds"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 6

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"ImportedClosedQuotientTruncatedPacket"},{"kind":"field","name":"payload"},{"kind":"schema","name":"ImportedQuotientTruncatedPayload"},{"kind":"field","name":"payload"}]

[[json_assert]]
path = "error.details.byte_diagnostic.expected_count"
equals = 4

[[json_assert]]
path = "error.details.byte_diagnostic.available_count"
equals = 3

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.data"
equals = "0802aabbcc"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.preview_byte_count"
equals = 5

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.total_byte_count"
equals = 5

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.truncated"
equals = false

[[result_value_assert]]
value_path = "error.details.value"
path = "constructor"
equals = "Err"
