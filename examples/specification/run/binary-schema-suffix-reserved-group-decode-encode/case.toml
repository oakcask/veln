command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "171\n5\n46453\ndecoded\n171\n5\n2\nencoded\noutput_chunk_list suffix-reserved-group count 1\noutput_chunk suffix-reserved-group index 0 hex \"b575\" count 2\ninvalid\ncodec.encode_value_unrepresentable\nSuffixReservedGroupHeader.channel\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "suffix-reserved-group"
chunks = ["b575"]
