command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals = "decoded 3 1 42\noutput_chunk_list recursive-dispatch-wrapper count 1\noutput_chunk recursive-dispatch-wrapper index 0 hex \"030101002a\" count 5\n"

[[output_chunk_list]]
name = "recursive-dispatch-wrapper"
chunks = ["030101002a"]
