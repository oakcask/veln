command = ["run", "main", "main.veln", "fixture_effects.veln", "fake_effects.veln"]
exit = 1

[requires]
jdk = true

[env]

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["transport write failed: forced_failure"]

[[file_assert]]
path = "net-events.log"
equals_file = "case-text/file-assert-equals-1.txt"
