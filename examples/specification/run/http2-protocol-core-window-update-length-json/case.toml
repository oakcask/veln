command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.invalid_payload_length, HTTP/2 invalid payload length at byte offset 9, RuntimeHttp2ProtocolInvalidPayloadLengthDiagnostic(9, 8, 0, 3, 4, connection-flow-control, rfc9113_window_update_payload_length, ByteChunk([Byte(1), Byte(2), Byte(3)])))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_payload_length"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "connection"

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_payload_length"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_payload_length"
equals = 4

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "010203"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = false

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "connection-flow-control"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_window_update_payload_length"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHttp2ProtocolInvalidPayloadLengthDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.1"
equals = 8

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.2"
equals = 0

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.3"
equals = 3

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.4"
equals = 4

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.7.constructor"
equals = "ByteChunk"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.8"
missing = true
