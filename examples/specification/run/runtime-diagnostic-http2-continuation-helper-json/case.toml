command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.continuation_expected, HTTP/2 expected CONTINUATION frame at byte offset 9, RuntimeHttp2ProtocolContinuationExpectedDiagnostic(9, 0, 1, 1, 1, 0, headers, ByteChunk([Byte(0), Byte(0), Byte(0), Byte(0), Byte(0), Byte(0), Byte(0), Byte(0), Byte(1)])))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.continuation_expected"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.actual_frame_kind"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.actual_stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.started_frame_kind"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.started_byte_offset"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.active_continuation"
equals = "headers"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "0000000000000000"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = true

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHttp2ProtocolContinuationExpectedDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.1"
equals = 0

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.2"
equals = 1

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.3"
equals = 1

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.6"
equals = "headers"
