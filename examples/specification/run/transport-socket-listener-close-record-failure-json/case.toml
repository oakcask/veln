command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_EVENT_RECORD_FAILED_PREFIX = "close-listener "
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals = ""

[[json_assert]]
path = "stderr"
equals = "transport listener close failed: event_record_failed\n"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.message"
equals = "transport listener close failed: event_record_failed"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[file_assert]]
path = "net-events.log"
equals = "listen 127.0.0.1:0\n"
