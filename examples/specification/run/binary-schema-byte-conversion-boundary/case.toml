command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded-payload view-count 3 owned-count 3\nschema-payload view-count 3 owned-count 3\noutput_chunk_list schema-byte-conversion count 1\noutput_chunk schema-byte-conversion index 0 hex \"03aabbcc\" count 4\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "schema-byte-conversion"
chunks = ["03aabbcc"]
