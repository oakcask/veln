command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "HTTP/2 invalid stream id at byte offset 0"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_stream_id"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.required_stream_id_domain"
equals = "nonzero client-initiated stream id"

[[json_assert]]
path = "error.details.protocol_diagnostic.endpoint_role"
equals = "server"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "stream-id-domain"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "server_receives_client_initiated_streams"
