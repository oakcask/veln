command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "schema_version"
equals = "veln-run-json/v0"

[[json_assert]]
path = "command"
equals = "run"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "exit_code"
equals = 0

[[json_assert]]
path = "stdout"
equals = "3\nctx\n"

[[json_assert]]
path = "stderr"
equals = ""

[[json_assert]]
path = "error"
equals = null
