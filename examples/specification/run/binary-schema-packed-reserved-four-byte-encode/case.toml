command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "packed-four-byte-prefix"
chunks = ["12aaaaaaaa34"]

[[output_chunk_list]]
name = "packed-four-byte-suffix"
chunks = ["12aaaaaaaa34"]
