command = ["run", "--json", "main", "main.veln", "wire.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "encoded\n1\n9\noutput_chunk_list imported-budget-complete count 1\noutput_chunk imported-budget-complete index 0 hex \"000005010400000001\" count 9\npartial\n1\n4\n4\noutput_chunk_list imported-budget-partial count 1\noutput_chunk imported-budget-partial index 0 hex \"00000501\" count 4\nencoded\n1\n5\noutput_chunk_list imported-budget-resume count 1\noutput_chunk imported-budget-resume index 0 hex \"0400000001\" count 5\ninvalid\n0\ncodec.encode_value_unrepresentable\nHeaderWire.stream_id\nvalue must be between 0 and 2147483647\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "imported-budget-complete"
chunks = ["000005010400000001"]

[[output_chunk_list]]
name = "imported-budget-partial"
chunks = ["00000501"]

[[output_chunk_list]]
name = "imported-budget-resume"
chunks = ["0400000001"]
