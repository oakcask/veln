command = ["run", "--json", "main", "main.veln", "wire.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "truncated schema field `value` at byte offset 3"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.truncated_field"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 3

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"ImportedClosedNestedPacket"},{"kind":"field","name":"payload"},{"kind":"schema","name":"SettingsPayload"},{"kind":"field","name":"value"}]

[[json_assert]]
path = "error.details.byte_diagnostic.expected_count"
equals = 2

[[json_assert]]
path = "error.details.byte_diagnostic.available_count"
equals = 1
