command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
contains = "first cleanup"

[[json_assert]]
path = "stdout"
contains = "second cleanup"

[[json_assert]]
path = "stderr"
contains = "child stderr before host failure"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.message"
equals = "java.lang.StackOverflowError"

[[json_assert]]
path = "error.related"
length = 2

[[json_assert]]
path = "error.related.0.kind"
equals = "cleanup_failure"

[[json_assert]]
path = "error.related.0.message"
equals = "invalid shift count 64 for operator `<<`; expected a value between 0 and 63"

[[json_assert]]
path = "error.related.1.kind"
equals = "cleanup_failure"

[[json_assert]]
path = "error.related.1.message"
equals = "invalid shift count 65 for operator `<<`; expected a value between 0 and 63"
