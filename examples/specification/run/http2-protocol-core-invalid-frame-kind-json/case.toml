command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.invalid_frame_kind, HTTP/2 invalid frame kind at byte offset 0, RuntimeHttp2Diagnostic(RuntimeHttp2ProtocolInvalidFrameKindDiagnostic(0, 0, 0, 4, connection-control, connection_frames_require_settings, ByteChunk([Byte(0), Byte(0), Byte(0), Byte(0), Byte(0), Byte(0), Byte(0), Byte(0), Byte(0)]))))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_frame_kind"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.protocol_diagnostic.actual_frame_kind"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "connection"

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_frame_kind"
equals = 4

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "0000000000000000"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = true

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "connection-control"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "connection_frames_require_settings"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.constructor"
equals = "RuntimeHttp2ProtocolInvalidFrameKindDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.actual_frame_kind"
equals = 0

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.expected_frame_kind"
equals = 4

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.preview.constructor"
equals = "ByteChunk"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.fields"
missing = true
