command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.invalid_payload_length, HTTP/2 invalid payload length at byte offset 0, RuntimeHttp2Diagnostic(RuntimeHttp2ProtocolInvalidPayloadLengthDiagnostic(0, 5, 1, 3, 4, stream-control, rfc9113_push_promise_payload_length, ByteChunk([Byte(170), Byte(187), Byte(204)]))))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_payload_length"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 5

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_payload_length"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_payload_length"
equals = 4

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "aabbcc"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = false

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "stream-control"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_push_promise_payload_length"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.constructor"
equals = "RuntimeHttp2ProtocolInvalidPayloadLengthDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.frame_kind"
equals = 5

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.stream_id"
equals = 1

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.observed_payload_length"
equals = 3

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.expected_payload_length"
equals = 4

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.preview.constructor"
equals = "ByteChunk"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.fields"
missing = true
