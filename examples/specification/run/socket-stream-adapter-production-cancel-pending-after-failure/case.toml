command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READS_HEX = "0102,ff,0a0b,1011"
VELN_NET_PRODUCTION_CLIENT_WRITES = "client-writes.hex"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "drained 4 successes 1 failures 1 cancelled 2 reclaimed 2 closed 4\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "net-events.log"
equals = "listen-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream-1\nread-production production-stream-1 0102\naccept-production 127.0.0.1:0 production-stream-2\nread-production production-stream-2 ff\naccept-production 127.0.0.1:0 production-stream-3\nread-production production-stream-3 0a0b\naccept-production 127.0.0.1:0 production-stream-4\nread-production production-stream-4 1011\naccept-end-production 127.0.0.1:0\nclose-listener-production 127.0.0.1:0\nwrite-production production-stream-1 ByteChunk([Byte(1), Byte(2)])\nclose-production production-stream-1\nclose-production production-stream-2\nclose-production production-stream-3\nclose-production production-stream-4\n"

[[file_assert]]
path = "client-writes.hex"
equals = "0102\n\n\n"
