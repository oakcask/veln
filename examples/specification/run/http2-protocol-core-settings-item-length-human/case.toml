command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[http2.protocol.invalid_payload_length]: invalid payload length at byte offset 0", "note: Frame kind 4 on connection 0 declared 5 byte(s); expected 6 byte(s).", "note: Nearby bytes: 00 05 00 00 40 (showing 5 of 5 byte(s), complete).", "note: Active protocol state: connection-control.", "note: Rule provenance: rfc9113_settings_payload_item_length."]
