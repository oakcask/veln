command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.peer_limit.frame_size_exceeded, HTTP/2 frame payload length exceeds receive maximum at byte offset 0, RuntimeHttp2PeerLimitFrameSizeDiagnostic(0, 1025, 1024, 0, 3, local_configuration, ByteChunk([Byte(0), Byte(4), Byte(1), Byte(0), Byte(0), Byte(0), Byte(0), Byte(0), Byte(3)])))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.peer_limit.frame_size_exceeded"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_payload_length"
equals = 1025

[[json_assert]]
path = "error.details.protocol_diagnostic.allowed_max_frame_size"
equals = 1024

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.receive_limit_provenance"
equals = "local_configuration"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "0004010000000000"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = true

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHttp2PeerLimitFrameSizeDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.observed_payload_length"
equals = 1025

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.allowed_max_frame_size"
equals = 1024

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.receive_limit_provenance"
equals = "local_configuration"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.preview.constructor"
equals = "ByteChunk"
