command = ["run", "--json", "main", "main.veln", "wire.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "5\n5\n3\n3\n2\n2\n7\n7\n2\n2\n2\n2\n"

[[json_assert]]
path = "error"
equals = null
