format = "text"
contains = ["error[http2.protocol.invalid_request_header_list]: request header list contains response-only :status at byte offset 12", "note: Frame kind 1 on stream 1 decoded request header names: :status,:method,:scheme,:path.", "note: Nearby bytes: 88 82 86 84 (showing 4 of 4 byte(s), complete).", "note: Active protocol state: request-headers.", "note: Rule provenance: rfc9113_request_pseudo_headers."]
