command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[http2.protocol.invalid_frame_kind]: invalid frame kind at byte offset 0", "note: Frame kind 0 on stream 1 did not match expected frame kind 1.", "note: Active protocol state: idle-stream.", "note: Rule provenance: idle_streams_require_headers."]
