command = ["run", "--json", "main", "main.veln", "wire.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "encoded\noutput_chunk_list derived-imported-closed-nested count 1\noutput_chunk derived-imported-closed-nested index 0 hex \"01071234\" count 4\ninvalid\ncodec.dispatch_unknown_tag\nImportedClosedNestedPacket.payload\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "derived-imported-closed-nested"
chunks = ["01071234"]
