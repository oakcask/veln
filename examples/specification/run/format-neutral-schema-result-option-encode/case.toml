command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "7\nready\nratio-high\nresult-option\nnested-ok\nmissing-code\nmissing-ready\nmissing-ratio\nmissing-label\nmetadata-missing\nbad-code\n503\nratio-flag\nlabel-ratio-high\n404\n"

[[json_assert]]
path = "error"
equals = null
