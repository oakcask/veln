command = ["run", "--json", "main", "main.veln", "wire.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value_diagnostic.id"
equals = "codec.dispatch_length_mismatch"

[[json_assert]]
path = "error.details.value_diagnostic.field_path"
equals = [{"kind":"schema","name":"ImportedRecursiveClosedPacket"},{"kind":"field","name":"payload"}]

[[json_assert]]
path = "error.details.value_diagnostic.field_path_display"
equals = "ImportedRecursiveClosedPacket.payload"

[[json_assert]]
path = "error.details.value_diagnostic.reason"
equals = "length field `length` value 2 does not match encoded payload byte count 3"
