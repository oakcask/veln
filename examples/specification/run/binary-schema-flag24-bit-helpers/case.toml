command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals = "be 8388609\n1\n1\n0\nle 8388609\n1\n1\n0\noutput_chunk_list flag24-packet count 1\noutput_chunk flag24-packet index 0 hex \"800001010080\" count 6\n"

[[output_chunk_list]]
name = "flag24-packet"
chunks = ["800001010080"]
