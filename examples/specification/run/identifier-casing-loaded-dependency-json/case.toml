command = ["run", "--json", "main", "main.veln"]
source_errors = "expected"
exit = 1

[stdout]
format = "json"
equals_file = "case-text/json-assert-equals-1.txt"

[stderr]
format = "empty"

[[file_assert]]
path = ".veln-harness-cache/jvm"
missing = true

[[diagnostics]]
id = "name.invalid_case"
kind = "name"
message = "function name `Bad` must start with an ASCII lowercase letter"

[diagnostics.span]
file = "foo.veln"
line = 1
column = 8
