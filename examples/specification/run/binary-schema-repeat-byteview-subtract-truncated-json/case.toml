command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.truncated_field"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 8

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"CountedViews"},{"kind":"field","name":"items"},{"kind":"index","name":"1"}]

[[json_assert]]
path = "error.details.byte_diagnostic.expected_count"
equals = 3

[[json_assert]]
path = "error.details.byte_diagnostic.available_count"
equals = 2

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.data"
equals = "020502aabbccddee"

[[json_assert]]
path = "stderr"
equals_file = "case-text/json-assert-equals-1.txt"
