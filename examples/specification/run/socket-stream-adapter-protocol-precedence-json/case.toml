command = ["run", "--json", "main", "main.veln", "fixture_effects.veln", "fake_effects.veln"]
exit = 1

[requires]
jdk = true

[env]

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.id"
missing = true

[[json_assert]]
path = "error.details.operation"
missing = true

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_request_header_list"

[[json_assert]]
path = "error.details.protocol_diagnostic.failed_header_fact"
equals = "protocol_value_empty"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "request-headers"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc8441_extended_connect_pseudo_headers"
