command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.peer_stream_id_not_increasing, HTTP/2 outbound local stream id 1 is not greater than previous id 3 at byte offset 0, RuntimeHttp2Diagnostic(RuntimeHttp2ProtocolPeerStreamIdNotIncreasingDiagnostic(0, 1, 3, client, idle-stream, rfc9113_outbound_local_stream_ids_increase, ByteChunk([Byte(0), Byte(0), Byte(1), Byte(1), Byte(4), Byte(0), Byte(0), Byte(0), Byte(1)]))))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.peer_stream_id_not_increasing"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.previous_peer_stream_id"
equals = 3

[[json_assert]]
path = "error.details.protocol_diagnostic.endpoint_role"
equals = "client"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "idle-stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_outbound_local_stream_ids_increase"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "0000010104000000"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = true
