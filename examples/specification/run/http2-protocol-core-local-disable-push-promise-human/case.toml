format = "text"
contains = ["error[http2.protocol.invalid_frame_kind]: invalid frame kind at byte offset 0", "note: Frame kind 5 on stream 1 did not match expected frame kind 1.", "note: Active protocol state: local-settings.", "note: Rule provenance: local_settings_enable_push_disabled."]
