command = ["run", "main", "main.veln", "fixture_effects.veln", "fake_effects.veln"]
exit = 0

[requires]
jdk = true

[env]

[stdout]
format = "text"
contains = ["listener 127.0.0.1:", " stream-local 127.0.0.1:", " stream-peer 127.0.0.1:"]
contains_files = ["case-text/stdout-contains-1.txt"]

[stderr]
format = "empty"

[[file_assert]]
path = "net-events.log"
equals_file = "case-text/file-assert-equals-1.txt"
