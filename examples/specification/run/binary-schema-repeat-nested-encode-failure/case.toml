command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "codec.encode_value_unrepresentable\nCountedItems.items.1.ItemRecord.value\nvalue must be between 0 and 65535\n"

[[json_assert]]
path = "error"
equals = null
