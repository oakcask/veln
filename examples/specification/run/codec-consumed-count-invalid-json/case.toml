command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "schema_version"
equals = "veln-run-json/v0"

[[json_assert]]
path = "command"
equals = "run"

[[json_assert]]
path = "exit_code"
equals = 1

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.message"
equals = "runtime result failure: Err(DecodeErrorWithReason(codec.consumed_count_invalid, ByteOffset(21), ManualPacketWire.count, available_count=3; actual_consumed_count=5; reason=decoded consumed count is outside supplied ByteView))"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "DecodeErrorWithReason(codec.consumed_count_invalid, ByteOffset(21), ManualPacketWire.count, available_count=3; actual_consumed_count=5; reason=decoded consumed count is outside supplied ByteView)"

[[json_assert]]
path = "error.details.byte_diagnostic.kind"
equals = "byte_diagnostic"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "codec.consumed_count_invalid"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 21

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"ManualPacketWire"},{"kind":"field","name":"count"}]

[[json_assert]]
path = "error.details.byte_diagnostic.field_path_display"
equals = "ManualPacketWire.count"

[[json_assert]]
path = "error.details.byte_diagnostic.available_count"
equals = 3

[[json_assert]]
path = "error.details.byte_diagnostic.actual_consumed_count"
equals = 5

[[json_assert]]
path = "error.details.byte_diagnostic.reason"
equals = "decoded consumed count is outside supplied ByteView"

[[json_assert]]
path = "error.details.byte_diagnostic.readiness"
missing = true

[[json_assert]]
path = "stderr"
equals_file = "case-text/json-assert-equals-1.txt"
