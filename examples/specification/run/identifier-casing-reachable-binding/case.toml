command = ["run", "main", "main.veln"]
source_errors = "expected"
exit = 1

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[name.invalid_case]: binding name must start with an ASCII lowercase letter", "main.veln:2:7"]
not_contains = ["name.unresolved", "hole.unfilled", "unresolved call_target `helper`"]
