command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "encoded 241 227 194 229 242 58 107 160 171 144 244 255\ndecoded 0 255\neos HPACK Huffman payload contains EOS symbol\npadding invalid HPACK Huffman padding\ntruncated invalid HPACK Huffman code sequence\n"

[[json_assert]]
path = "error"
equals = null
