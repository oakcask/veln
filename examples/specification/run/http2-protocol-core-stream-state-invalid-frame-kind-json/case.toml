command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.invalid_frame_kind, HTTP/2 invalid frame kind at byte offset 0, RuntimeHttp2ProtocolInvalidFrameKindDiagnostic(0, 0, 1, 1, closed-by-peer-stream, closed_by_peer_rejects_later_frames, ByteChunk([Byte(0), Byte(0), Byte(0), Byte(0), Byte(1), Byte(0), Byte(0), Byte(0), Byte(1)])))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_frame_kind"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.protocol_diagnostic.actual_frame_kind"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_frame_kind"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "0000000001000000"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = true

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "closed-by-peer-stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "closed_by_peer_rejects_later_frames"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHttp2ProtocolInvalidFrameKindDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.1"
equals = 0

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.2"
equals = 1

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.3"
equals = 1

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.4"
equals = "closed-by-peer-stream"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.6.constructor"
equals = "ByteChunk"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.fields.7"
missing = true
