command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n2\n6\n8\nneed_more\nneed_bytes\n2\n0\ninvalid\nnone\n0\n0\nschema.decode_failed\n41\nCountedViews\n"

[[json_assert]]
path = "error"
equals = null
