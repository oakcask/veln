command = ["run", "--json", "main", "main.veln", "hpack_fixture.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.content_length_mismatch, HTTP/2 content-length body length mismatch at byte offset 9, RuntimeHttp2ProtocolContentLengthMismatchDiagnostic(9, 0, 1, 5, 6, open-stream, rfc9113_content_length_body, ByteChunk([Byte(170), Byte(187), Byte(204), Byte(221), Byte(238), Byte(255)])))"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.constructor"
equals = "RuntimeDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.constructor"
equals = "RuntimeHttp2ProtocolContentLengthMismatchDiagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.content_length_mismatch"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.expected_content_length"
equals = 5

[[json_assert]]
path = "error.details.protocol_diagnostic.observed_body_length"
equals = 6

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "open-stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_content_length_body"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "aabbccddeeff"
