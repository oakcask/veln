command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n1\n1\n4\n1\nneed_more\nneed_bytes\n1\n0\ninvalid\n0\nschema.reserved_bits_mismatch\n96\nInterleavedReservedHeader.guard\n"

[[json_assert]]
path = "error"
equals = null

