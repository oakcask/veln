command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_ACCEPT_FAILED = "1"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.details.id"
equals = "runtime.transport_failure"

[[json_assert]]
path = "error.details.operation"
equals = "accept"

[[json_assert]]
path = "error.details.category"
equals = "forced_failure"
