command = ["run", "--json", "main", "main.veln", "fixture_effects.veln", "fake_effects.veln"]
exit = 1

[requires]
jdk = true

[env]

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.details.id"
equals = "runtime.transport_failure"

[[json_assert]]
path = "error.details.operation"
equals = "write"

[[json_assert]]
path = "error.details.category"
equals = "forced_failure"

[[json_assert]]
path = "error.details.lifecycle_phase"
equals = "before_operation"

[[json_assert]]
path = "error.details.output_committed"
equals = false

[[file_assert]]
path = "net-events.log"
equals_file = "case-text/file-assert-equals-1.txt"
