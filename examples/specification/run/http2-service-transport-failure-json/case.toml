command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READS_HEX = "505249202a20485454502f322e300d0a0d0a534d0d0a0d0a000006040000000000000500008000000003010500000001828784"
VELN_NET_WRITE_FAIL_AFTER = "0"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.details.id"
equals = "runtime.transport_failure"

[[json_assert]]
path = "error.details.operation"
equals = "write"

[[json_assert]]
path = "error.details.category"
equals = "forced_failure"

[[json_assert]]
path = "error.details.lifecycle_phase"
equals = "before_operation"

[[json_assert]]
path = "error.details.output_committed"
equals = false

[[file_assert]]
path = "net-events.log"
equals_file = "case-text/file-assert-equals-1.txt"
