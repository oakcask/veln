# JVM integration contract: the scoped host-network fake around net::system()
# must reach serve_tcp's spawned connection task. The exact event trace detects
# handler inheritance, and the stdout failure id detects the injected task write
# failure without turning the successful CLI run envelope into a runtime error.
command = ["run", "--json", "main", "main.veln", "fixture_effects.veln", "fake_effects.veln"]
exit = 0

[requires]
jdk = true

[env]

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = """
http2.connection.transport_failure
"""

[[file_assert]]
path = "net-events.log"
equals_file = "case-text/file-assert-equals-1.txt"
