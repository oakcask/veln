command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "schema_version"
equals = "veln-run-json/v0"

[[json_assert]]
path = "command"
equals = "run"

[[json_assert]]
path = "exit_code"
equals = 1

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.message"
equals = "runtime result failure: Err(DecodeErrorWithReason(codec.packet_kind_invalid, ByteOffset(62), ManualPacketWire.kind, packet kind 7 is not accepted))"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "DecodeErrorWithReason(codec.packet_kind_invalid, ByteOffset(62), ManualPacketWire.kind, packet kind 7 is not accepted)"

[[json_assert]]
path = "error.details.byte_diagnostic.kind"
equals = "byte_diagnostic"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "codec.packet_kind_invalid"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 62

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"ManualPacketWire"},{"kind":"field","name":"kind"}]

[[json_assert]]
path = "error.details.byte_diagnostic.field_path_display"
equals = "ManualPacketWire.kind"

[[json_assert]]
path = "error.details.byte_diagnostic.reason"
equals = "packet kind 7 is not accepted"

[[json_assert]]
path = "error.details.byte_diagnostic.local_byte_offset"
missing = true

[[json_assert]]
path = "error.details.byte_diagnostic.expected_count"
missing = true

[[json_assert]]
path = "error.details.byte_diagnostic.available_count"
missing = true

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview"
missing = true

[[json_assert]]
path = "stderr"
equals = "Err(DecodeErrorWithReason(codec.packet_kind_invalid, ByteOffset(62), ManualPacketWire.kind, packet kind 7 is not accepted))\n"
