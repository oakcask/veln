command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.invalid_response_header_list, HTTP/2 response header list contains duplicate :status at byte offset 12, RuntimeHttp2ProtocolInvalidResponseHeaderListDiagnostic(12, 1, 1, duplicate_pseudo_header, :status, :status,:status, response-headers, rfc9113_response_pseudo_headers))"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_response_header_list"

[[json_assert]]
path = "error.details.protocol_diagnostic.failed_header_fact"
equals = "duplicate_pseudo_header"

[[json_assert]]
path = "error.details.protocol_diagnostic.header_name"
equals = ":status"

[[json_assert]]
path = "error.details.protocol_diagnostic.decoded_header_names"
equals = ":status,:status"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "response-headers"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_response_pseudo_headers"
