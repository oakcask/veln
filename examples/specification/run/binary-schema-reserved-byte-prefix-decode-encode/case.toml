command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "171\n42\n192\ndecoded\n171\n2\nencoded\noutput_chunk_list reserved-byte-prefix count 1\noutput_chunk reserved-byte-prefix index 0 hex \"2ac0\" count 2\ninvalid\ncodec.encode_value_unrepresentable\nReservedBytePrefixHeader.payload\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "reserved-byte-prefix"
chunks = ["2ac0"]
