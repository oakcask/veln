command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_WRITE_FAILED = "1"

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["transport write failed: forced_failure", "note: Local endpoint: 127.0.0.1:0.", "note: Peer endpoint: stream-1.", "note: Stream identity: stream-1.", "note: Lifecycle phase: before_operation.", "note: Commit state: input=false, output=false, ownership=false.", "note: Platform cause: VELN_NET_WRITE_FAILED."]
