command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_ACCEPT_STREAM = "fixture-stream"
VELN_NET_READ_CHUNK_HEX = "0d0e0f"
VELN_NET_EVENTS = "net-events.log"
VELN_TIME_CANCELLABLE_OUTCOMES = "cancelled,deadline-expired"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decisions cancelled,deadline-expired actions 3 chunks 1 ended false writes 1 retries 1 cleanup 1\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "net-events.log"
equals = "listen 127.0.0.1:0\naccept 127.0.0.1:0 fixture-stream\nread fixture-stream 0d0e0f\nwrite fixture-stream ByteChunk([Byte(13), Byte(14), Byte(15)])\nclose fixture-stream\nclose-listener 127.0.0.1:0\n"
