command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[output_chunk_list]]
name = "u48-widths"
chunks = ["010203040506060504030201"]
