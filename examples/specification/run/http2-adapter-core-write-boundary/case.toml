command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_ACCEPT_STREAM = "fixture-stream"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "adapter accepted 2 rejected 1 final closed\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "net-events.log"
equals = "listen 127.0.0.1:0\naccept 127.0.0.1:0 fixture-stream\nwrite fixture-stream ByteChunk([Byte(0), Byte(0), Byte(2), Byte(1), Byte(0), Byte(0), Byte(0), Byte(0), Byte(1), Byte(130), Byte(132), Byte(0), Byte(0), Byte(1), Byte(9), Byte(4), Byte(0), Byte(0), Byte(0), Byte(1), Byte(134)])\nwrite fixture-stream ByteChunk([Byte(0), Byte(0), Byte(2), Byte(0), Byte(0), Byte(0), Byte(0), Byte(0), Byte(1), Byte(170), Byte(187), Byte(0), Byte(0), Byte(2), Byte(0), Byte(1), Byte(0), Byte(0), Byte(0), Byte(1), Byte(204), Byte(221)])\n"
