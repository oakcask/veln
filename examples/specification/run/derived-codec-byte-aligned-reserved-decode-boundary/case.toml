command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n18\n52\n4\ninvalid\nnone\n0\n0\ninvalid\n0\nschema.reserved_bits_mismatch\n81\nByteAlignedReservedHeader.padding\n"

[[json_assert]]
path = "error"
equals = null
