command = ["run", "--json", "main", "main.veln", "--", "sample", "2", "1.75", "true"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "sample\n3\nenabled\nlarge\n"

[[json_assert]]
path = "error"
equals = null
