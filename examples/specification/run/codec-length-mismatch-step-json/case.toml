command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "schema_version"
equals = "veln-run-json/v0"

[[json_assert]]
path = "command"
equals = "run"

[[json_assert]]
path = "exit_code"
equals = 1

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.message"
equals = "runtime result failure: Err(DecodeErrorWithReason(codec.length_mismatch, ByteOffset(9), ManualPacketWire.payload, expected_length=4; actual_length=3; reason=payload length did not match header length))"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "DecodeErrorWithReason(codec.length_mismatch, ByteOffset(9), ManualPacketWire.payload, expected_length=4; actual_length=3; reason=payload length did not match header length)"

[[json_assert]]
path = "error.details.byte_diagnostic.kind"
equals = "byte_diagnostic"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "codec.length_mismatch"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 9

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"ManualPacketWire"},{"kind":"field","name":"payload"}]

[[json_assert]]
path = "error.details.byte_diagnostic.field_path_display"
equals = "ManualPacketWire.payload"

[[json_assert]]
path = "error.details.byte_diagnostic.expected_length"
equals = 4

[[json_assert]]
path = "error.details.byte_diagnostic.actual_length"
equals = 3

[[json_assert]]
path = "error.details.byte_diagnostic.reason"
equals = "payload length did not match header length"

[[json_assert]]
path = "stderr"
equals_file = "case-text/json-assert-equals-1.txt"
