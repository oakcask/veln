command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals = "32769\n1\n1\n0\noutput_chunk_list flag16le-packet count 1\noutput_chunk flag16le-packet index 0 hex \"0180\" count 2\n"

[[output_chunk_list]]
name = "flag16le-packet"
chunks = ["0180"]
