command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "schema_version"
equals = "veln-run-json/v0"

[[json_assert]]
path = "command"
equals = "run"

[[json_assert]]
path = "exit_code"
equals = 1

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.message"
equals = "runtime result failure: Err(DecodeErrorWithReason(codec.integer_out_of_range, ByteOffset(17), ManualPacketWire.stream_id, byte_width=4; min_value=0; max_value=2147483647; actual_value=2147483648; reason=decoded value exceeds signed integer range))"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "DecodeErrorWithReason(codec.integer_out_of_range, ByteOffset(17), ManualPacketWire.stream_id, byte_width=4; min_value=0; max_value=2147483647; actual_value=2147483648; reason=decoded value exceeds signed integer range)"

[[json_assert]]
path = "error.details.byte_diagnostic.kind"
equals = "byte_diagnostic"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "codec.integer_out_of_range"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 17

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"ManualPacketWire"},{"kind":"field","name":"stream_id"}]

[[json_assert]]
path = "error.details.byte_diagnostic.field_path_display"
equals = "ManualPacketWire.stream_id"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_width"
equals = 4

[[json_assert]]
path = "error.details.byte_diagnostic.min_value"
equals = 0

[[json_assert]]
path = "error.details.byte_diagnostic.max_value"
equals = 2147483647

[[json_assert]]
path = "error.details.byte_diagnostic.actual_value"
equals = 2147483648

[[json_assert]]
path = "error.details.byte_diagnostic.reason"
equals = "decoded value exceeds signed integer range"

[[json_assert]]
path = "stderr"
equals = "Err(DecodeErrorWithReason(codec.integer_out_of_range, ByteOffset(17), ManualPacketWire.stream_id, byte_width=4; min_value=0; max_value=2147483647; actual_value=2147483648; reason=decoded value exceeds signed integer range))\n"
