command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "bytes 8 130,190\ndecoded 3 0,255\ntable 1\ninvalid_name\nactive_capacity\n"

[[json_assert]]
path = "error"
equals = null
