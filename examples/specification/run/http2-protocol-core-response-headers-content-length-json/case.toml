command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "HTTP/2 response header list contains invalid content-length at byte offset 12"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_response_header_list"

[[json_assert]]
path = "error.details.protocol_diagnostic.failed_header_fact"
equals = "content_length_invalid"

[[json_assert]]
path = "error.details.protocol_diagnostic.header_name"
equals = "content-length"

[[json_assert]]
path = "error.details.protocol_diagnostic.decoded_header_names"
equals = ":status,content-length"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_content_length"
