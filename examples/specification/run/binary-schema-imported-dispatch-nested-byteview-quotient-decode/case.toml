command = ["run", "--json", "main", "main.veln", "wire.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "imported-closed 8 2 4 43707\nimported-extension 8 2 4 43707\ncodec-imported-closed decoded 7\ncodec-imported-extension decoded 8\n"

[[json_assert]]
path = "error"
equals = null
