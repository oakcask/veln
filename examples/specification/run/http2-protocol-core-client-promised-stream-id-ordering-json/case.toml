command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.peer_stream_id_not_increasing, HTTP/2 peer-created stream id 2 is not greater than previous id 4 at byte offset 16, RuntimeHttp2ProtocolPeerStreamIdNotIncreasingDiagnostic(16, 2, 4, client, idle-stream, rfc9113_peer_stream_ids_increase, ByteChunk([Byte(0), Byte(0), Byte(7), Byte(5), Byte(4), Byte(0), Byte(0), Byte(0), Byte(1)])))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.peer_stream_id_not_increasing"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 16

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 2

[[json_assert]]
path = "error.details.protocol_diagnostic.previous_peer_stream_id"
equals = 4

[[json_assert]]
path = "error.details.protocol_diagnostic.endpoint_role"
equals = "client"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "idle-stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_peer_stream_ids_increase"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "0000070504000000"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 8

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 9

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = true
