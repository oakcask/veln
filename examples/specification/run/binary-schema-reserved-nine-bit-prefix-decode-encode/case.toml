command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "42\n0\n85\n128\ndecoded\n42\n3\ninvalid\nnone\n0\n0\ninvalid\n0\nschema.reserved_bits_mismatch\n40\nReservedNineBitPrefixHeader.control_reserved\nencoded\noutput_chunk_list reserved-nine-bit-prefix count 1\noutput_chunk reserved-nine-bit-prefix index 0 hex \"005580\" count 3\ninvalid\nschema.encode_value_unrepresentable\nReservedNineBitPrefixHeader.control\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "reserved-nine-bit-prefix"
chunks = ["005580"]
