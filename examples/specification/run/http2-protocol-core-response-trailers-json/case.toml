command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.invalid_response_header_list, HTTP/2 response trailer list contains pseudo-header :status at byte offset 12, RuntimeHttp2Diagnostic(RuntimeHttp2ProtocolInvalidResponseHeaderListDiagnostic(12, 1, 1, trailer_pseudo_header, :status, :status, response-trailers, rfc9113_trailer_pseudo_headers, ByteChunk([Byte(136)]))))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_response_header_list"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 12

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_ref"
equals = "stream"

[[json_assert]]
path = "error.details.protocol_diagnostic.failed_header_fact"
equals = "trailer_pseudo_header"

[[json_assert]]
path = "error.details.protocol_diagnostic.header_name"
equals = ":status"

[[json_assert]]
path = "error.details.protocol_diagnostic.decoded_header_names"
equals = ":status"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "88"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = false

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "response-trailers"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_trailer_pseudo_headers"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.constructor"
equals = "RuntimeHttp2ProtocolInvalidResponseHeaderListDiagnostic"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.failed_header_fact"
equals = "trailer_pseudo_header"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.header_name"
equals = ":status"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.decoded_header_names"
equals = ":status"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.preview.constructor"
equals = "ByteChunk"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.preview.bytes.0.value"
equals = 136

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.active_state"
equals = "response-trailers"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.rule_provenance"
equals = "rfc9113_trailer_pseudo_headers"

[[result_value_assert]]
value_path = "error.details.value"
path = "value.detail.detail.unexpected"
missing = true
