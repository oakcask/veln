command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "8\n7\n24\n2\ncore\n2\n10\n-1\n1\n42\n"

[[json_assert]]
path = "error"
equals = null
