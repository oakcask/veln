command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "byte_write_u48_le value must be between 0 and 281474976710655"

[[json_assert]]
path = "error.details.value_diagnostic.kind"
equals = "value_diagnostic"

[[json_assert]]
path = "error.details.value_diagnostic.id"
equals = "codec.byte_write_value_unrepresentable"

[[json_assert]]
path = "error.details.value_diagnostic.field_path"
equals = []

[[json_assert]]
path = "error.details.value_diagnostic.helper_name"
equals = "byte_write_u48_le"

[[json_assert]]
path = "error.details.value_diagnostic.supplied_value"
equals = 281474976710656

[[json_assert]]
path = "error.details.value_diagnostic.min_value"
equals = 0

[[json_assert]]
path = "error.details.value_diagnostic.max_value"
equals = 281474976710655

[[json_assert]]
path = "error.details.value_diagnostic.width"
equals = 6

[[json_assert]]
path = "error.details.value_diagnostic.byte_order"
equals = "little_endian"

[[json_assert]]
path = "stderr"
equals = "Err(byte_write_u48_le value must be between 0 and 281474976710655)\n"
