command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "decoded\n18655\n4660\n3\nneed_more\nneed_bytes\n3\n0\ninvalid\n0\nschema.validation_failed\n43\nHeaderWire.wire_kind\n"

[[json_assert]]
path = "error"
equals = null
