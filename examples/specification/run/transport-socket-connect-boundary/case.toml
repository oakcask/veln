command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_CONNECT_STREAM = "client-fixture"
VELN_NET_READ_CHUNK_HEX = "010203"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "local client-fixture peer 127.0.0.1:443 read-bytes 3 write-bytes 2\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "net-events.log"
equals = "connect 127.0.0.1:443 client-fixture\nwrite client-fixture ByteChunk([Byte(10), Byte(11)])\nread client-fixture 010203\nshutdown-write client-fixture\nclose client-fixture\n"
