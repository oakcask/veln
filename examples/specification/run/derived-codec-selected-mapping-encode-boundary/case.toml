command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "output_chunk_list selected-control count 1\noutput_chunk selected-control index 0 hex \"0107\" count 2\noutput_chunk_list selected-data count 1\noutput_chunk selected-data index 0 hex \"0209\" count 2\ninvalid\ncodec.encode_value_unrepresentable\nPacketWire.value\nvalue must be between 0 and 255\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "selected-control"
chunks = ["0107"]

[[output_chunk_list]]
name = "selected-data"
chunks = ["0209"]
