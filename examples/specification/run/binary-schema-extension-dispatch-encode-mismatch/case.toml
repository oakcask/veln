command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "schema.dispatch_mismatch\nExtensionDispatchWritePacket.payload\ntag field `kind` value 1 selects a known payload case\n"

[[json_assert]]
path = "error"
equals = null
