command = ["run", "--json", "main", "app.veln", "math.veln"]
source_errors = "expected"
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "8\n1\n"

[[json_assert]]
path = "error"
equals = null
