command = ["run", "--json", "main", "main.veln", "unused.veln", "http.veln"]
source_errors = "expected"
exit = 0

[stdout]
format = "json"
not_contains = ["name.invalid_case", "HTTP", "dead"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = ""

[[json_assert]]
path = "stderr"
equals = ""

[[json_assert]]
path = "error"
equals = null
