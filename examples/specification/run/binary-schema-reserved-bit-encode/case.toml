command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "reserved-stream-id"
chunks = ["000005010400000001"]

[[output_chunk_list]]
name = "reserved-stream-id-max"
chunks = ["00000501047fffffff"]
