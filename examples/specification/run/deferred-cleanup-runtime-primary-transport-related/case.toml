command = ["run", "--json", "main", "main.veln", "fixture_effects.veln", "fake_effects.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.details.id"
equals = "runtime.invalid_shift_count"

[[json_assert]]
path = "error.related"
length = 1

[[json_assert]]
path = "error.related.0.kind"
equals = "cleanup_failure"

[[json_assert]]
path = "error.related.0.message"
equals = "network system cleanup could not confirm closure of 1 resource(s) with 0 producer(s) still active"
