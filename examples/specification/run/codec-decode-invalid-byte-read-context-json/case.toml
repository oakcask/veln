command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "schema_version"
equals = "veln-run-json/v0"

[[json_assert]]
path = "command"
equals = "run"

[[json_assert]]
path = "exit_code"
equals = 1

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.message"
equals = "runtime result failure: Err(DecodeErrorWithReason(codec.invalid_input, ByteOffset(42), ManualPacketWire.checksum, byte read requires 4 bytes but view has 3))"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "DecodeErrorWithReason(codec.invalid_input, ByteOffset(42), ManualPacketWire.checksum, byte read requires 4 bytes but view has 3)"

[[json_assert]]
path = "error.details.byte_diagnostic.kind"
equals = "byte_diagnostic"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "codec.invalid_input"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.kind"
equals = "ByteOffset"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 42

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"ManualPacketWire"},{"kind":"field","name":"checksum"}]

[[json_assert]]
path = "error.details.byte_diagnostic.field_path_display"
equals = "ManualPacketWire.checksum"

[[json_assert]]
path = "error.details.byte_diagnostic.reason"
equals = "byte read requires 4 bytes but view has 3"

[[json_assert]]
path = "error.details.byte_diagnostic.local_byte_offset"
equals = 5

[[json_assert]]
path = "error.details.byte_diagnostic.expected_count"
equals = 4

[[json_assert]]
path = "error.details.byte_diagnostic.available_count"
equals = 3

[[json_assert]]
path = "stderr"
equals_file = "case-text/json-assert-equals-1.txt"
