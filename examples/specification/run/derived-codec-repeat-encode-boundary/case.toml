command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "encoded\noutput_chunk_list derived-counted-values count 1\noutput_chunk derived-counted-values index 0 hex \"030001000200ff\" count 7\ninvalid\nschema.encode_value_unrepresentable\nCountedValues.items\nvalue must be between 0 and 65535\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "derived-counted-values"
chunks = ["030001000200ff"]
