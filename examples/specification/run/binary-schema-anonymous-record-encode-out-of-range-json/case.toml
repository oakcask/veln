command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value_diagnostic.id"
equals = "schema.encode_value_unrepresentable"

[[json_assert]]
path = "error.details.value_diagnostic.field_path"
equals = [{"kind":"schema","name":"AnonymousRecordWritePacket"},{"kind":"field","name":"header"},{"kind":"field","name":"right"},{"kind":"field","name":"value"}]

[[json_assert]]
path = "error.details.value_diagnostic.field_path_display"
equals = "AnonymousRecordWritePacket.header.right.value"

[[json_assert]]
path = "error.details.value_diagnostic.reason"
equals = "value must be between 0 and 16777215"

[[json_assert]]
path = "error.details.value"
equals = "EncodeError(schema.encode_value_unrepresentable, AnonymousRecordWritePacket.header.right.value, value must be between 0 and 16777215)"
