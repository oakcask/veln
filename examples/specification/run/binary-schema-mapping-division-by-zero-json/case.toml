command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "schema mapping division by zero at byte offset 2"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.mapping_division_by_zero"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 2

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"PacketWire"},{"kind":"field","name":"quotient"}]

[[json_assert]]
path = "error.details.byte_diagnostic.target_field"
equals = "quotient"

[[json_assert]]
path = "error.details.byte_diagnostic.operator"
equals = "/"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.data"
equals = "0c00"
