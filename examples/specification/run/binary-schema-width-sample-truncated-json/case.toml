command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "truncated schema field `wide_value` at byte offset 5"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.truncated_field"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 5

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"SchemaWidthSample"},{"kind":"field","name":"wide_value"}]

[[json_assert]]
path = "error.details.byte_diagnostic.expected_count"
equals = 4

[[json_assert]]
path = "error.details.byte_diagnostic.available_count"
equals = 3

[[json_assert]]
path = "error.details.byte_diagnostic.readiness"
equals = "need_bytes"

[[json_assert]]
path = "error.details.byte_diagnostic.nearby_context"
equals = "1234deadbe"
