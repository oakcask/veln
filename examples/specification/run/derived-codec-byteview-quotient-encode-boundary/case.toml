command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "encoded\noutput_chunk_list byteview-quotient-derived count 1\noutput_chunk byteview-quotient-derived index 0 hex \"0802aabbccdd\" count 6\ninvalid\nschema.encode_value_unrepresentable\nPacketWire.payload\nbyte view count 3 does not match length expression `total_length / chunk_count` value 4\ninvalid\nschema.encode_value_unrepresentable\nPacketWire.payload\nschema length division by zero\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "byteview-quotient-derived"
chunks = ["0802aabbccdd"]
