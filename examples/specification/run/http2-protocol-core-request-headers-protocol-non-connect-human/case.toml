command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[http2.protocol.invalid_request_header_list]: request header list contains :protocol on a non-CONNECT request at byte offset 12", "note: Rule provenance: rfc8441_protocol_requires_connect."]
