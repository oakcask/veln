command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"
contains = ["\"divisor_span\"", "\"operation_span\""]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.details.id"
equals = "runtime.remainder_by_zero"

[[json_assert]]
path = "error.message"
equals = "remainder divisor is zero"

[[json_assert]]
path = "error.details.operator"
equals = "%"

[[json_assert]]
path = "error.details.divisor_span.start.line"
equals = 2

[[json_assert]]
path = "error.details.divisor_span.start.column"
equals = 17

[[json_assert]]
path = "error.details.divisor_span.end.column"
equals = 25

[[json_assert]]
path = "error.related.0.kind"
equals = "operation"

[[json_assert]]
path = "error.related.0.span.start.column"
equals = 9

[[json_assert]]
path = "error.related.0.span.end.column"
equals = 25
