command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "schema validation failed at byte offset 2"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.validation_failed"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 2

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"ArithmeticPacket"},{"kind":"field","name":"payload_length"}]

[[json_assert]]
path = "error.details.byte_diagnostic.predicate"
equals = "not(payload_length != width * item_count) and payload_length >= 1 and true"

[[json_assert]]
path = "error.details.byte_diagnostic.field_value"
equals = 16

[[json_assert]]
path = "error.details.byte_diagnostic.decoded_values"
equals = "width=3, item_count=5, payload_length=16"

[[json_assert]]
path = "error.details.byte_diagnostic.width"
equals = 3

[[json_assert]]
path = "error.details.byte_diagnostic.item_count"
equals = 5

[[json_assert]]
path = "error.details.byte_diagnostic.payload_length"
equals = 16

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.encoding"
equals = "hex"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.data"
equals = "03050010"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.preview_byte_count"
equals = 4

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.total_byte_count"
equals = 4

[[json_assert]]
path = "error.details.byte_diagnostic.byte_preview.truncated"
equals = false
