command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "ordered count 3\noutput_chunk ordered index 0 hex \"0000080600000000000102030405060708\" count 17\noutput_chunk ordered index 1 hex \"000002000000000001aabb\" count 11\noutput_chunk ordered index 2 hex \"00000408000000000000000003\" count 13\nordered combined \"0000080600000000000102030405060708000002000000000001aabb00000408000000000000000003\"\nafter-failures count 3\n"

[[json_assert]]
path = "error"
equals = null
