command = ["run", "--json", "main", "main.veln", "fixture_effects.veln", "fake_effects.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals = ""

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.message"
equals = "wall-clock seconds exceed Int range"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"
