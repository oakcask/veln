# At `veln run` entry-argument precedence, stdio::println is only an execution sentinel.
# Absence of `forbidden` proves invalid conversion wins before execution; absence of
# `type.variant_mismatch` proves it wins before semantic lowering.
command = ["run", "--json", "main", "main.veln", "--", "not-int"]
source_errors = "expected"
exit = 1

[tools]
java = "fake-success"

[env]
JAVA_MARKER = "java-started"

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["veln: invalid Int argument for parameter `value`: `not-int`"]
not_contains = ["type.variant_mismatch", "forbidden"]

[[file_assert]]
path = ".veln-harness-cache/jvm"
missing = true

[[file_assert]]
path = "java-started"
missing = true
