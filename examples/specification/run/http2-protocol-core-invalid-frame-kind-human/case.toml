command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[http2.protocol.invalid_frame_kind]: invalid frame kind at byte offset 0", "note: Frame kind 0 on connection 0 did not match expected frame kind 4.", "note: Active protocol state: connection-control.", "note: Rule provenance: connection_frames_require_settings."]
