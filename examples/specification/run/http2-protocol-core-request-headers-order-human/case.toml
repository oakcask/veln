command = ["run", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[http2.protocol.invalid_request_header_list]: request header list places :method after a regular header at byte offset 12", "note: Frame kind 1 on stream 1 decoded request header names: host,:method,:scheme,:path.", "note: Active protocol state: request-headers.", "note: Rule provenance: rfc9113_request_pseudo_headers."]
