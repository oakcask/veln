command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "fixture.hex.odd_length: dangling hex nibble at byte offset 1 high nibble\n"

[[json_assert]]
path = "error"
equals = null
