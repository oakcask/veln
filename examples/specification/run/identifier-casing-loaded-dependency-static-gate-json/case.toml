command = ["run", "--json", "main", "main.veln"]
source_errors = "expected"
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics.0.id"
equals = "name.invalid_case"

[[json_assert]]
path = "diagnostics.0.message"
equals = "function name `Bad` must start with an ASCII lowercase letter"

[[json_assert]]
path = "diagnostics.0.span.file"
equals = "math.veln"

[[json_assert]]
path = "summary.diagnostic_count"
equals = 1

[[diagnostics]]
id = "name.invalid_case"
severity = "error"
kind = "name"
message = "function name `Bad` must start with an ASCII lowercase letter"

[diagnostics.span]
file = "math.veln"
line = 5
column = 8
