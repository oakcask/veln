# Integration contract: `run --json` projects a computed-zero division that
# remains executable after its closed divisor is folded.
command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"
contains = ["\"id\":\"runtime.division_by_zero\"", "\"operator\":\"/\"", "\"divisor\":0", "\"divisor_span\"", "\"operation_span\""]

[stderr]
format = "empty"

[[json_assert]]
path = "error.message"
equals = "division divisor is zero"

[[json_assert]]
path = "error.related.0.kind"
equals = "operation"

[[json_assert]]
path = "stdout"
equals_file = "case-text/stdout.txt"
