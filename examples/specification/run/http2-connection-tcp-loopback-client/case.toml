command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READS_HEX = "000006040000000000000500008000,0102"
VELN_NET_PRODUCTION_CLIENT_WRITES = "client-writes.hex"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "open client open 15\nclosed client closed 0\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "client-writes.hex"
equals = "505249202a20485454502f322e300d0a0d0a534d0d0a0d0a000000040000000000000000040100000000\n"

[[file_assert]]
path = "net-events.log"
equals = "listen-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream-1\nwrite-production production-stream-1 ByteChunk([Byte(80), Byte(82), Byte(73), Byte(32), Byte(42), Byte(32), Byte(72), Byte(84), Byte(84), Byte(80), Byte(47), Byte(50), Byte(46), Byte(48), Byte(13), Byte(10), Byte(13), Byte(10), Byte(83), Byte(77), Byte(13), Byte(10), Byte(13), Byte(10)])\nwrite-production production-stream-1 ByteChunk([Byte(0), Byte(0), Byte(0), Byte(4), Byte(0), Byte(0), Byte(0), Byte(0), Byte(0)])\nread-production production-stream-1 000006040000000000000500008000\nwrite-production production-stream-1 ByteChunk([Byte(0), Byte(0), Byte(0), Byte(4), Byte(1), Byte(0), Byte(0), Byte(0), Byte(0)])\nread-end-production production-stream-1\nclose-production production-stream-1\naccept-production 127.0.0.1:0 production-stream-2\nclose-production production-stream-2\n"
