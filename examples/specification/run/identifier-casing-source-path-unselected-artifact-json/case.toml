command = ["run", "--json", "main", "main.veln"]
source_errors = "expected"
exit = 0

[requires]
jdk = true

[stdout]
format = "json"
not_contains = ["name.invalid_case", "module name `App`", "forbidden"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[json_assert]]
path = "stderr"
equals = ""

[[json_assert]]
path = "error"
equals = null
