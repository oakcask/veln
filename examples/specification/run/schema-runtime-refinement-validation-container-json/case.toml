command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.variant_refinement_mismatch"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 41

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"ContainerPacket"},{"kind":"field","name":"mixed"},{"kind":"field","name":"0"},{"kind":"field","name":"a/b~c"}]

[[json_assert]]
path = "error.details.byte_diagnostic.field_path_display"
equals = "/ContainerPacket/mixed/0/a~1b~0c"

[[json_assert]]
path = "error.details.byte_diagnostic.reason"
equals = "actual variant `Closed`; expected one of `Connected`"
