command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.invalid_request_header_list, HTTP/2 request header list contains empty CONNECT :authority at byte offset 12, RuntimeHttp2Diagnostic(RuntimeHttp2ProtocolInvalidRequestHeaderListDiagnostic(12, 1, 1, connect_authority_empty, :authority, :method,:authority, request-headers, rfc9113_connect_request_pseudo_headers, ByteChunk([]))))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_request_header_list"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 12

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.failed_header_fact"
equals = "connect_authority_empty"

[[json_assert]]
path = "error.details.protocol_diagnostic.header_name"
equals = ":authority"

[[json_assert]]
path = "error.details.protocol_diagnostic.decoded_header_names"
equals = ":method,:authority"

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "request-headers"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_connect_request_pseudo_headers"
