command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.validation_failed"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 43

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"HeaderWire"},{"kind":"field","name":"wire_kind"}]

[[json_assert]]
path = "error.details.byte_diagnostic.field_path_display"
equals = "HeaderWire.wire_kind"

[[json_assert]]
path = "stderr"
equals = "Err(DecodeError(schema.validation_failed, ByteOffset(43), HeaderWire.wire_kind))\n"
