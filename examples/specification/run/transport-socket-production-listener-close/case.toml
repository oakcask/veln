command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READ_HEX = "010203"
VELN_NET_PRODUCTION_CLIENT_WRITES = "client-writes.hex"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals = "3\n"

[[json_assert]]
path = "stderr"
equals = "transport accept failed: listener closed\n"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.message"
equals = "transport accept failed: listener closed"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[file_assert]]
path = "net-events.log"
equals = "listen-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream\nclose-listener-production 127.0.0.1:0\nread-production production-stream 010203\nwrite-production production-stream ByteChunk([Byte(1), Byte(2), Byte(3)])\nclose-production production-stream\n"

[[file_assert]]
path = "client-writes.hex"
equals = "010203"
