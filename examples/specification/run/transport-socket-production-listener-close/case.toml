command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READ_HEX = "010203"
VELN_NET_PRODUCTION_CLIENT_WRITES = "client-writes.hex"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[json_assert]]
path = "stderr"
equals_file = "case-text/json-assert-equals-2.txt"

[[json_assert]]
path = "error.kind"
equals = "runtime"

[[json_assert]]
path = "error.message"
equals = "transport accept failed: closed"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[file_assert]]
path = "net-events.log"
equals_file = "case-text/file-assert-equals-1.txt"

[[file_assert]]
path = "client-writes.hex"
equals = "010203"
