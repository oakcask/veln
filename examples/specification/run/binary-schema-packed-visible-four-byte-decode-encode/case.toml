command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "21\n60\n55\n23\n8\n18\ndecoded\n21\n60\n55\n23\n8\n18\n4\ndecoded\n21\n60\n55\n23\n8\n18\n4\noutput_chunk_list packed-visible-four-byte-direct count 1\noutput_chunk packed-visible-four-byte-direct index 0 hex \"abcdef12\" count 4\nencoded\noutput_chunk_list packed-visible-four-byte-derived count 1\noutput_chunk packed-visible-four-byte-derived index 0 hex \"abcdef12\" count 4\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "packed-visible-four-byte-direct"
chunks = ["abcdef12"]

[[output_chunk_list]]
name = "packed-visible-four-byte-derived"
chunks = ["abcdef12"]
