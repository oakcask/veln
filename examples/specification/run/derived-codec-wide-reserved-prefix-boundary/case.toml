command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "seven\ndecoded\n5\n10\n7\ninvalid\n0\nschema.reserved_bits_mismatch\n20\nSevenBytePrefixReservedGroupHeader.prefix\neight\ndecoded\n5\n10\n8\nencoded\noutput_chunk_list wide-prefix count 1\noutput_chunk wide-prefix index 0 hex \"aaaaaaaaaaaaaada\" count 8\n"

[[json_assert]]
path = "error"
equals = null
