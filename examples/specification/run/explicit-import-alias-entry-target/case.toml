# CLI-to-JVM entry integration: `42` proves that the launcher invokes the
# selected lowered entry while its body dispatches the colliding helper name.
command = ["run", "--json", "main", "app.veln", "helper.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[json_assert]]
path = "error"
equals = null
