command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READS_HEX = "0102;0a0b"
VELN_NET_PRODUCTION_CLIENT_WRITES = "client-writes.hex"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "written clean-end true\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "net-events.log"
equals = "listen-production 127.0.0.1:0\naccept-production 127.0.0.1:0 production-stream\nread-production production-stream 0102\nread-production production-stream 0a0b\nread-end-production production-stream\nwrite-production production-stream ByteChunk([Byte(1), Byte(2)])\nwrite-production production-stream ByteChunk([Byte(10), Byte(11)])\nclose-production production-stream\naccept-end-production 127.0.0.1:0\n"

[[file_assert]]
path = "client-writes.hex"
equals = "01020a0b"
