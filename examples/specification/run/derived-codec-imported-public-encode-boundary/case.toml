command = ["run", "--json", "main", "main.veln", "wire.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "encoded\noutput_chunk_list derived-imported-packet count 1\noutput_chunk derived-imported-packet index 0 hex \"000703\" count 3\ninvalid\ncodec.encode_value_unrepresentable\nPacketWire.wire_kind\n"

[[json_assert]]
path = "error"
equals = null

[[output_chunk_list]]
name = "derived-imported-packet"
chunks = ["000703"]
