command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "reserved bits mismatch at byte offset 1"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "schema.reserved_bits_mismatch"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 1

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = [{"kind":"schema","name":"PackedSuffixHeader"},{"kind":"field","name":"control_padding"}]

[[json_assert]]
path = "error.details.byte_diagnostic.bit_width"
equals = 5

[[json_assert]]
path = "error.details.byte_diagnostic.expected_value"
equals = 0

[[json_assert]]
path = "error.details.byte_diagnostic.actual_value"
equals = 1
