command = ["run", "--json", "main", "main.test.veln"]
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "error"

[[json_assert]]
path = "diagnostics.0.id"
equals = "module.test_only_run_input"

[[json_assert]]
path = "diagnostics.0.details.source_path"
equals = "main.test.veln"
