command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.phase"
equals = "runtime"

[[json_assert]]
path = "error.details.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "NeedMore(NeedBytes(ByteCount(3)))"

[[json_assert]]
path = "error.details.byte_diagnostic.kind"
equals = "byte_diagnostic"

[[json_assert]]
path = "error.details.byte_diagnostic.id"
equals = "codec.incomplete_input"

[[json_assert]]
path = "error.details.byte_diagnostic.byte_offset.value"
equals = 3

[[json_assert]]
path = "error.details.byte_diagnostic.field_path"
equals = []

[[json_assert]]
path = "error.details.byte_diagnostic.readiness"
equals = "need_bytes"

[[json_assert]]
path = "error.details.byte_diagnostic.needed_count"
equals = 3

[[json_assert]]
path = "stderr"
equals = "Err(NeedMore(NeedBytes(ByteCount(3))))\n"
