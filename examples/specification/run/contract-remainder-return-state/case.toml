command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "stdout"
equals_file = "case-text/stdout.txt"

[[json_assert]]
path = "error.details.id"
equals = "runtime.remainder_by_zero"

[[json_assert]]
path = "error.message"
equals = "remainder divisor is zero"

[[json_assert]]
path = "error.details.operator"
equals = "%"

[[json_assert]]
path = "error.related.0.kind"
equals = "operation"
