command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals = "closed 1\noutput_chunk_list closed-reserved-dispatch count 1\noutput_chunk closed-reserved-dispatch index 0 hex \"01abcd\" count 3\ncompat 1\noutput_chunk_list closed-compat-reserved-dispatch count 1\noutput_chunk closed-compat-reserved-dispatch index 0 hex \"01abcd\" count 3\nextension 2 1\nextension-known\noutput_chunk_list extension-reserved-dispatch count 1\noutput_chunk extension-reserved-dispatch index 0 hex \"0201abcd\" count 4\n"

[[output_chunk_list]]
name = "closed-reserved-dispatch"
chunks = ["01abcd"]

[[output_chunk_list]]
name = "closed-compat-reserved-dispatch"
chunks = ["01abcd"]

[[output_chunk_list]]
name = "extension-reserved-dispatch"
chunks = ["0201abcd"]
