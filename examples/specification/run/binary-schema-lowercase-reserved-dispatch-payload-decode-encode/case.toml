command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals_file = "case-text/json-assert-equals-1.txt"

[[output_chunk_list]]
name = "closed-reserved-dispatch"
chunks = ["01abcd"]

[[output_chunk_list]]
name = "closed-compat-reserved-dispatch"
chunks = ["01abcd"]

[[output_chunk_list]]
name = "extension-reserved-dispatch"
chunks = ["0201abcd"]

[[output_chunk_list]]
name = "closed-subbyte-reserved-dispatch"
chunks = ["0180"]

[[output_chunk_list]]
name = "closed-two-bit-reserved-dispatch"
chunks = ["01c0"]

[[output_chunk_list]]
name = "closed-seven-bit-reserved-dispatch"
chunks = ["01fe"]

[[output_chunk_list]]
name = "extension-subbyte-reserved-dispatch"
chunks = ["010180"]

[[output_chunk_list]]
name = "extension-two-bit-reserved-dispatch"
chunks = ["0101c0"]

[[output_chunk_list]]
name = "extension-seven-bit-reserved-dispatch"
chunks = ["0101fe"]
