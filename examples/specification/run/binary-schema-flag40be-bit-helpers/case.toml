command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "error"
equals = null

[[json_assert]]
path = "stdout"
equals = "549755813889\n1\n1\n0\noutput_chunk_list flag40be-packet count 1\noutput_chunk flag40be-packet index 0 hex \"8000000001\" count 5\n"

[[output_chunk_list]]
name = "flag40be-packet"
chunks = ["8000000001"]
