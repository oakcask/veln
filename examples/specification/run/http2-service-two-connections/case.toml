command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_RUNTIME = "production-loopback"
VELN_NET_PRODUCTION_READS_HEX = "505249202a20485454502f322e300d0a0d0a534d0d0a0d0a000006040000000000000500008000000003010500000001828784,505249202a20485454502f322e300d0a0d0a534d0d0a0d0a000006040000000000000500008000000003010500000001828784"
VELN_NET_PRODUCTION_CLIENT_WRITES = "client-writes.hex"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "ok\n"

[[file_assert]]
path = "client-writes.hex"
equals = "00000004000000000000000004010000000000000101050000000189\n00000004000000000000000004010000000000000101050000000189"
