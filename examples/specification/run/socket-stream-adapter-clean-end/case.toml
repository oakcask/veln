command = ["run", "--json", "main", "main.veln"]
exit = 0

[requires]
jdk = true

[env]
VELN_NET_ACCEPT_STREAM = "fixture-stream"
VELN_NET_READ_CHUNKS_HEX = "010203,0a0b"
VELN_NET_EVENTS = "net-events.log"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "stdout"
equals = "actions 3 chunks 2 ended true writes 2 end-actions 1\n"

[[json_assert]]
path = "error"
equals = null

[[file_assert]]
path = "net-events.log"
equals = "listen 127.0.0.1:0\naccept 127.0.0.1:0 fixture-stream\nread fixture-stream 010203\nread fixture-stream 0a0b\nread-end fixture-stream\nwrite fixture-stream ByteChunk([Byte(1), Byte(2), Byte(3)])\nwrite fixture-stream ByteChunk([Byte(10), Byte(11)])\n"
