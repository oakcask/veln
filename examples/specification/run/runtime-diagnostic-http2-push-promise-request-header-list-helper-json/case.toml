command = ["run", "--json", "main", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "error.kind"
equals = "result"

[[json_assert]]
path = "error.details.value"
equals = "RuntimeDiagnostic(http2.protocol.invalid_request_header_list, HTTP/2 request header list contains te value other than trailers at byte offset 0, RuntimeHttp2Diagnostic(RuntimeHttp2ProtocolInvalidRequestHeaderListDiagnostic(0, 5, 1, te_header_value_not_trailers, te, :method,:scheme,:path,te, request-headers, rfc9113_te_trailers_only, ByteChunk([Byte(76), Byte(77), Byte(78), Byte(79)]))))"

[[json_assert]]
path = "error.details.protocol_diagnostic.kind"
equals = "protocol_diagnostic"

[[json_assert]]
path = "error.details.protocol_diagnostic.id"
equals = "http2.protocol.invalid_request_header_list"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_offset.value"
equals = 0

[[json_assert]]
path = "error.details.protocol_diagnostic.frame_kind"
equals = 5

[[json_assert]]
path = "error.details.protocol_diagnostic.stream_id"
equals = 1

[[json_assert]]
path = "error.details.protocol_diagnostic.failed_header_fact"
equals = "te_header_value_not_trailers"

[[json_assert]]
path = "error.details.protocol_diagnostic.header_name"
equals = "te"

[[json_assert]]
path = "error.details.protocol_diagnostic.decoded_header_names"
equals = ":method,:scheme,:path,te"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.data"
equals = "4c4d4e4f"

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.preview_byte_count"
equals = 4

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.total_byte_count"
equals = 4

[[json_assert]]
path = "error.details.protocol_diagnostic.byte_preview.truncated"
equals = false

[[json_assert]]
path = "error.details.protocol_diagnostic.active_state"
equals = "request-headers"

[[json_assert]]
path = "error.details.protocol_diagnostic.rule_provenance"
equals = "rfc9113_te_trailers_only"
