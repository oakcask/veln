format = "text"
contains = ["error[http2.protocol.invalid_response_header_list]: response header list places :status after a regular header at byte offset 12", "note: Frame kind 1 on stream 1 decoded response header names: server,:status.", "note: Active protocol state: response-headers.", "note: Rule provenance: rfc9113_response_pseudo_headers."]
