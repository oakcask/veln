command = ["package", "lock"]
exit = 0

[skip]
platforms = ["windows"]
reason = "fake git materialization uses the Unix harness script"

[tools]
git = "fake-git-rev-parse"

[stdout]
contains = ["wrote veln.lock"]

[stderr]
format = "empty"

[[file_assert]]
path = "veln.lock"
equals = "[[package]]\nname = \"github.com/oakcask/tagged\"\nsource = { kind = \"git\", url = \"https://example.invalid/tagged.git\", selector = { tag = \"v1\" }, rev = \"0123456789abcdef0123456789abcdef01234567\" }\nchecksum = \"sha256:96272a954581b62d1c3bf644864558bc23878ea8097d599df6c7955697a27606\"\n"
