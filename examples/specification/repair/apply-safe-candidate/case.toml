command = ["repair", "--apply", "main.veln"]
exit = 0

[stdout]
contains = ["applied repair-1", "verification passed"]

[stderr]
format = "empty"

[[file_assert]]
path = "main.veln"
equals = "# A single safe repair candidate can be applied and verified.\nfn main(order: { ready : Bool, paid : Bool }) -> { ready : Bool }\n\torder\nend\n"
