command = ["fmt", "main.veln"]
repeat = 2
exit = 1
source_errors = "expected"

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[parse.variant_refinement_type]: variant refinement has surplus closing angle brackets after its final variant name"]

[[file_assert]]
path = "main.veln"
equals_file = "case-text/file-assert-equals-1.txt"
