command = ["fmt", "main.veln"]
repeat = 2
exit = 0

[stdout]
format = "empty"

[stderr]
format = "empty"

[[file_assert]]
path = "main.veln"
equals = "pub schema Http2FrameHeader\n\tformat binary\n\n\tpriority: UInt16be\n\tlength: UInt24be\n\tkind: UInt8\n\tpadding_length: UInt8 where padding_length <= length\n\tstream_reserved: ReservedBits(1, 0)\n\tstream_id: UInt31be\n\tchecksum: UInt32be\n\tsettings: Repeat(length - padding_length, UInt16be)\n\tproduct_settings: Repeat(length * padding_length, UInt16be)\n\tpayload: ByteView(length - padding_length)\n\tproduct_payload: ByteView(length * padding_length)\nend\n"
