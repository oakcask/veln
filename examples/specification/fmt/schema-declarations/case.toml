command = ["fmt", "main.veln"]
repeat = 2
exit = 0

[stdout]
format = "empty"

[stderr]
format = "empty"

[[file_assert]]
path = "main.veln"
equals = "pub schema Http2FrameHeader\n\tformat binary\n\n\tpriority: uint16be\n\tlength: uint24be\n\tkind: uint8\n\tpadding_length: uint8 where padding_length <= length\n\tstream_reserved: uint1 reserves 0\n\tstream_id: uint31be\n\tchecksum: uint32be\n\tsettings: [uint16be; length - padding_length]\n\tproduct_settings: [uint16be; length * padding_length]\n\tpayload: ByteView(length - padding_length)\n\tproduct_payload: ByteView(length * padding_length)\nend\n"
