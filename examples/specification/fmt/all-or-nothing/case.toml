command = ["fmt", "bad.veln", "good.veln"]
exit = 1

[stdout]
format = "empty"

[stderr]
contains = ["bad.veln:3:3: error[parse.invalid_token]: invalid token in expression"]

[[file_assert]]
path = "bad.veln"
equals_file = "case-text/file-assert-equals-1.txt"

[[file_assert]]
path = "good.veln"
equals_file = "case-text/file-assert-equals-2.txt"
