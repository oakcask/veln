command = ["fmt", "main.veln"]
repeat = 2
exit = 1
source_errors = "expected"

[stdout]
format = "empty"

[stderr]
format = "text"
contains = ["error[parse.module_value_declaration]: module value declaration requires one lowercase value identifier"]

[[file_assert]]
path = "main.veln"
equals_file = "case-text/file-assert-equals-1.txt"
