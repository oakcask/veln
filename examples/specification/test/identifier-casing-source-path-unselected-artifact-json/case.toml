command = ["test", "--json", "main_test.veln"]
source_errors = "expected"
exit = 0

[requires]
jdk = true

[stdout]
format = "json"
not_contains = ["name.invalid_case", "module name `App_test`", "forbidden", "hidden_case"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "selection.mode"
equals = "explicit"

[[json_assert]]
path = "selection.targets.0"
equals = "main_test.veln"

[[json_assert]]
path = "summary.total"
equals = 1

[[json_assert]]
path = "summary.passed"
equals = 1

[[json_assert]]
path = "summary.blocked"
equals = 0

[[json_assert]]
path = "cases.0.name"
equals = "selected_case"

[[json_assert]]
path = "cases.0.status"
equals = "passed"

[[json_assert]]
path = "cases.0.events.0.stream"
equals = "stdout"

[[json_assert]]
path = "cases.0.events.0.text"
equals = "selected"
