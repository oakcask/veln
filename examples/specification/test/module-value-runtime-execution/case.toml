# This case checks the test command's worker execution and JSON event projection
# when a selected test reads an accepted module immutable value. The printed
# integer is only a sentinel for that CLI integration boundary.
command = ["test", "--json", "main_test.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "summary.total"
equals = 1

[[json_assert]]
path = "summary.passed"
equals = 1

[[json_assert]]
path = "cases.0.name"
equals = "reads_module_value"

[[json_assert]]
path = "cases.0.status"
equals = "passed"

[[json_assert]]
path = "cases.0.events.0.text"
equals = "42"
