command = ["test", "--json", "math.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "selection.confidence"
equals = "complete"

[[json_assert]]
path = "selection.reason"
equals = "dependency_graph"

[[json_assert]]
path = "selection.notes.0"
equals = "added 1 test source by dependency graph"

[[json_assert]]
path = "selection.targets.0"
equals = "app_test.veln"

[[json_assert]]
path = "selection.targets.1"
equals = "math.veln"

[[json_assert]]
path = "summary.total"
equals = 1

[[json_assert]]
path = "summary.passed"
equals = 1

[[json_assert]]
path = "cases.0.name"
equals = "qualified_import_call"

[[json_assert]]
path = "cases.0.status"
equals = "passed"

[[json_assert]]
path = "cases.0.events.0.text"
equals = "10"
