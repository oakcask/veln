command = ["test", "--json", "app_test.veln", "math.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "summary.total"
equals = 1

[[json_assert]]
path = "summary.passed"
equals = 1

[[json_assert]]
path = "cases.0.name"
equals = "qualified_import_call"

[[json_assert]]
path = "cases.0.status"
equals = "passed"

[[json_assert]]
path = "cases.0.events.0.text"
equals = "10"
