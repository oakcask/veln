command = ["test", "--json"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "selection.mode"
equals = "discovered"

[[json_assert]]
path = "selection.targets.0"
equals = "math.test.veln"

[[json_assert]]
path = "summary.total"
equals = 1

[[json_assert]]
path = "cases.0.name"
equals = "companion_is_discovered"

[[json_assert]]
path = "cases.0.status"
equals = "passed"
