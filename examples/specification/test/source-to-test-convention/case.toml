command = ["test", "--json", "main.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "selection.mode"
equals = "explicit"

[[json_assert]]
path = "selection.confidence"
equals = "complete"

[[json_assert]]
path = "selection.reason"
equals = "dependency_graph"

[[json_assert]]
path = "selection.notes.0"
equals = "added 1 test file by source-to-test convention"

[[json_assert]]
path = "selection.targets.0"
equals = "main.veln"

[[json_assert]]
path = "selection.targets.1"
equals = "main_test.veln"

[[json_assert]]
path = "summary.total"
equals = 1

[[json_assert]]
path = "cases.0.name"
equals = "paired_file_is_selected"

[[json_assert]]
path = "cases.0.status"
equals = "passed"
