command = ["test", "--json", "main_test.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "schema_version"
equals = "veln-test-json/v0"

[[json_assert]]
path = "command"
equals = "test"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "selection.mode"
equals = "explicit"

[[json_assert]]
path = "selection.confidence"
equals = "complete"

[[json_assert]]
path = "selection.reason"
equals = "user_selected"

[[json_assert]]
path = "summary.total"
equals = 2

[[json_assert]]
path = "summary.passed"
equals = 2

[[json_assert]]
path = "summary.failed"
equals = 0

[[json_assert]]
path = "summary.skipped"
equals = 0

[[json_assert]]
path = "summary.todo"
equals = 0

[[json_assert]]
path = "summary.blocked"
equals = 0

[[json_assert]]
path = "summary.errors"
equals = 0

[[json_assert]]
path = "cases.0.name"
equals = "visible_behavior"

[[json_assert]]
path = "cases.0.kind"
equals = "test"

[[json_assert]]
path = "cases.0.status"
equals = "passed"

[[json_assert]]
path = "cases.0.reason"
equals = null

[[json_assert]]
path = "cases.0.failure"
equals = null

[[json_assert]]
path = "cases.0.events.0.kind"
equals = "stdio"

[[json_assert]]
path = "cases.0.events.0.stream"
equals = "stdout"

[[json_assert]]
path = "cases.0.events.0.operation"
equals = "println"

[[json_assert]]
path = "cases.0.events.0.text"
equals = "tested"

[[json_assert]]
path = "cases.0.events.0.terminator"
equals = "newline"

[[json_assert]]
path = "cases.0.events.0.sequence"
equals = 1

[[json_assert]]
path = "cases.1.name"
equals = "fallible_behavior"

[[json_assert]]
path = "cases.1.kind"
equals = "test"

[[json_assert]]
path = "cases.1.status"
equals = "passed"
