command = ["test", "--json", "math.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "selection.mode"
equals = "explicit"

[[json_assert]]
path = "selection.targets.0"
equals = "math.test.veln"

[[json_assert]]
path = "selection.targets.1"
equals = "math.veln"

[[json_assert]]
path = "selection.targets.2"
equals = "math_test.veln"

[[json_assert]]
path = "summary.total"
equals = 2

[[json_assert]]
path = "cases.0.name"
equals = "companion_peer_is_selected"

[[json_assert]]
path = "cases.1.name"
equals = "integration_peer_is_still_selected"
