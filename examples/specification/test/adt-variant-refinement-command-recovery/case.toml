command = ["test", "--json", "selected_test.veln"]
source_errors = "expected"
exit = 1

[tools]
java = "fake-success"

[env]
JAVA_MARKER = "java-started"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "blocked"

[[json_assert]]
path = "diagnostics.0.id"
equals = "type.variant_refinement_unknown"

[[json_assert]]
path = "diagnostics.0.message"
equals = "variant `Missing` is not a variant of `State`"

[[json_assert]]
path = "diagnostics.0.span.file"
equals = "selected_test.veln"

[[json_assert]]
path = "diagnostics.0.span.start.line"
equals = 6

[[json_assert]]
path = "diagnostics.0.span.start.column"
equals = 35

[[json_assert]]
path = "diagnostics.0.span.end.line"
equals = 6

[[json_assert]]
path = "diagnostics.0.span.end.column"
equals = 42

[[json_assert]]
path = "diagnostics.0.details.base_type"
equals = "State"

[[json_assert]]
path = "diagnostics.0.details.variant"
equals = "Missing"

[[json_assert]]
path = "diagnostics.0.related"
length = 3

[[json_assert]]
path = "cases.0.status"
equals = "blocked"

[[json_assert]]
path = "cases.0.reason"
equals = "static_gate"

[[json_assert]]
path = "cases.0.events"
equals = []

[[file_assert]]
path = ".veln-harness-cache/jvm"
missing = true

[[file_assert]]
path = "java-started"
missing = true
