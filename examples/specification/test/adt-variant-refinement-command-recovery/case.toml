command = ["test", "--json", "selected_test.veln"]
source_errors = "expected"
exit = 1

[tools]
java = "fake-success"

[env]
JAVA_MARKER = "java-started"

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "blocked"

[[json_assert]]
path = "diagnostics.0.id"
equals = "type.invalid_annotation"

[[json_assert]]
path = "diagnostics.0.message"
contains = "State::Missing"

[[json_assert]]
path = "cases.0.status"
equals = "blocked"

[[json_assert]]
path = "cases.0.reason"
equals = "static_gate"

[[json_assert]]
path = "cases.0.events"
equals = []

[[file_assert]]
path = ".veln-harness-cache/jvm"
missing = true

[[file_assert]]
path = "java-started"
missing = true
