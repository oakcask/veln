command = ["test", "--json", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "cases.0.reason"
equals = "expected_output"

[[json_assert]]
path = "cases.0.failure.kind"
equals = "output"

[[json_assert]]
path = "cases.0.failure.details.kind"
equals = "output"
