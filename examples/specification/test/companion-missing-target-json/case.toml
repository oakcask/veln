command = ["test", "--json", "orphan.test.veln"]
source_errors = "expected"
exit = 1

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "blocked"

[[json_assert]]
path = "diagnostics.0.id"
equals = "module.companion_missing_target"

[[json_assert]]
path = "diagnostics.0.details.companion_path"
equals = "orphan.test.veln"

[[json_assert]]
path = "diagnostics.0.details.target_path"
equals = "orphan.veln"

[[json_assert]]
path = "cases.0.status"
equals = "blocked"
