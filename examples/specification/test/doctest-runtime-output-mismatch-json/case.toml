command = ["test", "--json", "main.veln"]
exit = 1

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "schema_version"
equals = "veln-test-json/v0"

[[json_assert]]
path = "status"
equals = "failed"

[[json_assert]]
path = "summary.total"
equals = 2

[[json_assert]]
path = "summary.failed"
equals = 2

[[json_assert]]
path = "cases.0.name"
equals = "doctest_1"

[[json_assert]]
path = "cases.0.kind"
equals = "doctest"

[[json_assert]]
path = "cases.0.status"
equals = "failed"

[[json_assert]]
path = "cases.0.reason"
equals = "expected_output"

[[json_assert]]
path = "cases.0.failure.kind"
equals = "output"

[[json_assert]]
path = "cases.0.failure.message"
equals = "expected stdout output did not match"

[[json_assert]]
path = "cases.0.failure.details.kind"
equals = "output"

[[json_assert]]
path = "cases.0.failure.details.stream"
equals = "stdout"

[[json_assert]]
path = "cases.0.failure.details.expected"
equals = "contract expected"

[[json_assert]]
path = "cases.0.failure.details.actual"
equals = "contract actual\n"

[[json_assert]]
path = "cases.0.failure.details.first_difference.line"
equals = 1

[[json_assert]]
path = "cases.0.failure.details.first_difference.expected"
equals = "contract expected"

[[json_assert]]
path = "cases.0.failure.details.first_difference.actual"
equals = "contract actual"

[[json_assert]]
path = "cases.0.failure.details.actual_events.0.text"
equals = "contract actual"

[[json_assert]]
path = "cases.1.name"
equals = "doctest_2"

[[json_assert]]
path = "cases.1.kind"
equals = "doctest"

[[json_assert]]
path = "cases.1.status"
equals = "failed"

[[json_assert]]
path = "cases.1.reason"
equals = "expected_output"

[[json_assert]]
path = "cases.1.failure.kind"
equals = "output"

[[json_assert]]
path = "cases.1.failure.message"
equals = "expected stdout output did not match"

[[json_assert]]
path = "cases.1.failure.details.kind"
equals = "output"

[[json_assert]]
path = "cases.1.failure.details.stream"
equals = "stdout"

[[json_assert]]
path = "cases.1.failure.details.expected"
equals = "result expected"

[[json_assert]]
path = "cases.1.failure.details.actual"
equals = "result actual\n"

[[json_assert]]
path = "cases.1.failure.details.first_difference.line"
equals = 1

[[json_assert]]
path = "cases.1.failure.details.first_difference.expected"
equals = "result expected"

[[json_assert]]
path = "cases.1.failure.details.first_difference.actual"
equals = "result actual"

[[json_assert]]
path = "cases.1.failure.details.actual_events.0.text"
equals = "result actual"
