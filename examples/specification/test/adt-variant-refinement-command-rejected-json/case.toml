command = ["test", "--json", "selected_test.veln"]
source_errors = "expected"
exit = 1

[tools]
java = "fake-success"

[env]
JAVA_MARKER = "java-started"

[stdout]
format = "json"
not_contains = ["forbidden"]

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "blocked"

[[json_assert]]
path = "selection.mode"
equals = "explicit"

[[json_assert]]
path = "diagnostics.0.id"
equals = "type.variant_mismatch"

[[json_assert]]
path = "diagnostics.0.span.file"
equals = "selected_test.veln"

[[json_assert]]
path = "diagnostics.0.span.start.line"
equals = 12

[[json_assert]]
path = "diagnostics.0.span.start.column"
equals = 14

[[json_assert]]
path = "diagnostics.0.span.end.line"
equals = 12

[[json_assert]]
path = "diagnostics.0.span.end.column"
equals = 20

[[json_assert]]
path = "diagnostics.0.details.actual_type"
equals = "State::Closed"

[[json_assert]]
path = "diagnostics.0.details.expected_type"
equals = "State::Ready"

[[json_assert]]
path = "diagnostics.0.details.expected_variants.0"
equals = "Ready"

[[json_assert]]
path = "diagnostics.0.details.excluded_variants.form"
equals = "listed"

[[json_assert]]
path = "diagnostics.0.details.excluded_variants.variants.0"
equals = "Closed"

[[json_assert]]
path = "diagnostics.0.details.constraint"
equals = "call_argument"

[[json_assert]]
path = "diagnostics.0.related.0.kind"
equals = "variant_exclusion"

[[json_assert]]
path = "diagnostics.0.related.0.span.start.line"
equals = 12

[[json_assert]]
path = "diagnostics.0.related.0.span.start.column"
equals = 14

[[json_assert]]
path = "diagnostics.0.related.0.span.end.line"
equals = 12

[[json_assert]]
path = "diagnostics.0.related.0.span.end.column"
equals = 20

[[json_assert]]
path = "diagnostics.0.related.1.kind"
equals = "expected_type_origin"

[[json_assert]]
path = "diagnostics.0.related.1.message"
equals = "Callee parameter type declared here."

[[json_assert]]
path = "diagnostics.0.related.1.span.start.line"
equals = 6

[[json_assert]]
path = "diagnostics.0.related.1.span.start.column"
equals = 1

[[json_assert]]
path = "diagnostics.0.related.1.span.end.line"
equals = 9

[[json_assert]]
path = "diagnostics.0.related.1.span.end.column"
equals = 1

[[json_assert]]
path = "summary.total"
equals = 1

[[json_assert]]
path = "summary.blocked"
equals = 1

[[json_assert]]
path = "cases.0.name"
equals = "selected_case"

[[json_assert]]
path = "cases.0.status"
equals = "blocked"

[[json_assert]]
path = "cases.0.reason"
equals = "static_gate"

[[json_assert]]
path = "cases.0.events"
equals = []

[[file_assert]]
path = ".veln-harness-cache/jvm"
missing = true

[[file_assert]]
path = "java-started"
missing = true
