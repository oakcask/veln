command = ["test", "--json", "main_test.veln"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "diagnostics"
length = 0

[[json_assert]]
path = "summary.total"
equals = 2

[[json_assert]]
path = "summary.passed"
equals = 2

[[json_assert]]
path = "summary.blocked"
equals = 0

[[json_assert]]
path = "cases.0.name"
equals = "cleanup_runs"

[[json_assert]]
path = "cases.0.status"
equals = "passed"

[[json_assert]]
path = "cases.0.diagnostics"
length = 0

[[json_assert]]
path = "cases.0.events"
length = 1

[[json_assert]]
path = "cases.0.events.0.kind"
equals = "stdio"

[[json_assert]]
path = "cases.0.events.0.stream"
equals = "stdout"

[[json_assert]]
path = "cases.0.events.0.operation"
equals = "println"

[[json_assert]]
path = "cases.0.events.0.text"
equals = "released"

[[json_assert]]
path = "cases.1.name"
equals = "unaffected"

[[json_assert]]
path = "cases.1.status"
equals = "passed"
