command = ["test", "--json"]
exit = 0

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "selection.mode"
equals = "discovered"

[[json_assert]]
path = "selection.confidence"
equals = "complete"

[[json_assert]]
path = "selection.reason"
equals = "pattern_discovery"

[[json_assert]]
path = "summary.total"
equals = 2

[[json_assert]]
path = "summary.passed"
equals = 2
