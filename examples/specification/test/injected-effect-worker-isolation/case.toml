command = ["test", "--json", "--jobs", "2", "main_test.veln", "fixture_effects.veln", "fake_effects.veln"]
exit = 0
repeat = 2

[requires]
jdk = true

[stdout]
format = "json"

[stderr]
format = "empty"

[[json_assert]]
path = "status"
equals = "passed"

[[json_assert]]
path = "summary.total"
equals = 2

[[json_assert]]
path = "summary.passed"
equals = 2

[[json_assert]]
path = "summary.errors"
equals = 0
