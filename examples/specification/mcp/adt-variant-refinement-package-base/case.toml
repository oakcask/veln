command = ["mcp"]
stdin_file = "requests.jsonl"
source_errors = "expected"
exit = 0

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/uri"
contains = "veln-pkg:///example%2Fdep/snapshot/"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/range"
equals = {"start":{"line":1,"column":10},"end":{"line":1,"column":15}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references"
length = 2

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/1/uri"
contains = "veln-pkg:///example%2Fdep/snapshot/"

[[mcp_assert]]
id = 4
path = "/result/structuredContent/edits"
equals = []

[[mcp_assert]]
id = 5
path = "/result/structuredContent/definition"
equals = null
