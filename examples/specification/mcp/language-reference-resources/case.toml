[[mcp_assert]]
id = 2
path = "/result/nextCursor"
missing = true

[[mcp_assert]]
id = 3
path = "/result/contents"
length = 1

[[mcp_assert]]
id = 3
path = "/result/contents/0/uri"
equals = "veln-doc:///language/snapshot/4fc5858d00e37d7e88faedcef4bb2c02175fa0dcac4c54a7caa395309d776ed9/index"

[[mcp_assert]]
id = 3
