command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stdout]
contains = [
  "\"resources\":{\"listChanged\":false,\"subscribe\":false}",
  "\"name\":\"language-index\"",
  "\"name\":\"lexical-structure\"",
  "# Veln Language Reference",
  "\"code\":\"resource_not_found\"",
]

[stderr]
format = "empty"

[[mcp_assert]]
id = 1
path = "/result/capabilities/resources"
equals = {"listChanged":false,"subscribe":false}

[[mcp_assert]]
