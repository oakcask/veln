command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
source_errors = "expected"
exit = 0

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/uri"
workspace_file_uri = "handler.veln"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/range"
equals = {"start":{"line":3,"column":13},"end":{"line":3,"column":16}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references"
length = 3

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/0/uri"
workspace_file_uri = "consumer.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":6,"column":30},"end":{"line":6,"column":33}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/1/uri"
workspace_file_uri = "consumer.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/1/range"
equals = {"start":{"line":10,"column":21},"end":{"line":10,"column":24}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/2/uri"
workspace_file_uri = "handler.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/2/range"
equals = {"start":{"line":8,"column":17},"end":{"line":8,"column":20}}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references"
length = 2

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references/0/uri"
workspace_file_uri = "consumer.veln"

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":6,"column":30},"end":{"line":6,"column":33}}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references/1/range"
equals = {"start":{"line":10,"column":21},"end":{"line":10,"column":24}}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/next_cursor"
contains = "."

[[mcp_assert]]
id = 5
path = "/result/structuredContent/references"
length = 2

[[mcp_assert]]
id = 5
path = "/result/structuredContent/references/0/uri"
workspace_file_uri = "handler.veln"

[[mcp_assert]]
id = 5
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":3,"column":13},"end":{"line":3,"column":16}}

[[mcp_assert]]
id = 5
path = "/result/structuredContent/references/1/range"
equals = {"start":{"line":8,"column":17},"end":{"line":8,"column":20}}

[[mcp_assert]]
id = 5
path = "/result/structuredContent/next_cursor"
missing = true
