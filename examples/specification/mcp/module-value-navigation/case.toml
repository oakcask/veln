command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/uri"
workspace_file_uri = "values.veln"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/range"
equals = {"start":{"line":1,"column":9},"end":{"line":1,"column":15}}
