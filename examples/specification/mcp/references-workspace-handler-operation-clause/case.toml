command = ["mcp"]
stdin_file = "requests.jsonl"
exit = 0

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references"
length = 2

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":10,"column":29},"end":{"line":10,"column":33}}

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/1/range"
equals = {"start":{"line":14,"column":3},"end":{"line":14,"column":7}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":2,"column":3},"end":{"line":2,"column":7}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/next_cursor"
contains = "."

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":10,"column":29},"end":{"line":10,"column":33}}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/next_cursor"
contains = "."

[[mcp_assert]]
id = 5
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":14,"column":3},"end":{"line":14,"column":7}}

[[mcp_assert]]
id = 5
path = "/result/structuredContent/next_cursor"
missing = true
