command = ["mcp"]
stdin_file = "requests.jsonl"
source_errors = "expected"
exit = 0

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/range"
equals = {"start":{"line":3,"column":10},"end":{"line":3,"column":15}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":3,"column":10},"end":{"line":3,"column":15}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/next_cursor"
contains = "."

[[mcp_assert]]
id = 4
path = "/result/structuredContent/code"
equals = "invalid_position"

[[mcp_assert]]
id = 5
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":5,"column":17},"end":{"line":5,"column":22}}

[[mcp_assert]]
id = 6
path = "/result/structuredContent/references"
length = 3

[[mcp_assert]]
id = 7
path = "/result/structuredContent/edits"
length = 3

[[mcp_assert]]
id = 8
path = "/result/structuredContent/definition"
equals = null

[[mcp_assert]]
id = 9
path = "/result/structuredContent/definition"
equals = null
