command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stdout]
contains = ["\"name\":\"rename\",\"outputSchema\""]

[stderr]
format = "empty"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/edits"
length = 3

[[mcp_assert]]
id = 3
path = "/result/structuredContent/edits/0/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/edits/0/range"
equals = {"start":{"line":1,"column":4},"end":{"line":1,"column":10}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/edits/0/new_text"
equals = "next"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/edits/1/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/edits/1/range"
equals = {"start":{"line":2,"column":3},"end":{"line":2,"column":9}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/edits/1/new_text"
equals = "next"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/edits/2/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/edits/2/range"
equals = {"start":{"line":6,"column":3},"end":{"line":6,"column":9}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/edits/2/new_text"
equals = "next"

[[mcp_assert]]
id = 3
path = "/result/isError"
equals = false

[[mcp_assert]]
id = 4
path = "/result/structuredContent/code"
equals = "rename.invalid_name"

[[mcp_assert]]
id = 4
path = "/result/structuredContent/details"
equals = {"requested_name":"two words"}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/edits"
missing = true

[[mcp_assert]]
id = 5
path = "/result/structuredContent/code"
equals = "rename.invalid_case"

[[mcp_assert]]
id = 5
path = "/result/structuredContent/details"
equals = {"symbol_class":"function","requested_name":"Next","required_initial":"ascii_lowercase"}

[[mcp_assert]]
id = 6
path = "/error/code"
equals = -32602

[[mcp_assert]]
id = 7
path = "/result/structuredContent/definition/range"
equals = {"start":{"line":1,"column":4},"end":{"line":1,"column":10}}

[[mcp_assert]]
id = 8
path = "/result/structuredContent/references"
length = 2

[[mcp_assert]]
id = 9
path = "/result/structuredContent/edits"
length = 3

[[mcp_assert]]
id = 9
path = "/result/structuredContent/edits/0/new_text"
equals = "match"
