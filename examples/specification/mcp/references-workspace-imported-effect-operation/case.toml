command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
source_errors = "expected"
exit = 0

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/uri"
workspace_file_uri = "foreign.veln"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/range"
equals = {"start":{"line":2,"column":3},"end":{"line":2,"column":6}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references"
length = 2

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/0/uri"
workspace_file_uri = "foreign.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":6,"column":25},"end":{"line":6,"column":28}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/1/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/1/range"
equals = {"start":{"line":4,"column":35},"end":{"line":4,"column":38}}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references"
length = 1

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":2,"column":3},"end":{"line":2,"column":6}}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/next_cursor"
contains = "."

[[mcp_assert]]
id = 5
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":6,"column":25},"end":{"line":6,"column":28}}

[[mcp_assert]]
id = 5
path = "/result/structuredContent/next_cursor"
contains = "."

[[mcp_assert]]
id = 6
path = "/result/structuredContent/references/0/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 6
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":4,"column":35},"end":{"line":4,"column":38}}

[[mcp_assert]]
id = 6
path = "/result/structuredContent/next_cursor"
missing = true
