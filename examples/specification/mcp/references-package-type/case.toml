command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stdout]
contains = [
  "\"references\":[{\"range\":{\"end\":{\"column\":65,\"line\":8},\"start\":{\"column\":61,\"line\":8}},\"uri\":\"file://",
  "\"scope\":{\"generation\":0,\"mode\":\"project\",\"project\":\".\",\"project_wide\":true}",
]

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references"
length = 3

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/0/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":8,"column":61},"end":{"line":8,"column":65}}

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/1/range"
equals = {"start":{"line":8,"column":75},"end":{"line":8,"column":79}}

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/2/range"
equals = {"start":{"line":9,"column":8},"end":{"line":9,"column":12}}

[[mcp_assert]]
id = 2
path = "/result/structuredContent/scope"
equals = {"mode":"project","generation":0,"project":".","project_wide":true}

[[mcp_assert]]
id = 2
path = "/result/isError"
equals = false

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references"
length = 3

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/2/range"
equals = {"start":{"line":9,"column":8},"end":{"line":9,"column":12}}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references"
length = 2

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":16,"column":24},"end":{"line":16,"column":35}}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references/1/range"
equals = {"start":{"line":16,"column":49},"end":{"line":16,"column":60}}

[[mcp_assert]]
id = 5
path = "/result/structuredContent/references"
equals = []

[[mcp_assert]]
id = 6
path = "/result/structuredContent/references"
equals = []
