command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stdout]
contains = [
  "\"references\":[{\"range\":{\"end\":{\"column\":10,\"line\":2},\"start\":{\"column\":3,\"line\":2}},\"uri\":\"file://",
  "\"scope\":{\"generation\":0,\"mode\":\"project\",\"project\":\".\",\"project_wide\":true}",
]

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references"
length = 4

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/0/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":2,"column":3},"end":{"line":2,"column":10}}

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/1/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/1/range"
equals = {"start":{"line":6,"column":48},"end":{"line":6,"column":55}}

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/2/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/2/range"
equals = {"start":{"line":7,"column":44},"end":{"line":7,"column":51}}

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/3/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/3/range"
equals = {"start":{"line":8,"column":21},"end":{"line":8,"column":28}}

[[mcp_assert]]
id = 2
path = "/result/structuredContent/scope"
equals = {"mode":"project","generation":0,"project":".","project_wide":true}

[[mcp_assert]]
id = 2
path = "/result/isError"
equals = false

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references"
length = 4

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/1/range"
equals = {"start":{"line":6,"column":48},"end":{"line":6,"column":55}}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references"
length = 4

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references/2/range"
equals = {"start":{"line":7,"column":44},"end":{"line":7,"column":51}}

[[mcp_assert]]
id = 5
path = "/result/structuredContent/references"
length = 4

[[mcp_assert]]
id = 5
path = "/result/structuredContent/references/3/range"
equals = {"start":{"line":8,"column":21},"end":{"line":8,"column":28}}

[[mcp_assert]]
id = 6
path = "/result/structuredContent/references"
length = 0
