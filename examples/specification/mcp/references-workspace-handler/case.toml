command = ["mcp"]
stdin_file = "requests.jsonl"
source_errors = "expected"
exit = 0

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references"
length = 2

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":6,"column":23},"end":{"line":6,"column":26}}

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/1/range"
equals = {"start":{"line":10,"column":17},"end":{"line":10,"column":20}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":1,"column":9},"end":{"line":1,"column":12}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/next_cursor"
contains = "."

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":6,"column":23},"end":{"line":6,"column":26}}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/next_cursor"
contains = "."

[[mcp_assert]]
id = 5
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":10,"column":17},"end":{"line":10,"column":20}}

[[mcp_assert]]
id = 5
path = "/result/structuredContent/next_cursor"
missing = true
