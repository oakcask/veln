command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stderr]
format = "empty"

[[mcp_assert]]
id = 11
path = "/result/structuredContent/references"
length = 2

[[mcp_assert]]
id = 11
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":5,"column":26},"end":{"line":5,"column":32}}

[[mcp_assert]]
id = 11
path = "/result/structuredContent/references/1/uri"
contains = "veln-pkg:///example%2Fdep/snapshot/"

[[mcp_assert]]
id = 13
path = "/result"
equals_response = {"id":4,"path":"/result"}
