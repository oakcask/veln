command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stderr]
format = "empty"

[[mcp_assert]]
id = 10
path = "/result/structuredContent/references"
length = 2

[[mcp_assert]]
id = 10
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":3,"column":30},"end":{"line":3,"column":36}}

[[mcp_assert]]
id = 10
path = "/result/structuredContent/references/1/range"
equals = {"start":{"line":1,"column":9},"end":{"line":1,"column":15}}

[[mcp_assert]]
id = 13
path = "/result"
equals_response = {"id":4,"path":"/result"}
