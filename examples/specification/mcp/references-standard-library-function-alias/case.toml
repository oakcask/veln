command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stdout]
contains = [
  "\"references\":[{\"range\":{\"end\":{\"column\":35,\"line\":2},\"start\":{\"column\":21,\"line\":2}},\"uri\":\"file://",
  "\"scope\":{\"generation\":0,\"mode\":\"project\",\"project\":\".\",\"project_wide\":true}",
]

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references"
length = 3

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/0/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":2,"column":21},"end":{"line":2,"column":35}}

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/1/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/1/range"
equals = {"start":{"line":6,"column":46},"end":{"line":6,"column":60}}

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/2/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references/2/range"
equals = {"start":{"line":7,"column":67},"end":{"line":7,"column":81}}

[[mcp_assert]]
id = 2
path = "/result/structuredContent/scope"
equals = {"mode":"project","generation":0,"project":".","project_wide":true}

[[mcp_assert]]
id = 2
path = "/result/isError"
equals = false

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references"
length = 3

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/1/range"
equals = {"start":{"line":6,"column":46},"end":{"line":6,"column":60}}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references"
length = 3

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references/2/range"
equals = {"start":{"line":7,"column":67},"end":{"line":7,"column":81}}
