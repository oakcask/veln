command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/edits"
length = 0

[[mcp_assert]]
id = 3
path = "/result/structuredContent/edits"
length = 1

[[mcp_assert]]
id = 3
path = "/result/structuredContent/edits/0/uri"
workspace_file_uri = "model.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/edits/0/range"
equals = {"start":{"line":1,"column":10},"end":{"line":1,"column":15}}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/edits"
length = 0

[[mcp_assert]]
id = 5
path = "/result/structuredContent/edits"
length = 1

[[mcp_assert]]
id = 5
path = "/result/structuredContent/edits/0/uri"
workspace_file_uri = "bridge.veln"

[[mcp_assert]]
id = 5
path = "/result/structuredContent/edits/0/range"
equals = {"start":{"line":1,"column":10},"end":{"line":1,"column":15}}
