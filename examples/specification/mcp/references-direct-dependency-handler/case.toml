command = ["mcp"]
stdin_file = "requests.jsonl"
exit = 0

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/uri"
contains = "veln-pkg:///example%2Fdep/snapshot/"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/range"
equals = {"start":{"line":1,"column":13},"end":{"line":1,"column":16}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references"
length = 2

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/0/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/1/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references"
length = 1

[[mcp_assert]]
id = 4
path = "/result/structuredContent/next_cursor"
contains = "."

[[mcp_assert]]
id = 5
path = "/result/structuredContent/references"
length = 1

[[mcp_assert]]
id = 5
path = "/result/structuredContent/next_cursor"
contains = "."

[[mcp_assert]]
id = 6
path = "/result/structuredContent/references/0/uri"
contains = "veln-pkg:///example%2Fdep/snapshot/"

[[mcp_assert]]
id = 6
path = "/result/structuredContent/next_cursor"
missing = true
