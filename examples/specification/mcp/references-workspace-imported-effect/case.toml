command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
source_errors = "expected"
exit = 0

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/uri"
workspace_file_uri = "foreign.veln"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/range"
equals = {"start":{"line":1,"column":12},"end":{"line":1,"column":13}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references"
length = 5

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/0/uri"
workspace_file_uri = "foreign.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":5,"column":28},"end":{"line":5,"column":29}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/4/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/4/range"
equals = {"start":{"line":4,"column":20},"end":{"line":4,"column":21}}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references"
length = 2

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":1,"column":12},"end":{"line":1,"column":13}}

[[mcp_assert]]
id = 4
path = "/result/structuredContent/next_cursor"
contains = "."

[[mcp_assert]]
id = 5
path = "/result/structuredContent/references"
length = 2

[[mcp_assert]]
id = 5
path = "/result/structuredContent/next_cursor"
contains = "."

[[mcp_assert]]
id = 6
path = "/result/structuredContent/references"
length = 2

[[mcp_assert]]
id = 6
path = "/result/structuredContent/next_cursor"
missing = true
