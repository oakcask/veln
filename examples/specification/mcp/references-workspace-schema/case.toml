command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stdout]
contains = [
  "\"description\":\"Return references for a supported symbol in one saved workspace source\"",
  "\"name\":\"references\",\"outputSchema\"",
]

[stderr]
format = "empty"

[[mcp_assert]]
id = 3
path = "/result/isError"
equals = false

[[mcp_assert]]
id = 3
path = "/result/structuredContent/scope"
equals = {"mode":"project","generation":0,"project":".","project_wide":true}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references"
length = 4

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/0/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/0/range"
equals = {"start":{"line":7,"column":24},"end":{"line":7,"column":30}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/1/uri"
workspace_file_uri = "main.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/1/range"
equals = {"start":{"line":8,"column":24},"end":{"line":8,"column":30}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/2/uri"
workspace_file_uri = "other.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/2/range"
equals = {"start":{"line":9,"column":31},"end":{"line":9,"column":37}}

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/3/uri"
workspace_file_uri = "other.veln"

[[mcp_assert]]
id = 3
path = "/result/structuredContent/references/3/range"
equals = {"start":{"line":10,"column":30},"end":{"line":10,"column":36}}

[[mcp_assert]]
id = 4
path = "/result/isError"
equals = false

[[mcp_assert]]
id = 4
path = "/result/structuredContent/references"
length = 0

[[mcp_assert]]
id = 5
path = "/result/isError"
equals = false

[[mcp_assert]]
id = 5
path = "/result/structuredContent/references"
length = 0

[[mcp_assert]]
id = 6
path = "/result/isError"
equals = false

[[mcp_assert]]
id = 6
path = "/result/structuredContent/references"
length = 0

[[mcp_assert]]
id = 7
path = "/result/isError"
equals = false

[[mcp_assert]]
id = 7
path = "/result/structuredContent/references"
length = 0
