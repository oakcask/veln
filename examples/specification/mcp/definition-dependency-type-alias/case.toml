command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stdout]
contains = [
  "\"uri\":\"veln-pkg:///example%2Fdep/snapshot/",
  "\"definition\":null",
]

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/uri"
contains = "veln-pkg:///example%2Fdep/snapshot/"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/definition/range"
equals = {"start":{"line":10,"column":10},"end":{"line":10,"column":14}}

[[mcp_assert]]
id = 2
path = "/result/isError"
equals = false

[[mcp_assert]]
id = 2
path = "/error"
missing = true

[[mcp_assert]]
id = 3
path = "/result/structuredContent/definition"
equals = null

[[mcp_assert]]
id = 3
path = "/result/isError"
equals = false

[[mcp_assert]]
id = 3
path = "/error"
missing = true

[[mcp_assert]]
id = 4
path = "/result/structuredContent/definition"
equals = null

[[mcp_assert]]
id = 5
path = "/result/structuredContent/definition"
equals = null

[[mcp_assert]]
id = 6
path = "/result/structuredContent/definition"
equals = null
