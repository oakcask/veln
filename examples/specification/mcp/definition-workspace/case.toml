command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stdout]
contains = [
  "\"description\":\"Resolve a supported symbol in one saved workspace source\"",
  "\"name\":\"definition\",\"outputSchema\"",
  "\"required\":[\"source\",\"line\",\"column\"]",
  "\"range\":{\"end\":{\"column\":10,\"line\":1},\"start\":{\"column\":4,\"line\":1}}",
  "\"structuredContent\":{\"definition\":null}",
  "\"isError\":true,\"structuredContent\":{\"code\":\"invalid_position\"",
]
not_contains = ["veln-pkg:", "target/debug"]

[stderr]
format = "empty"
