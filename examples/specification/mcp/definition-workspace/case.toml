command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stdout]
contains = [
  "\"description\":\"Resolve a supported symbol in one saved workspace source\"",
  "\"name\":\"definition\",\"outputSchema\"",
  "\"required\":[\"source\",\"line\",\"column\"]",
]
not_contains = ["veln-pkg:", "target/debug"]

[stderr]
format = "empty"

[[mcp_jsonl_assert]]
id = 3
path = "/result/structuredContent/definition/uri"
workspace_file_uri = "main.veln"

[[mcp_jsonl_assert]]
id = 3
path = "/result/structuredContent/definition/range"
equals = {"start":{"line":1,"column":4},"end":{"line":1,"column":10}}

[[mcp_jsonl_assert]]
id = 3
path = "/result/content"
array_len = 1

[[mcp_jsonl_assert]]
id = 3
path = "/result/content/0/type"
equals = "text"

[[mcp_jsonl_assert]]
id = 3
path = "/result/isError"
equals = false

[[mcp_jsonl_assert]]
id = 3
path = "/error"
missing = true

[[mcp_jsonl_assert]]
id = 4
path = "/result/structuredContent/definition"
equals = null

[[mcp_jsonl_assert]]
id = 4
path = "/error"
missing = true

[[mcp_jsonl_assert]]
id = 5
path = "/result/structuredContent/code"
equals = "invalid_position"

[[mcp_jsonl_assert]]
id = 5
path = "/result/isError"
equals = true

[[mcp_jsonl_assert]]
id = 5
path = "/result/structuredContent/definition"
missing = true

[[mcp_jsonl_assert]]
id = 6
path = "/result/structuredContent/definition/uri"
workspace_file_uri = "main.veln"

[[mcp_jsonl_assert]]
id = 6
path = "/result/structuredContent/definition/range"
equals = {"start":{"line":1,"column":4},"end":{"line":1,"column":10}}

[[mcp_jsonl_assert]]
id = 7
path = "/result/structuredContent/definition/uri"
workspace_file_uri = "main.veln"

[[mcp_jsonl_assert]]
id = 7
path = "/result/structuredContent/definition/range"
equals = {"start":{"line":1,"column":4},"end":{"line":1,"column":10}}

[[mcp_jsonl_assert]]
id = 8
path = "/result/structuredContent/code"
equals = "invalid_position"

[[mcp_jsonl_assert]]
id = 8
path = "/result/isError"
equals = true

[[mcp_jsonl_assert]]
id = 9
path = "/error/code"
equals = -32602

[[mcp_jsonl_assert]]
id = 9
path = "/result"
missing = true

[[mcp_jsonl_assert]]
id = 10
path = "/result/structuredContent/code"
equals = "invalid_position"

[[mcp_jsonl_assert]]
id = 10
path = "/result/isError"
equals = true

[[mcp_jsonl_assert]]
id = 11
path = "/error/code"
equals = -32602

[[mcp_jsonl_assert]]
id = 11
path = "/result"
missing = true
