command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stdout]
contains = [
  "\"name\":\"std-documentation-index\"",
  "\"name\":\"package-documentation-module\"",
  "\"name\":\"package-documentation-declaration\"",
  "# Package Documentation: std",
  "# Module prelude",
  "# Module net",
  "# Alias Byte",
  "# Type Network",
  "# Function join_host_port",
  "# Effect IO",
  "# Handler system",
  "[alias Listener]",
  "[alias Stream]",
  "[alias ByteCount]",
  "[type ReadOutcome]",
  "[type WriteOutcome]",
  "byte_chunk_len",
  "byte_view_len",
  "\"code\":\"resource_not_found\"",
]
# Integration gate for the exported network module: the public system handler
# is published while its body and private system intrinsics remain excluded.
not_contains = ["prelude_builtin::net_system_", "net_system_resolve"]

[stderr]
format = "empty"

