command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stdout]
contains = [
  "\"name\":\"std-documentation-index\"",
  "\"name\":\"package-documentation-module\"",
  "\"name\":\"package-documentation-declaration\"",
  "# Package Documentation: std",
  "# Module prelude",
  "# Alias Byte",
  "byte_chunk_len",
  "byte_view_len",
  "\"code\":\"resource_not_found\"",
]

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/resources/11/name"
equals = "std-documentation-index"

[[mcp_assert]]
id = 2
path = "/result/resources/11/title"
equals = "Veln package documentation: std"

[[mcp_assert]]
id = 2
path = "/result/resources/11/mimeType"
equals = "text/markdown; charset=utf-8"

[[mcp_assert]]
id = 2
path = "/result/resources/11/description"
missing = true

[[mcp_assert]]
id = 2
path = "/result/nextCursor"
missing = true

[[mcp_assert]]
id = 3
path = "/result/resourceTemplates"
length = 2

[[mcp_assert]]
id = 3
path = "/result/resourceTemplates/0/name"
equals = "package-documentation-module"

[[mcp_assert]]
id = 3
path = "/result/resourceTemplates/0/uriTemplate"
