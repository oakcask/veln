command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stdout]
contains = [
  "\"references\":[{\"range\":{\"end\":{\"column\":32,\"line\":1},\"start\":{\"column\":23,\"line\":1}},\"uri\":\"file://",
  "\"scope\":{\"generation\":0,\"mode\":\"project\",\"project\":\".\",\"project_wide\":true}",
]

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/structuredContent/references"
length = 9

