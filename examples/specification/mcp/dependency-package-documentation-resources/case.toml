command = ["mcp"]
stdin_file = "case-text/root-stdin-1.jsonl"
exit = 0

[stdout]
contains = [
  "\"name\":\"example-dep-documentation-index\"",
  "\"name\":\"example-bad-documentation-status\"",
  "\"name\":\"package-documentation-module\"",
  "\"name\":\"package-documentation-declaration\"",
  "# Package Documentation: example/dep",
  "# Module api",
  "# Function answer",
  "package_doc.unresolved_schema_reference",
  "\"scope\":\"package\"",
  "\"title\":\"Veln package documentation: example/dep\"",
  "\"name\":\"example-dep-documentation-index\"",
  "\"code\":\"resource_not_found\"",
  "\"packageDocumentationUri\":\"veln-doc:///package/example%2Fdep/snapshot/",
]

[stderr]
format = "empty"

[[mcp_assert]]
id = 2
path = "/result/isError"
equals = false

[[mcp_assert]]
id = 3
path = "/result/resources/$name=example-bad-documentation-status/name"
equals = "example-bad-documentation-status"

[[mcp_assert]]
id = 3
path = "/result/resources/$name=example-dep-documentation-index/name"
equals = "example-dep-documentation-index"

[[mcp_assert]]
id = 3
path = "/result/resources/$name=example-dep-documentation-index/description"
equals = "Dependency documentation fixture"

[[mcp_assert]]
id = 3
path = "/result/resources/$name=example-dep-documentation-index/mimeType"
equals = "text/markdown; charset=utf-8"

[[mcp_assert]]
id = 3
path = "/result/nextCursor"
missing = true

[[mcp_assert]]
id = 4
path = "/result/resourceTemplates"
length = 2

[[mcp_assert]]
id = 5
path = "/result/contents/0/text"
contains = "- Package identity: example/dep"

[[mcp_assert]]
id = 5
path = "/result/contents/0/text"
contains = "- Exported modules: api"

[[mcp_assert]]
id = 5
path = "/result/contents/0/text"
contains = "[api]("

[[mcp_assert]]
id = 6
path = "/result/contents/0/text"
contains = "- Source path: api.veln"

[[mcp_assert]]
id = 6
path = "/result/contents/0/text"
contains = "[function answer]("

[[mcp_assert]]
id = 7
path = "/result/contents/0/text"
contains = "- Signature: fn answer() -> Int"

[[mcp_assert]]
id = 8
path = "/error/data/code"
equals = "resource_not_found"

[[mcp_assert]]
id = 10
path = "/result/resources/$name=example-dep-documentation-index/name"
equals = "example-dep-documentation-index"

[[mcp_assert]]
id = 11
path = "/result/contents/0/text"
contains = "- State: failed"

[[mcp_assert]]
id = 11
path = "/result/contents/0/text"
contains = "package_doc.unresolved_schema_reference"

[[mcp_assert]]
id = 12
path = "/error/data/code"
equals = "resource_not_found"

[[mcp_assert]]
id = 13
path = "/result/isError"
equals = false

[[mcp_assert]]
id = 13
path = "/result/structuredContent/scope"
equals = "package"

[[mcp_assert]]
id = 13
path = "/result/structuredContent/results/0/uri"
equals_response = {"id":3,"path":"/result/resources/$name=example-dep-documentation-index/uri"}

[[mcp_assert]]
id = 14
path = "/result/structuredContent/text"
contains = "- Package identity: example/dep"

[[mcp_assert]]
id = 15
path = "/result/structuredContent/text"
contains = "- Source path: api.veln"

[[mcp_assert]]
id = 16
path = "/result/structuredContent/text"
contains = "- State: failed"

[[mcp_assert]]
id = 17
path = "/result/isError"
equals = true

[[mcp_assert]]
id = 17
path = "/result/structuredContent/code"
equals = "resource_not_found"

# Definition navigation must select the documentation revision generated from
# the same stable dependency capture as the package source location.
[[mcp_assert]]
id = 18
path = "/result/structuredContent/definition/packageDocumentationUri"
equals_response = {"id":7,"path":"/result/contents/0/uri"}
