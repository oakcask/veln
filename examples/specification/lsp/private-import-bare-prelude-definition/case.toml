command = ["lsp"]
stdin_jsonrpc_file = "requests.json"
exit = 0

[stdout]
contains = ["\"definitionProvider\":true"]
not_contains = ["\"id\":2,\"result\":null", "crates/veln-stdlib", "target/debug"]

[stderr]
format = "empty"

[[lsp_assert]]
id = 3
path = "/result"
equals = null

[[lsp_assert]]
id = 2
path = "/result/uri"
contains = "veln-pkg:///std/snapshot/"

[[lsp_assert]]
id = 2
path = "/result/uri"
contains = "/prelude.veln"

[[lsp_assert]]
id = 2
path = "/result/range"
source_range = {"id":100,"path":"/result","declaration":"pub fn byte(","symbol":"byte"}
