command = ["lsp"]
stdin_jsonrpc_file = "requests.json"
exit = 0

[stderr]
format = "empty"

[[lsp_assert]]
id = 2
path = "/result/range"
equals = {"start":{"line":0,"character":9},"end":{"line":0,"character":14}}

[[lsp_assert]]
id = 3
path = "/result/range"
equals = {"start":{"line":5,"character":9},"end":{"line":5,"character":14}}

[[lsp_assert]]
id = 4
path = "/result/range"
equals = {"start":{"line":1,"character":5},"end":{"line":1,"character":10}}

[[lsp_assert]]
id = 5
path = "/result/0/range"
equals = {"start":{"line":1,"character":5},"end":{"line":1,"character":10}}

[[lsp_assert]]
id = 5
path = "/result/4/range"
equals = {"start":{"line":10,"character":9},"end":{"line":10,"character":14}}

[[lsp_assert]]
id = 6
path = "/result"
equals = {"start":{"line":7,"character":46},"end":{"line":7,"character":51}}

[[lsp_assert]]
id = 7
path = "/result/changes/$workspace_file_uri:main.veln"
equals = [
  {"range":{"start":{"line":1,"character":5},"end":{"line":1,"character":10}},"newText":"Prepared"},
  {"range":{"start":{"line":7,"character":25},"end":{"line":7,"character":30}},"newText":"Prepared"},
  {"range":{"start":{"line":7,"character":46},"end":{"line":7,"character":51}},"newText":"Prepared"},
  {"range":{"start":{"line":8,"character":19},"end":{"line":8,"character":24}},"newText":"Prepared"},
  {"range":{"start":{"line":10,"character":9},"end":{"line":10,"character":14}},"newText":"Prepared"}
]
