command = ["lsp"]
source_errors = "expected"
stdin_jsonrpc_file = "requests.json"
exit = 0

[stderr]
format = "empty"

[stdout]
contains = [
  "\"id\":5,\"result\":{\"changes\":{\"file://",
  "\"id\":9,\"result\":{\"changes\":{\"file://",
  "\"newText\":\"callback\"",
  "\"newText\":\"result\"",
]

[[lsp_assert]]
id = 1
path = "/result/capabilities/definitionProvider"
equals = true

[[lsp_assert]]
id = 1
path = "/result/capabilities/renameProvider/prepareProvider"
equals = true

[[lsp_assert]]
method = "textDocument/publishDiagnostics"
occurrence = 0
path = "/params/diagnostics"
length = 2

[[lsp_assert]]
method = "textDocument/publishDiagnostics"
occurrence = 0
path = "/params/diagnostics/0/code"
equals = "name.invalid_case"

[[lsp_assert]]
method = "textDocument/publishDiagnostics"
occurrence = 0
path = "/params/diagnostics/1/code"
equals = "name.invalid_case"

[[lsp_assert]]
id = 2
path = "/result/range/start/line"
equals = 5

[[lsp_assert]]
id = 3
path = "/result"
length = 3

[[lsp_assert]]
id = 4
path = "/result/start/line"
equals = 6

[[lsp_assert]]
id = 5
path = "/result/changes/$workspace_file_uri:main.veln"
equals_json_file = "case-text/rename-handler-context-binding-edits.json"

[[lsp_assert]]
id = 6
path = "/result/range/start/line"
equals = 7

[[lsp_assert]]
id = 7
path = "/result"
length = 2

[[lsp_assert]]
id = 8
path = "/result/start/line"
equals = 7

[[lsp_assert]]
id = 9
path = "/result/changes/$workspace_file_uri:main.veln"
equals_json_file = "case-text/rename-handler-clause-binding-edits.json"

[[lsp_assert]]
id = 10
path = "/result"
equals = null
