command = ["lsp"]
stdin_jsonrpc_file = "requests.json"
exit = 0

[stdout]
contains = ["\"definitionProvider\":true"]
not_contains = ["crates/veln-stdlib", "target/debug"]

[stderr]
format = "empty"

[[lsp_assert]]
id = 2
path = "/result/uri"
contains = "veln-pkg:///std/snapshot/"

[[lsp_assert]]
id = 2
path = "/result/uri"
contains = "/net.veln"

[[lsp_assert]]
id = 2
path = "/result/range"
source_range = {"id":100,"path":"/result","declaration":"pub fn connect(","symbol":"connect"}
