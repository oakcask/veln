command = ["lsp"]
source_errors = "expected"
stdin_jsonrpc_file = "requests.json"
exit = 0

[stderr]
format = "empty"

[[lsp_assert]]
id = 2
path = "/result/uri"
workspace_file_uri = "foreign.veln"

[[lsp_assert]]
id = 2
path = "/result/range"
equals = {"start":{"line":1,"character":2},"end":{"line":1,"character":5}}

[[lsp_assert]]
id = 3
path = "/result"
length = 2

[[lsp_assert]]
id = 3
path = "/result/0/uri"
workspace_file_uri = "foreign.veln"

[[lsp_assert]]
id = 3
path = "/result/0/range"
equals = {"start":{"line":5,"character":25},"end":{"line":5,"character":28}}

[[lsp_assert]]
id = 3
path = "/result/1/uri"
workspace_file_uri = "main.veln"

[[lsp_assert]]
id = 3
path = "/result/1/range"
equals = {"start":{"line":3,"character":36},"end":{"line":3,"character":39}}

[[lsp_assert]]
id = 4
path = "/result"
length = 3

[[lsp_assert]]
id = 4
path = "/result/0/range"
equals = {"start":{"line":1,"character":2},"end":{"line":1,"character":5}}

[[lsp_assert]]
id = 4
path = "/result/1/range"
equals = {"start":{"line":5,"character":25},"end":{"line":5,"character":28}}

[[lsp_assert]]
id = 4
path = "/result/2/range"
equals = {"start":{"line":3,"character":36},"end":{"line":3,"character":39}}
