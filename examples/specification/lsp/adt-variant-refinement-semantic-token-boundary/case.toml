# This fixture exercises the public stdio LSP projection independently of
# standard-library behavior.
command = ["lsp"]
stdin_jsonrpc_file = "requests.json"
exit = 0

[stderr]
format = "empty"

[[lsp_assert]]
id = 1
path = "/result/capabilities/semanticTokensProvider/full"
equals = true

[[lsp_assert]]
id = 2
path = "/result/data/47"
equals = 5

[[lsp_assert]]
id = 2
path = "/result/data/48"
equals = 5

[[lsp_assert]]
id = 2
path = "/result/data/53"
equals = 11

