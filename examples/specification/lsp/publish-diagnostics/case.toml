command = ["lsp"]
stdin_jsonrpc_file = "requests.json"
exit = 0

[stderr]
format = "empty"

[[lsp_assert]]
id = 1
path = "/result/capabilities/semanticTokensProvider/full"
equals = true

[[lsp_assert]]
method = "textDocument/publishDiagnostics"
occurrence = 0
path = "/params/diagnostics/1/code"
equals = "name.unresolved"

[[lsp_assert]]
method = "textDocument/publishDiagnostics"
occurrence = 0
path = "/params/diagnostics/1/code"
contains = "unresolved"

[[lsp_assert]]
method = "textDocument/publishDiagnostics"
occurrence = 1
path = "/params/diagnostics"
equals_json_file = "case-text/empty-diagnostics.json"

[[lsp_assert]]
id = 2
path = ""
equals = {"result":null,"id":2,"jsonrpc":"2.0"}
