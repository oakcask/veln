command = ["lsp"]
stdin_jsonrpc_file = "requests.json"
exit = 0

[stdout]

contains_file = "case-text/stdout-contains-1.txt"
contains = ["\"id\":4,\"result\":null"]
not_contains = ["materialized/mono", "packages/lib"]

[stderr]
format = "empty"

[[lsp_assert]]
id = 2
path = "/result/uri"
contains = "veln-pkg:///example%2Fpkg/snapshot/"

[[lsp_assert]]
id = 2
path = "/result/uri"
contains = "/math.veln"

[[lsp_assert]]
id = 2
path = "/result/range"
equals = {"start":{"line":0,"character":7},"end":{"line":0,"character":14}}
