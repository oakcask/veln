command = ["lsp"]
stdin_jsonrpc_file = "requests.json"
exit = 0

[stderr]
format = "empty"

[stdout]
contains = [
  "\"newText\":\"Entry\"",
  "\"newText\":\"Created\"",
  "\"newText\":\"adapt\"",
  "\"newText\":\"input\"",
  "\"newText\":\"RightEntry\"",
  "right.veln",
]
not_contains = [
  "\"line\":19,\"character\":7",
  "\"line\":20,\"character\":2",
  "\"line\":3,\"character\":20",
  "left.veln\":[{\"range\"",
]

[[lsp_assert]]
id = 6
path = "/error/code"
equals = -32602

[[lsp_assert]]
id = 6
path = "/error/data/code"
equals = "rename.invalid_case"

[[lsp_assert]]
id = 6
path = "/error/data/details/symbol_class"
equals = "type"

[[lsp_assert]]
id = 6
path = "/error/data/details/requested_name"
equals = "entry"

[[lsp_assert]]
id = 6
path = "/error/data/details/required_initial"
equals = "ascii_uppercase"

[[lsp_assert]]
id = 7
path = "/error/data/details/symbol_class"
equals = "constructor"

[[lsp_assert]]
