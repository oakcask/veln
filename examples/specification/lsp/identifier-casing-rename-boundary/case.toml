command = ["lsp"]
stdin_jsonrpc_file = "requests.json"
exit = 0

[stderr]
format = "empty"

[stdout]
contains = [
  "\"newText\":\"Entry\"",
  "\"newText\":\"Created\"",
  "\"newText\":\"adapt\"",
  "\"newText\":\"input\"",
  "\"newText\":\"RightEntry\"",
  "\"newText\":\"Available\"",
  "\"line\":8,\"character\":2",
  "\"line\":25,\"character\":2",
  "\"line\":30,\"character\":4",
  "right.veln",
]
not_contains = [
  "\"line\":35,\"character\":7",
  "\"line\":36,\"character\":2",
  "\"line\":3,\"character\":20",
  "left.veln\":[{\"range\"",
]

