command = ["lsp"]
source_errors = "expected"
stdin_jsonrpc_file = "requests.json"
exit = 0

[stdout]
not_contains = ["crates/veln-stdlib", "target/debug"]

[stderr]
format = "empty"

[[lsp_assert]]
id = 5
path = "/result/range/start"
equals = {"line":10,"character":24}

[[lsp_assert]]
id = 5
path = "/result/uri"
workspace_file_uri = "main.veln"

[[lsp_assert]]
id = 6
path = "/result/range/start"
equals = {"line":15,"character":6}

[[lsp_assert]]
id = 6
path = "/result/uri"
workspace_file_uri = "main.veln"

[[lsp_assert]]
id = 4
path = "/result"
equals_response = {"id":2,"path":"/result"}

[[lsp_assert]]
id = 7
path = "/result/uri"
contains = "/http2/diagnostic.veln"

[[lsp_assert]]
id = 8
path = "/result"
equals = null

[[lsp_assert]]
id = 10
path = "/result"
equals = null

[[lsp_assert]]
id = 9
path = "/error/code"
equals = -32602

[[lsp_assert]]
id = 2
path = "/result/uri"
contains = "veln-pkg:///std/snapshot/"

[[lsp_assert]]
id = 2
path = "/result/uri"
contains = "/prelude.veln"

[[lsp_assert]]
id = 2
path = "/result/range"
source_range = {"id":3,"path":"/result","declaration":"pub fn byte(","symbol":"byte"}
