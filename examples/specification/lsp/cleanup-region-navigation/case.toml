[[lsp_assert]]
id = 10
path = "/result"
length = 3

[[lsp_assert]]
id = 10
path = "/result/1/range"
equals = {"start":{"line":24,"character":18},"end":{"line":24,"character":26}}

[[lsp_assert]]
id = 10
path = "/result/2/range"
equals = {"start":{"line":27,"character":2},"end":{"line":27,"character":10}}

[[lsp_assert]]
id = 11
path = "/result/changes/$workspace_file_uri:main.veln"
length = 3

[[lsp_assert]]
id = 12
path = "/error/data/code"
equals = "rename.conflict"

[[lsp_assert]]
id = 12
path = "/error/data/details/symbol_class"
equals = "value_binding"

[[lsp_assert]]
id = 12
path = "/error/data/details/requested_name"
