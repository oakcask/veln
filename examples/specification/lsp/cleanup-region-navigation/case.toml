equals = {"start":{"line":33,"character":6},"end":{"line":33,"character":11}}

[[lsp_assert]]
id = 13
path = "/result/changes/$workspace_file_uri:main.veln/1/range"
equals = {"start":{"line":34,"character":2},"end":{"line":34,"character":7}}

[[lsp_assert]]
id = 14
path = "/result"
equals = {"start":{"line":11,"character":2},"end":{"line":11,"character":10}}

[[lsp_assert]]
id = 15
path = "/result"
